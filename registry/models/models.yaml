version: 0.3
status: public
reviewed_at: 2026-08-09

registry_rules:
  - provider_claims_are_not_teo_benchmark_results
  - exact_model_identifiers_must_be_rechecked_before_execution
  - preview_and_limited_availability_status_must_be_visible
  - routing_defaults_require_capability_and_verification_fit
  - context_and_output_limits_are_provider_reported_until_observed
  - reasoning_effort_must_be_selected_intentionally_and_preserved_in_dispatch
  - connection_method_must_not_change_model_or_effort_selection

models:
  gpt-5.6-sol:
    provider: openai
    availability: current
    provider_description: frontier model for complex professional work
    teo_routing_role: complex reasoning, coding, planning, and escalation
    input_modalities: [text, image]
    output_modalities: [text]
    reasoning_control: reasoning.effort
    reasoning_levels: [none, low, medium, high, xhigh, max]
    reasoning_default: medium
    additional_execution_modes: [standard, pro]
    context_window_tokens: 1050000
    max_output_tokens: 128000
    knowledge_cutoff: 2026-02-16
    documented_tools: [functions, web_search, file_search, computer_use]
    evidence_type: provider_claim
    source: https://developers.openai.com/api/docs/models/gpt-5.6-sol

  gpt-5.6-terra:
