version: 0.1
status: public
reviewed_at: 2026-08-05

registry_rules:
  - provider_claims_are_not_teo_benchmark_results
  - exact_model_identifiers_must_be_rechecked_before_execution
  - preview_and_limited_availability_status_must_be_visible
  - routing_defaults_require_capability_and_verification_fit
  - context_and_output_limits_are_provider_reported_until_observed

