              "agent/worker-implementation-topology"
            )
            # END LEGACY_AGENT_BRANCH_SNAPSHOT

            for branch in "${legacy_branches[@]}"; do
              delete_if_safe "$branch"
            done
          fi

          if [[ "$HEAD_REF" == "agent/branch-retention-v2" ]]; then
            # BEGIN POST_V1_TEMPORARY_BRANCH_SNAPSHOT
            post_v1_branches=(
              "agent/pr108-progress-reconcile"
              "audit/authority-temporal-causality"
              "audit/mission-control-finalization-authority-recovery-mutations"
              "capsule/0009-evidence-becomes-authority"
              "cleanup/remove-specialist-origin-references"
              "governance/reframe-human-calibration"
            )
            # END POST_V1_TEMPORARY_BRANCH_SNAPSHOT

            for branch in "${post_v1_branches[@]}"; do
              delete_if_safe "$branch"
            done

            delete_exact_probe_if_safe "noop-check"
          fi

          delete_if_safe "$HEAD_REF"
