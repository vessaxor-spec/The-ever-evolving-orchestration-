              "agent/refresh-ai-mediated-discovery"
              "agent/refresh-native-operations"
              "agent/refresh-regulated-specialists"
              "agent/regulated-evidence-pilot"
              "agent/regulated-refresh-final"
              "agent/regulated-refresh-verified"
              "agent/remove-v1-release-workflow"
              "agent/repository-layout-constitution"
              "agent/repository-wide-specialist-remediation"
              "agent/research-analytics-security-final"
              "agent/resolve-code-review-worker"
              "agent/roadmap-intelligence-control-plane"
              "agent/root-research-normalization"
              "agent/specialist-constitutional-integration"
              "agent/specialist-freshness-foundation"
              "agent/specialist-freshness-foundation-final"
              "agent/specialist-freshness-foundation-v2"
              "agent/specialist-freshness-foundation-v3"
              "agent/specialist-freshness-foundation-v4"
              "agent/stateful-provider-circuit-breaker"
              "agent/update-readme-current-state"
              "agent/update-readme-machine-panel-evidence"
              "agent/update-readme-operational-evidence"
              "agent/update-readme-v1-release"
