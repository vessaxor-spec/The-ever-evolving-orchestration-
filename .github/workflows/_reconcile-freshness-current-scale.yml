name: Reconcile Freshness Current Scale

on:
  push:
    branches:
      - agent/host-integration-freshness-binding
    paths:
      - .github/workflows/_reconcile-freshness-current-scale.yml
      - research/runtime/_reconcile_freshness_current_scale.py

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-freshness-binding'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-freshness-binding

      - name: Apply exact current-scale reconciliation
        run: python research/runtime/_reconcile_freshness_current_scale.py

      - name: Prove two-file write scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'docs/stewardship/progress-tracker.md',
              'tests/test_documentation_control_plane_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected current-scale write scope: {sorted(actual)}')
          PY
          git diff --check

      - name: Commit exact current-scale reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/stewardship/progress-tracker.md tests/test_documentation_control_plane_truth.py
          git diff --cached --check
          git commit -m 'Reconcile freshness current validation scale'
          git push origin HEAD:refs/heads/agent/host-integration-freshness-binding
