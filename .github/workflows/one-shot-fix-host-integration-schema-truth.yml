name: One-shot Host Integration schema truth fix

on:
  push:
    branches:
      - agent/host-integration-protocol-0-1-reconciled

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-protocol-0-1-reconciled
      - name: Fix current schema truth constant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_documentation_control_plane_truth.py')
          s = p.read_text(encoding='utf-8')
          old_constant = 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 558\nEXPECTED_CURRENT_VALIDATED_CI_RUN = 806'
          new_constant = 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 558\nEXPECTED_CURRENT_VALIDATED_SCHEMAS = 42\nEXPECTED_CURRENT_VALIDATED_CI_RUN = 806'
          if s.count(old_constant) != 1:
              raise SystemExit(f'constant guard failed: {s.count(old_constant)}')
          s = s.replace(old_constant, new_constant, 1)
          old_phrase = 'f"| Current validated scale | {EXPECTED_CURRENT_VALIDATED_TESTS} tests passed, {EXPECTED_CURRENT_VALIDATED_TRACKED_FILES} tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #{EXPECTED_CURRENT_VALIDATED_CI_RUN} |"'
          new_phrase = 'f"| Current validated scale | {EXPECTED_CURRENT_VALIDATED_TESTS} tests passed, {EXPECTED_CURRENT_VALIDATED_TRACKED_FILES} tracked-file layout checks, {EXPECTED_CURRENT_VALIDATED_SCHEMAS} schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #{EXPECTED_CURRENT_VALIDATED_CI_RUN} |"'
          if s.count(old_phrase) != 1:
              raise SystemExit(f'phrase guard failed: {s.count(old_phrase)}')
          p.write_text(s.replace(old_phrase, new_phrase, 1), encoding='utf-8')
          PY
          python -m compileall -q tests
          git diff --check
      - name: Commit truth-test fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_documentation_control_plane_truth.py
          git diff --cached --check
          git commit -m 'Fix current schema count truth assertion'
          git push origin HEAD:agent/host-integration-protocol-0-1-reconciled
