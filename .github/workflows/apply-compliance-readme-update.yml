name: Apply compliance milestone documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/document-compliance-milestone'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v6
        with:
          ref: agent/document-compliance-milestone
          fetch-depth: 0

      - name: Apply guarded README update
        run: python tools/apply_compliance_readme_update.py

      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Document dedicated compliance worker"
          git push origin HEAD:agent/document-compliance-milestone
