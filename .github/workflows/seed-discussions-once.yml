name: Seed GitHub Discussions Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seed-discussions-once.yml"

permissions:
  contents: read
  discussions: write

jobs:
  seed:
    name: Seed starter discussions
    runs-on: ubuntu-24.04
    steps:
      - name: Create starter discussions idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"

          query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){id discussionCategories(first:25){nodes{id name slug}} discussions(first:100){nodes{title url}}}}'
          state="$(gh api graphql -f query="$query" -F owner="$owner" -F repo="$repo")"
          repository_id="$(jq -r '.data.repository.id' <<<"$state")"

          if [[ -z "$repository_id" || "$repository_id" == "null" ]]; then
            echo "Repository node ID could not be resolved"
            exit 1
          fi

          create_discussion() {
            local slug="$1"
            local title="$2"
            local body="$3"
            local category_id
            local mutation

            if jq -e --arg title "$title" '.data.repository.discussions.nodes[]? | select(.title == $title)' <<<"$state" >/dev/null; then
              echo "Already exists: $title"
              return 0
            fi

            category_id="$(jq -r --arg slug "$slug" '.data.repository.discussionCategories.nodes[]? | select(.slug == $slug) | .id' <<<"$state" | head -n1)"
            if [[ -z "$category_id" || "$category_id" == "null" ]]; then
              echo "Required Discussion category not found: $slug"
              exit 1
            fi

            mutation='mutation($repositoryId:ID!,$categoryId:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repositoryId,categoryId:$categoryId,title:$title,body:$body}){discussion{title url}}}'

            echo "Creating: $title"
            gh api graphql \
              -f query="$mutation" \
              -f repositoryId="$repository_id" \
              -f categoryId="$category_id" \
              -f title="$title" \
              -f body="$body" \
              --jq '.data.createDiscussion.discussion.url'
          }

          announcement_body="$(cat <<'EOF'
          TEO now has a dedicated public space for questions, early proposals, research, demonstrations, and unresolved design topics.

          **Use Discussions when the goal is exploration.** Use Issues when a defect is reproducible or work has been accepted and scoped. Implementation still moves through pull requests, and TEO's evidence, authority, and verification requirements remain unchanged.

          The starting categories are:

          - **Ideas** — early proposals and possible improvements;
          - **Q&A** — architecture, routing, governance, specialists, implementation, or contribution questions;
          - **Research & Exploration** — external projects, papers, standards, benchmarks, model/provider evidence, and experiments;
          - **Show and tell** — implementations, integrations, experiments, and demonstrations;
          - **General** — relevant conversation that does not fit a narrower category.

          The canonical Discussion boundary and lifecycle are documented in [`community/discussions/README.md`](https://github.com/vessaxor-spec/The-ever-evolving-orchestration-/blob/main/community/discussions/README.md).

          Public discussion is evidence input, not automatic authority. Good challenges, contrary evidence, reproducible findings, and concrete alternatives are welcome.
          EOF
          )"

          general_body="$(cat <<'EOF'
          TEO is most useful when tested against real orchestration problems rather than discussed only in the abstract.

          If you are building, evaluating, or researching an orchestration system, introduce the problem you are working on and tell us:

          - what you are trying to orchestrate;
          - where existing approaches become brittle, opaque, unsafe, or difficult to verify;
          - which part of TEO you are evaluating or questioning;
          - what evidence, failure case, or constraint would make the discussion useful.

          You do not need to be using TEO already. Comparisons, disagreements, and alternative architectures are useful when they are specific and evidence-backed.

          Please keep proprietary workflows, credentials, private prompts, confidential benchmarks, employer-specific material, and identifying operational data out of public threads.
          EOF
          )"

          research_body="$(cat <<'EOF'
          This thread is an open watchlist for external evidence that may help TEO improve without turning every interesting idea into an architectural change.

          Share a project, repository, paper, benchmark, standard, model/provider capability, experiment, or architecture pattern that deserves examination. For each suggestion, try to include:

          - **Source** — preferably the primary/current source;
          - **Finding** — what the evidence actually shows;
          - **TEO relevance** — routing, responsibility, verification, authority, recovery, runtime, evidence, or community stewardship;
          - **Limitations** — uncertainty, contrary evidence, freshness limits, or conditions where the finding may not hold.

          Areas of particular interest include responsibility-first orchestration, provider-neutral routing, independent verification, fail-closed recovery, evidence-bearing finalization, runtime authority boundaries, and empirical model-routing evaluation.

          Research is an input to diagnosis and decision. It does not automatically become policy, routing, or implementation authority.
          EOF
          )"

          ideas_body="$(cat <<'EOF'
          TEO has a deliberately strong control-plane architecture, but it should continue to earn that complexity through evidence.

          Where do you see the most important gap or unnecessary friction today?

          Strong proposals should identify:

          - the current limitation or failure mode;
          - the proposed direction;
          - evidence or alternatives worth comparing;
          - what existing TEO invariant or capability must be preserved;
          - how we could verify that the change is actually better.

          This is intentionally an exploration thread. A promising idea becomes an Issue only after it is sufficiently evidenced and scoped; implementation then moves through a reviewed pull request.
          EOF
          )"

          create_discussion "announcements" "TEO Discussions are open" "$announcement_body"
          create_discussion "general" "Welcome — what are you working on with orchestration?" "$general_body"
          create_discussion "research-exploration" "Research watch: what should TEO study next?" "$research_body"
          create_discussion "ideas" "Where should TEO improve next?" "$ideas_body"
