name: Harden Integrated Assimilation Continuity

on:
  push:
    branches:
      - agent/host-integration-integrated-assimilation
    paths:
      - .github/workflows/_harden-integrated-assimilation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-integrated-assimilation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-integrated-assimilation
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Apply exact independent-review hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'research/runtime/host_integration_integrated_conformance.py',
              '''REQUIRED_OPEN_SURFACES = frozenset(\n    {\n        "production_remote_authenticity",\n        "restart_durable_distributed_state",\n        "compromised_host_bypass_resistance",\n    }\n)''',
              '''REQUIRED_OPEN_SURFACES = frozenset(\n    {\n        "production_remote_authenticity",\n        "restart_durable_distributed_state",\n        "compromised_host_bypass_resistance",\n        "production_scheduler_enforcement",\n        "tenant_account_credential_binding",\n        "dynamic_hook_plugin_authority_discovery",\n        "cross_session_continued_use_proof",\n    }\n)''',
              'open surfaces',
          )
          replace_once(
              'research/runtime/host_integration_integrated_conformance.py',
              '''        if len(self._governed_receipts) < 2:\n            raise IntegratedHostConformanceError(\n                "conformance requires repeated post-assimilation TEO use, not a one-time integration demo"\n            )\n        missing_controls = REQUIRED_NEGATIVE_CONTROLS - self._negative_controls''',
              '''        if len(self._governed_receipts) < 2:\n            raise IntegratedHostConformanceError(\n                "conformance requires repeated post-assimilation TEO use, not a one-time integration demo"\n            )\n        governed_task_ids = {receipt.task_id for receipt in self._governed_receipts}\n        if len(governed_task_ids) < 2:\n            raise IntegratedHostConformanceError(\n                "conformance requires at least two distinct post-assimilation task IDs; replaying one demo is not continuity evidence"\n            )\n        missing_controls = REQUIRED_NEGATIVE_CONTROLS - self._negative_controls''',
              'distinct task continuity',
          )
          replace_once(
              'tests/test_host_integration_integrated_conformance.py',
              '''def test_full_process_local_assimilation_and_integrated_premortem_replay(truth, tmp_path) -> None:\n''',
              '''def test_replaying_same_governed_task_cannot_prove_continuity(truth, tmp_path) -> None:\n    sandbox = make_sandbox(truth)\n    register_hook(sandbox)\n    sandbox.shadow_route(active_task("shadow-before-replayed-use"))\n    payload = active_task("same-demo-twice")\n    sandbox.governed_execute(payload, artifact_root=tmp_path)\n    sandbox.governed_execute(payload, artifact_root=tmp_path)\n    sandbox.prove_staged_scope_refusal()\n    sandbox.prove_revoked_admission_refusal()\n    sandbox.prove_artifact_mutation_refusal(artifact_root=tmp_path)\n    sandbox.prove_autonomy_and_human_authority()\n    sandbox.prove_recursion_refusal()\n\n    with pytest.raises(IntegratedHostConformanceError, match="two distinct post-assimilation task IDs"):\n        sandbox.claim_process_local_conformance()\n\n\ndef test_full_process_local_assimilation_and_integrated_premortem_replay(truth, tmp_path) -> None:\n''',
              'same-task replay test',
          )
          replace_once(
              'research/roadmaps/host-integration-assimilation-protocol.md',
              '''The research harness therefore requires repeated post-assimilation TEO use before it will emit a process-local integrated conformance result.\n''',
              '''The research harness therefore requires at least two governed receipts with **distinct task IDs** before it will emit a process-local integrated conformance result. Replaying the same setup/demo task twice is not continuity evidence.\n\nThe process-local harness still cannot prove that the second task occurred in a genuinely fresh session, that no hidden reminder was supplied, or that a host persisted its hook across restart. Those remain explicit cross-session/production evidence requirements even after the process-local result passes.\n''',
              'protocol continuity boundary',
          )
          replace_once(
              'research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md',
              '''- **at least two distinct post-assimilation governed executions**;\n''',
              '''- **at least two post-assimilation governed executions with distinct task IDs**;\n''',
              'evidence continuity wording',
          )
          PY
      - name: Prove exact four-file scope and targeted conformance
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'research/runtime/host_integration_integrated_conformance.py',
              'tests/test_host_integration_integrated_conformance.py',
              'research/roadmaps/host-integration-assimilation-protocol.md',
              'research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected hardening scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m pytest -q tests/test_host_integration_integrated_conformance.py
      - name: Commit only reviewed hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/runtime/host_integration_integrated_conformance.py tests/test_host_integration_integrated_conformance.py research/roadmaps/host-integration-assimilation-protocol.md research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md
          git diff --cached --check
          git commit -m 'Harden integrated assimilation continuity evidence'
          git push origin HEAD:refs/heads/agent/host-integration-integrated-assimilation
