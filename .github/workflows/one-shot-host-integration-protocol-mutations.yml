name: One-shot Host Integration Protocol mutations

on:
  push:
    branches:
      - agent/host-integration-protocol-0-1-reconciled

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-protocol-0-1-reconciled
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade 'pip==26.1.2'
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Run targeted mutation campaign
        run: python .github/scripts/host_integration_protocol_mutations.py
      - name: Confirm source restoration
        run: git diff --exit-code -- reference/implementations/python/src/teo_reference/host_integration_protocol.py
