name: ISO Resolution Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Resolve full regulated evidence registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Install pinned evidence environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Resolve declared authorities with production validator
        run: python -m teo_reference.evidence --repo-root . --resolve

      - name: Validate refresh-cycle history
        run: python -m teo_reference.evidence_refresh --repo-root .
