name: R4 Policy Topology Migration

on:
  push:
    branches:
      - agent/policy-topology

permissions:
  contents: write

concurrency:
  group: r4-policy-topology-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: agent/policy-topology

      - name: Apply R4 policy topology migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p policy/routing/core policy/routing/extensions policy/routing/activation docs/history/activation

          git mv policy/routing/routing.yaml policy/routing/core/routing.yaml
          git mv policy/routing/team-routing.yaml policy/routing/core/team-routing.yaml
          git mv policy/routing/specialist-model-routing.yaml policy/routing/core/specialist-model-routing.yaml

          git mv policy/routing/mission-control-routing.yaml policy/routing/extensions/mission-control-routing.yaml
          git mv policy/routing/research-routing.yaml policy/routing/extensions/research-routing.yaml
          git mv policy/routing/review-routing.yaml policy/routing/extensions/review-routing.yaml
          git mv policy/routing/principal-engineering-routing.yaml policy/routing/extensions/principal-engineering-routing.yaml
          git mv policy/routing/principal-engineering-team-routing.yaml policy/routing/extensions/principal-engineering-team-routing.yaml
          git mv policy/routing/specialist-spawn-routing.yaml policy/routing/extensions/specialist-spawn-routing.yaml
          git mv policy/routing/specialist-spawn-team-routing.yaml policy/routing/extensions/specialist-spawn-team-routing.yaml

          git mv policy/routing/principal-engineering-activation.yaml policy/routing/activation/principal-engineering.yaml

          git mv routing.yaml docs/history/activation/initial-routing-draft.yaml
          git mv policy/routing/principal-engineering-expansion.yaml docs/history/activation/principal-engineering-expansion.yaml
          git mv policy/routing/assurance-staging.yaml docs/history/activation/assurance-staging.yaml
          git mv policy/routing/final-specialist-tranche-staging.yaml docs/history/activation/final-specialist-tranche-staging.yaml
          git mv policy/routing/physical-systems-staging.yaml docs/history/activation/physical-systems-staging.yaml
          git mv policy/routing/platform-reliability-core-staging.yaml docs/history/activation/platform-reliability-core-staging.yaml
          git mv policy/routing/platform-reliability-operations-staging.yaml docs/history/activation/platform-reliability-operations-staging.yaml
          git mv policy/routing/systems-engineering-staging.yaml docs/history/activation/systems-engineering-staging.yaml

          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          ROOT = Path('.')

          PATH_MAP = {
              'policy/routing/routing.yaml': 'policy/routing/core/routing.yaml',
              'policy/routing/team-routing.yaml': 'policy/routing/core/team-routing.yaml',
              'policy/routing/specialist-model-routing.yaml': 'policy/routing/core/specialist-model-routing.yaml',
              'policy/routing/mission-control-routing.yaml': 'policy/routing/extensions/mission-control-routing.yaml',
              'policy/routing/research-routing.yaml': 'policy/routing/extensions/research-routing.yaml',
              'policy/routing/review-routing.yaml': 'policy/routing/extensions/review-routing.yaml',
              'policy/routing/principal-engineering-routing.yaml': 'policy/routing/extensions/principal-engineering-routing.yaml',
              'policy/routing/principal-engineering-team-routing.yaml': 'policy/routing/extensions/principal-engineering-team-routing.yaml',
              'policy/routing/specialist-spawn-routing.yaml': 'policy/routing/extensions/specialist-spawn-routing.yaml',
              'policy/routing/specialist-spawn-team-routing.yaml': 'policy/routing/extensions/specialist-spawn-team-routing.yaml',
              'policy/routing/principal-engineering-activation.yaml': 'policy/routing/activation/principal-engineering.yaml',
              'policy/routing/principal-engineering-expansion.yaml': 'docs/history/activation/principal-engineering-expansion.yaml',
              'policy/routing/assurance-staging.yaml': 'docs/history/activation/assurance-staging.yaml',
              'policy/routing/final-specialist-tranche-staging.yaml': 'docs/history/activation/final-specialist-tranche-staging.yaml',
              'policy/routing/physical-systems-staging.yaml': 'docs/history/activation/physical-systems-staging.yaml',
              'policy/routing/platform-reliability-core-staging.yaml': 'docs/history/activation/platform-reliability-core-staging.yaml',
              'policy/routing/platform-reliability-operations-staging.yaml': 'docs/history/activation/platform-reliability-operations-staging.yaml',
              'policy/routing/systems-engineering-staging.yaml': 'docs/history/activation/systems-engineering-staging.yaml',
          }

          def replace_once(text: str, old: str, new: str, context: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{context}: expected exactly one replacement, found {count}')
              return text.replace(old, new, 1)

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          for name in tracked:
              if name == '.github/workflows/r4-policy-topology-migrate.yml':
                  continue
              if name.startswith('docs/history/') or name.startswith('community/capsules/'):
                  continue
              path = ROOT / name
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              updated = text
              for old, new in PATH_MAP.items():
                  updated = updated.replace(old, new)
                  old_parts = old.split('/')
                  new_parts = new.split('/')
                  old_expr = ' / '.join(f'"{part}"' for part in old_parts)
                  new_expr = ' / '.join(f'"{part}"' for part in new_parts)
                  updated = updated.replace(old_expr, new_expr)
                  old_expr_single = ' / '.join(f"'{part}'" for part in old_parts)
                  new_expr_single = ' / '.join(f"'{part}'" for part in new_parts)
                  updated = updated.replace(old_expr_single, new_expr_single)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          layout_path = ROOT / 'policy/governance/repository-layout.yaml'
          layout = layout_path.read_text(encoding='utf-8')
          layout = replace_once(
              layout,
              '''  temporary_exceptions:\n    routing.yaml:\n      target: docs/history/activation/initial-routing-draft.yaml\n      migration_phase: R4\n    models.yaml:\n      target: policy/routing/implementation-defaults.yaml\n      migration_phase: R5\n''',
              '''  temporary_exceptions:\n    models.yaml:\n      target: policy/routing/implementation-defaults.yaml\n      migration_phase: R5\n''',
              'root temporary exceptions',
          )
          layout = replace_once(
              layout,
              '''    active_direct_files:\n      - routing.yaml\n      - team-routing.yaml\n      - mission-control-routing.yaml\n      - research-routing.yaml\n      - review-routing.yaml\n      - principal-engineering-routing.yaml\n      - principal-engineering-team-routing.yaml\n      - specialist-spawn-routing.yaml\n      - specialist-spawn-team-routing.yaml\n      - specialist-model-routing.yaml\n    temporary_direct_exceptions:\n      - assurance-staging.yaml\n      - final-specialist-tranche-staging.yaml\n      - physical-systems-staging.yaml\n      - platform-reliability-core-staging.yaml\n      - platform-reliability-operations-staging.yaml\n      - principal-engineering-activation.yaml\n      - principal-engineering-expansion.yaml\n      - systems-engineering-staging.yaml\n    approved_subdirectories:\n      - core\n      - extensions\n      - activation\n    future_rule: >-\n      A new direct YAML file is prohibited unless this policy is intentionally updated.\n      New durable routing policy should converge on core or extensions. Historical\n      activation state belongs under docs/history after its live dependencies are migrated.\n''',
              '''    active_direct_files: []\n    temporary_direct_exceptions: []\n    approved_subdirectories:\n      - core\n      - extensions\n      - activation\n    canonical_subdirectories:\n      core:\n        - routing.yaml\n        - specialist-model-routing.yaml\n        - team-routing.yaml\n      extensions:\n        - mission-control-routing.yaml\n        - principal-engineering-routing.yaml\n        - principal-engineering-team-routing.yaml\n        - research-routing.yaml\n        - review-routing.yaml\n        - specialist-spawn-routing.yaml\n        - specialist-spawn-team-routing.yaml\n      activation:\n        - principal-engineering.yaml\n    future_rule: >-\n      Direct routing YAML is prohibited. Canonical base policy belongs in core, additive\n      active routes belong in extensions, and current activation manifests belong in\n      activation. Superseded staging and activation state belongs under docs/history.\n''',
              'routing topology contract',
          )
          layout = replace_once(
              layout,
              '''    - R3_documentation_lifecycle_separation\n  current_phase: R4\n''',
              '''    - R3_documentation_lifecycle_separation\n    - R4_policy_topology\n  current_phase: R5\n''',
              'migration state',
          )
          layout_path.write_text(layout, encoding='utf-8')

          validator_path = ROOT / 'ci/validate_repository_layout.py'
          validator = validator_path.read_text(encoding='utf-8')
          validator = replace_once(
              validator,
              '''    routing_subdirs = set(\n        _string_list(routing["approved_subdirectories"], "policy_routing.approved_subdirectories")\n    )\n    for path in sorted(paths, key=str):\n        if len(path.parts) >= 4 and path.parts[:2] == ("policy", "routing"):\n            if path.parts[2] not in routing_subdirs:\n                errors.append(f"Unknown routing subdirectory {path.parts[2]} from {path}")\n''',
              '''    routing_subdirs = set(\n        _string_list(routing["approved_subdirectories"], "policy_routing.approved_subdirectories")\n    )\n    routing_contents = _mapping(\n        routing.get("canonical_subdirectories"),\n        "policy_routing.canonical_subdirectories",\n    )\n    if set(routing_contents) != routing_subdirs:\n        raise LayoutPolicyError(\n            "policy_routing.canonical_subdirectories must exactly match approved_subdirectories"\n        )\n    allowed_routing_files = {\n        subdir: set(_string_list(filenames, f"policy_routing.canonical_subdirectories.{subdir}"))\n        for subdir, filenames in routing_contents.items()\n    }\n    for path in sorted(paths, key=str):\n        if len(path.parts) >= 4 and path.parts[:2] == ("policy", "routing"):\n            subdir = path.parts[2]\n            if subdir not in routing_subdirs:\n                errors.append(f"Unknown routing subdirectory {subdir} from {path}")\n                continue\n            if len(path.parts) != 4:\n                errors.append(f"Nested routing path is not allowed below {subdir}: {path}")\n                continue\n            if path.name not in allowed_routing_files[subdir]:\n                errors.append(\n                    f"Undeclared routing file policy/routing/{subdir}/{path.name}; "\n                    "update routing topology governance intentionally before adding policy"\n                )\n''',
              'routing validator',
          )
          validator_path.write_text(validator, encoding='utf-8')

          routing_readme = ROOT / 'policy/routing/README.md'
          routing_readme.write_text(
              '''# Routing Policy\n\nThis directory contains current machine-readable routing authority. Its structure separates base policy, additive active extensions, and current activation manifests.\n\n## Canonical areas\n\n- [`core/`](core/) contains canonical base team, implementation, and specialist-model routing policy.\n- [`extensions/`](extensions/) contains additive active route families loaded alongside the core policy.\n- [`activation/`](activation/) contains current activation manifests that prove which staged topology has become active.\n\nSuperseded routing drafts, expansion plans, and staging manifests are historical evidence under [`docs/history/activation/`](../../docs/history/activation/). They do not provide current routing authority.\n\nThe reference implementation loads explicit canonical paths. It does not discover or load arbitrary YAML by directory traversal. New routing files require an intentional repository-layout policy update and corresponding conformance coverage.\n''',
              encoding='utf-8',
          )

          history_index = ROOT / 'docs/history/activation/README.md'
          history = history_index.read_text(encoding='utf-8')
          if '## Machine-readable records' not in history:
              history += '''\n## Machine-readable records\n\nThese YAML records preserve earlier routing, expansion, and staging state exactly as recorded. Their statuses and model assumptions may be obsolete and must not be treated as current routing policy.\n\n- [`initial-routing-draft.yaml`](initial-routing-draft.yaml)\n- [`principal-engineering-expansion.yaml`](principal-engineering-expansion.yaml)\n- [`assurance-staging.yaml`](assurance-staging.yaml)\n- [`final-specialist-tranche-staging.yaml`](final-specialist-tranche-staging.yaml)\n- [`physical-systems-staging.yaml`](physical-systems-staging.yaml)\n- [`platform-reliability-core-staging.yaml`](platform-reliability-core-staging.yaml)\n- [`platform-reliability-operations-staging.yaml`](platform-reliability-operations-staging.yaml)\n- [`systems-engineering-staging.yaml`](systems-engineering-staging.yaml)\n'''
          history_index.write_text(history, encoding='utf-8')

          changelog_path = ROOT / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          changed_anchor = '- reusable methodology is now separated from dated staging, activation, refresh, audit, and routing-recalibration history\n'
          if '- active routing policy is now separated into canonical core, extension, and activation namespaces\n' not in changelog:
              changelog = changelog.replace(
                  changed_anchor,
                  changed_anchor + '- active routing policy is now separated into canonical core, extension, and activation namespaces\n',
                  1,
              )
          changelog = changelog.replace(
              'Repository information-architecture migration has completed R1, R2, and R3. R4 policy topology is next.',
              'Repository information-architecture migration has completed R1, R2, R3, and R4. R5 worker and implementation topology is next.',
              1,
          )
          changelog = changelog.replace(
              'regression to retired R2 paths, and regression to retired R3 documentation locations',
              'regression to retired R2 paths, retired R3 documentation locations, and retired R4 routing locations',
              1,
          )
          changelog_path.write_text(changelog, encoding='utf-8')

          layout_tests = ROOT / 'tests/test_repository_layout.py'
          tests = layout_tests.read_text(encoding='utf-8')
          if 'R4_OLD_PATHS' not in tests:
              tests += '''\n\nR4_OLD_PATHS = {\n    "routing.yaml",\n    "policy/routing/routing.yaml",\n    "policy/routing/team-routing.yaml",\n    "policy/routing/specialist-model-routing.yaml",\n    "policy/routing/mission-control-routing.yaml",\n    "policy/routing/research-routing.yaml",\n    "policy/routing/review-routing.yaml",\n    "policy/routing/principal-engineering-routing.yaml",\n    "policy/routing/principal-engineering-team-routing.yaml",\n    "policy/routing/specialist-spawn-routing.yaml",\n    "policy/routing/specialist-spawn-team-routing.yaml",\n    "policy/routing/principal-engineering-activation.yaml",\n    "policy/routing/principal-engineering-expansion.yaml",\n    "policy/routing/assurance-staging.yaml",\n    "policy/routing/final-specialist-tranche-staging.yaml",\n    "policy/routing/physical-systems-staging.yaml",\n    "policy/routing/platform-reliability-core-staging.yaml",\n    "policy/routing/platform-reliability-operations-staging.yaml",\n    "policy/routing/systems-engineering-staging.yaml",\n}\n\nR4_CANONICAL_PATHS = {\n    "policy/routing/core/routing.yaml",\n    "policy/routing/core/team-routing.yaml",\n    "policy/routing/core/specialist-model-routing.yaml",\n    "policy/routing/extensions/mission-control-routing.yaml",\n    "policy/routing/extensions/research-routing.yaml",\n    "policy/routing/extensions/review-routing.yaml",\n    "policy/routing/extensions/principal-engineering-routing.yaml",\n    "policy/routing/extensions/principal-engineering-team-routing.yaml",\n    "policy/routing/extensions/specialist-spawn-routing.yaml",\n    "policy/routing/extensions/specialist-spawn-team-routing.yaml",\n    "policy/routing/activation/principal-engineering.yaml",\n    "docs/history/activation/initial-routing-draft.yaml",\n    "docs/history/activation/principal-engineering-expansion.yaml",\n    "docs/history/activation/assurance-staging.yaml",\n    "docs/history/activation/final-specialist-tranche-staging.yaml",\n    "docs/history/activation/physical-systems-staging.yaml",\n    "docs/history/activation/platform-reliability-core-staging.yaml",\n    "docs/history/activation/platform-reliability-operations-staging.yaml",\n    "docs/history/activation/systems-engineering-staging.yaml",\n}\n\ndef test_r4_policy_topology_paths_are_canonical() -> None:\n    paths = _current_paths()\n    assert R4_OLD_PATHS.isdisjoint(paths)\n    assert R4_CANONICAL_PATHS <= paths\n\ndef test_r4_policy_topology_has_no_temporary_exceptions() -> None:\n    policy = validator.load_policy(POLICY_PATH)\n    routing = policy["contracts"]["policy_routing"]\n    assert routing["active_direct_files"] == []\n    assert routing["temporary_direct_exceptions"] == []\n    assert set(routing["canonical_subdirectories"]) == {"core", "extensions", "activation"}\n    assert "R4_policy_topology" in policy["migration"]["completed_phases"]\n    assert policy["migration"]["current_phase"] == "R5"\n    assert "routing.yaml" not in policy["root"]["temporary_exceptions"]\n\ndef test_undeclared_nested_routing_policy_is_rejected() -> None:\n    policy = validator.load_policy(POLICY_PATH)\n    paths = _current_paths() | {"policy/routing/extensions/random-policy.yaml"}\n    errors = validator.validate_layout(paths, policy)\n    assert any("Undeclared routing file" in error for error in errors)\n'''
          layout_tests.write_text(tests, encoding='utf-8')

          # Guard against accidental changes to immutable or deferred surfaces.
          for forbidden in ('community/capsules/',):
              changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
              if any(name.startswith(forbidden) for name in changed):
                  raise SystemExit(f'R4 changed forbidden path: {forbidden}')
          PY

          rm .github/workflows/r4-policy-topology-migrate.yml

          git add -A
          git diff --cached --check

          python - <<'PY'
          from pathlib import Path

          required = [
              'policy/routing/core/routing.yaml',
              'policy/routing/core/team-routing.yaml',
              'policy/routing/core/specialist-model-routing.yaml',
              'policy/routing/extensions/mission-control-routing.yaml',
              'policy/routing/extensions/research-routing.yaml',
              'policy/routing/extensions/review-routing.yaml',
              'policy/routing/extensions/principal-engineering-routing.yaml',
              'policy/routing/extensions/principal-engineering-team-routing.yaml',
              'policy/routing/extensions/specialist-spawn-routing.yaml',
              'policy/routing/extensions/specialist-spawn-team-routing.yaml',
              'policy/routing/activation/principal-engineering.yaml',
              'docs/history/activation/initial-routing-draft.yaml',
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit('Missing R4 canonical paths: ' + ', '.join(missing))
          retired = [
              'routing.yaml',
              'policy/routing/routing.yaml',
              'policy/routing/team-routing.yaml',
              'policy/routing/specialist-model-routing.yaml',
              'policy/routing/principal-engineering-activation.yaml',
          ]
          remaining = [path for path in retired if Path(path).exists()]
          if remaining:
              raise SystemExit('Retired R4 paths still exist: ' + ', '.join(remaining))
          PY

          git commit -m "Normalize routing policy topology"
          git push origin HEAD:agent/policy-topology
