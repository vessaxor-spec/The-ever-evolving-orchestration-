name: Apply specialist freshness foundation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/specialist-freshness-foundation-v4'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/specialist-freshness-foundation-v4
          fetch-depth: 0

      - name: Apply guarded migration
        run: python tools/apply_specialist_freshness_foundation.py

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/specialists policy/specialists docs/methodology tests
          git diff --cached --quiet && exit 0
          git commit -m "Add specialist freshness foundation"
          git push origin HEAD:agent/specialist-freshness-foundation-v4
