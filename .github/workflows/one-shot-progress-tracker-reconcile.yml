name: One-shot documentation tracker reconciliation

on:
  push:
    branches:
      - agent/reconcile-documentation-after-evidence-qualification

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/reconcile-documentation-after-evidence-qualification
      - name: Reconcile tracker to clean documentation CI
        run: |
          python - <<'PY'
          from pathlib import Path

          tracker_path = Path('docs/stewardship/progress-tracker.md')
          tracker = tracker_path.read_text(encoding='utf-8')
          replacements = {
              '**Last reconciled:** 2026-08-16': '**Last reconciled:** 2026-08-17',
              'established by CI #765': 'established by CI #784',
          }
          for old, new in replacements.items():
              count = tracker.count(old)
              if count != 1:
                  raise SystemExit(f'tracker guard failed for {old!r}: {count}')
              tracker = tracker.replace(old, new, 1)
          tracker_path.write_text(tracker, encoding='utf-8')

          test_path = Path('tests/test_documentation_control_plane_truth.py')
          test = test_path.read_text(encoding='utf-8')
          old = 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 765'
          new = 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 784'
          if test.count(old) != 1:
              raise SystemExit(f'test guard failed for current CI constant: {test.count(old)}')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit tracker reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stewardship/progress-tracker.md tests/test_documentation_control_plane_truth.py
          git diff --cached --check
          git commit -m 'Reconcile documentation validation baseline'
          git push origin HEAD:agent/reconcile-documentation-after-evidence-qualification
