name: One-shot post-capsule tracker reconciliation

on:
  push:
    branches:
      - docs/reconcile-post-capsule-validation-scale

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: docs/reconcile-post-capsule-validation-scale
      - name: Reconcile post-capsule validation scale
        run: |
          python - <<'PY'
          from pathlib import Path

          tracker_path = Path('docs/stewardship/progress-tracker.md')
          tracker = tracker_path.read_text(encoding='utf-8')
          old = '967 tests passed, 551 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #784'
          new = '967 tests passed, 552 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #799'
          if tracker.count(old) != 1:
              raise SystemExit(f'tracker guard failed: {tracker.count(old)}')
          tracker_path.write_text(tracker.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_documentation_control_plane_truth.py')
          test = test_path.read_text(encoding='utf-8')
          replacements = {
              'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 551': 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 552',
              'EXPECTED_CURRENT_VALIDATED_CI_RUN = 784': 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 799',
          }
          for old, new in replacements.items():
              if test.count(old) != 1:
                  raise SystemExit(f'test guard failed for {old!r}: {test.count(old)}')
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stewardship/progress-tracker.md tests/test_documentation_control_plane_truth.py
          git diff --cached --check
          git commit -m 'Reconcile post-capsule validation scale'
          git push origin HEAD:docs/reconcile-post-capsule-validation-scale
