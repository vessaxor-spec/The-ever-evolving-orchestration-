Midjourney parameters and version compatibility are volatile vendor facts. Verify the current official Midjourney parameter list before recommending or generating production prompts.

As of the card's `tools_last_verified` date:

- `--sref` applies a style reference; `--sw` controls style-reference weight.
- Midjourney V7 uses Omni Reference through `--oref`; `--ow` controls Omni Reference weight.
- Older V6 workflows may use Character Reference through `--cref`; verify version compatibility before use.

Rules:

- Never use or document `--iref`; it is not an official Midjourney parameter.
- Treat parameter names, supported versions, weights, limits, and incompatibilities as live facts, not durable doctrine.
- Use official Midjourney documentation as the primary source. Third-party prompt guides may be used only to discover claims that are then verified officially.
- Record the verified Midjourney version and parameter set in any reusable prompt-library entry.
- If official documentation cannot be checked, describe the intended reference behavior without asserting a parameter name.''',
          )

