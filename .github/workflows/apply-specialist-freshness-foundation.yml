Do not name an unofficial "A10" algorithm as an Amazon product or specification. Amazon discovery can involve retrieval, ranking, recommendations, advertising, semantic understanding, and conversational shopping systems that change without a single stable public weighting model.

**Durable optimization factors:**

| Factor | Why it matters | Optimization action |
