| **Customer experience** | Returns, defects, delivery, and account health affect commercial performance | Monitor product quality, fulfillment, policy compliance, and post-purchase outcomes |
| **Advertising and external demand** | Paid and external traffic can create demand but do not guarantee organic rank | Measure incrementality and conversion rather than asserting a fixed ranking boost |

Rules:

- Verify current Amazon documentation, Seller Central guidance, release notes, and marketplace-specific behavior before asserting system names or ranking weights.
- Treat external observations about ranking as hypotheses unless Amazon has confirmed them.
- Optimize product understanding for both keyword retrieval and AI-mediated discovery without claiming a universal formula.''',
