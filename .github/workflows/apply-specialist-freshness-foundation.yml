Platform algorithms, monetization terms, ranking weights, product capabilities, and benchmark statistics are highly volatile. They must be verified for the target platform and task date before use.

Use this evidence order:

1. Official platform documentation, policy centers, release notes, transparency reports, or publicly released code.
2. Original measurement studies with disclosed methods and dates.
3. Reputable industry analysis that links to primary evidence.
4. Secondary summaries only as discovery leads.
5. SEO, affiliate, or AI-generated content farms must never be the sole support for a quantitative claim.

Rules:

- Do not present an exact algorithm weight unless the platform has published it and the publication is still current.
- Label opaque ranking behavior as inferred rather than known.
- Record the platform, evidence date, geography, account type, and measurement method for benchmarks.
- If current evidence cannot be verified, provide the durable strategy principle and state that the implementation detail remains uncertain.''',
