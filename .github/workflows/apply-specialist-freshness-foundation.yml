status: public-draft
reviewed_at: 2026-08-05

purpose: >-
  Keep authoritative specialist doctrine intact while preventing volatile facts,
  tools, versions, laws, prices, benchmarks, and platform behavior from being
  treated as timeless instructions.

principles:
  durable_doctrine:
    includes:
      - identity
      - purpose
      - responsibilities
      - non_responsibilities
      - methodologies
      - decision_frameworks
