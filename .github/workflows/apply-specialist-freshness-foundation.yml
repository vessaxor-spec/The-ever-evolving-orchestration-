name: Apply specialist freshness foundation

on:
  push:
    branches:
      - agent/specialist-freshness-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/specialist-freshness-foundation

      - name: Apply freshness architecture and critical corrections
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path.cwd()
          SPECIALISTS = ROOT / "community" / "specialists"


          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def write(path: str, content: str) -> None:
              file = ROOT / path
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content, encoding="utf-8")


          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old!r}; found {count}")
              write(path, text.replace(old, new, 1))


          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              start_count = text.count(start)
              end_count = text.count(end)
              if start_count != 1 or end_count != 1:
                  raise SystemExit(
                      f"Expected one section boundary in {path}: {start!r}={start_count}, {end!r}={end_count}"
                  )
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              write(path, before + replacement.rstrip() + "\n\n" + end + after)


          cards = sorted(
              path for path in SPECIALISTS.glob("*.md") if path.name != "README.md"
          )
          if len(cards) != 56:
              raise SystemExit(f"Expected 56 specialist cards, found {len(cards)}")

          # Additive freshness metadata for every authoritative role card.
          for card in cards:
              text = card.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise SystemExit(f"Missing frontmatter: {card}")
              frontmatter, body = text[4:].split("\n---\n", 1)
              lines = frontmatter.splitlines()
              if not any(line.startswith("freshness_policy:") for line in lines):
                  lines.append("freshness_policy: live-verification-required")
              if not any(line.startswith("tools_last_verified:") for line in lines):
                  lines.append("tools_last_verified: 2026-08-05")
              frontmatter = "\n".join(lines)
              text = f"---\n{frontmatter}\n---\n{body}"

              # Fixed years inside live-search templates age immediately. Keep named
              # historical editions elsewhere intact; normalize only query examples.
              marker = "### What to Search For"
              if marker in text:
                  before, search_and_after = text.split(marker, 1)
                  next_heading = re.search(r"\n### |\n## ", search_and_after)
                  if next_heading:
                      query_block = search_and_after[: next_heading.start()]
                      remainder = search_and_after[next_heading.start() :]
                  else:
                      query_block = search_and_after
                      remainder = ""
                  query_block = re.sub(r"\b(?:2025|2026)\b", "{current_year}", query_block)
                  text = before + marker + query_block + remainder

              card.write_text(text, encoding="utf-8")

          # Restore category values to the established taxonomy.
          replace_once(
              "community/specialists/incident-commander.md",
              "category: operations",
              "category: governance",
          )
          replace_once(
              "community/specialists/workflow-optimizer.md",
              "category: automation",
              "category: engineering-core",
          )
          replace_once(
              "community/specialists/spatial-terminal.md",
