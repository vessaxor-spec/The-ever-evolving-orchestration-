Browser privacy controls, third-party-cookie availability, identity products, consent requirements, and advertising APIs are highly volatile. Verify the current status for the target browser, geography, DSP, SSP, and campaign date before recommending activation.

**Durable targeting stack:**

| Layer | Method | Readiness action |
|---|---|---|
| **First-party data** | consented CRM, conversion, and customer-match data | Audit collection, lawful basis, consent, normalization, and match quality |
| **Contextual targeting** | content category, topic, placement, and semantic context | Validate inventory quality and suitability without depending on cross-site identity |
| **Publisher and identity signals** | publisher-provided audiences or supported identity solutions | Verify current platform support, contracts, match rates, and privacy obligations |
| **Modeled measurement** | modeled conversions, incrementality, and aggregate reporting | Document model assumptions, uncertainty, and platform-specific limitations |

Rules:

- Do not state that third-party-cookie deprecation is complete without verifying the current browser policy.
- Do not instruct users to enable Topics, Protected Audience, Attribution Reporting, or any other Privacy Sandbox API without checking Google's current official feature-status page and the target DSP's current support.
- Retired, deprecated, experimental, or unavailable APIs must not appear as required activation steps.
- Prefer first-party data quality, contextual relevance, consented publisher signals, experiments, and incrementality over dependence on a single identity mechanism.
- State the verification date and source whenever describing browser or advertising-platform privacy capabilities.''',
