          write(
              "docs/methodology/specialist-freshness.md",
              '''# Specialist Freshness and Source Authority

TEO specialist role cards preserve practitioner-grade identity, protocols, responsibilities, safety boundaries, and handoffs. They are not permanent databases of current product behavior, law, pricing, versions, or platform algorithms.

## Two-layer rule

### Durable doctrine stays in the role card

Keep the specialist's methodology, decision framework, authority boundaries, quality gates, collaboration rules, outputs, and examples intact.

### Volatile specifics require current evidence

Verify laws, standards, adopted editions, APIs, versions, model capabilities, prices, fees, ranking behavior, benchmarks, licensing, and tool-maintenance status when the task depends on them.

A dated value in a role card is context, not permission to skip verification.

## Authoring rules

1. Do not inline a volatile fact when the same instruction can require a current lookup.
2. Prefer official or primary sources. Secondary sources may help discover a claim but do not establish it.
3. Do not replace one unsupported precise number with another.
4. State jurisdiction, applicability, product version, platform, and evidence date when they affect correctness.
5. Treat words such as `current`, `latest`, `always`, `required`, and exact percentages as evidence-bearing claims.
6. When a vendor feature is retired, remove the action rather than merely marking it old.
7. When evidence cannot be verified, preserve the durable method and state the uncertainty.

## Risk-sensitive behavior

High- and critical-risk specialists must verify current primary authority before producing consequential legal, tax, lending, compliance, security, safety, or engineering-standard conclusions.

For standards and building codes, distinguish:

- latest published edition
- edition adopted by the governing jurisdiction
- edition required by contract
- transition or coexistence rules

For opaque algorithms, describe observed or durable optimization principles without inventing exact weights.

## Source hierarchy

1. Regulator, standards body, primary law, official vendor documentation, official release notes.
2. Original research, maintained advisory databases, authoritative technical publications.
3. Reputable industry analysis with links to primary evidence.
4. Secondary summaries for discovery only.
5. SEO, affiliate, or unattributed AI-generated content must never be sole support.

## Maintenance metadata

Each role card declares:

- `freshness_policy: live-verification-required`
- `tools_last_verified: YYYY-MM-DD`

The date records the last systematic tool-list review. It does not waive live verification.

## Search-template rule

Research query templates use `{current_year}`, `latest`, `current stable`, or an explicit task date. They do not embed the year in which the card happened to be written, except when deliberately researching a named historical event or edition.

## Preservation

Freshness controls are additive. They must not compress, generalize, or weaken the authoritative specialist specification. When current facts change, update the volatile assertion or evidence record while preserving the specialist's durable competence.
''',
          )

          write(
              "tests/test_specialist_freshness.py",
              '''from __future__ import annotations

import datetime as dt
import re
from pathlib import Path

import yaml


ROOT = Path(__file__).resolve().parents[1]
SPECIALISTS = ROOT / "community" / "specialists"
POLICY = ROOT / "policy" / "specialists" / "freshness.yaml"


def cards() -> list[Path]:
    return sorted(path for path in SPECIALISTS.glob("*.md") if path.name != "README.md")


def text(name: str) -> str:
    return (SPECIALISTS / name).read_text(encoding="utf-8")


def frontmatter(path: Path) -> dict[str, object]:
    raw = path.read_text(encoding="utf-8")
    return yaml.safe_load(raw.split("---", 2)[1])


def what_to_search_for(raw: str) -> str:
    marker = "### What to Search For"
    if marker not in raw:
        return ""
    block = raw.split(marker, 1)[1]
    match = re.search(r"\n### |\n## ", block)
    return block[: match.start()] if match else block


def test_every_specialist_declares_freshness_metadata() -> None:
    roster = cards()
    assert len(roster) == 56

    for card in roster:
        metadata = frontmatter(card)
        assert metadata["freshness_policy"] == "live-verification-required"
        verified = metadata["tools_last_verified"]
        if isinstance(verified, str):
            verified = dt.date.fromisoformat(verified)
        assert isinstance(verified, dt.date)


def test_search_templates_do_not_freeze_authoring_year() -> None:
    for card in cards():
        block = what_to_search_for(card.read_text(encoding="utf-8"))
        assert "2025" not in block, card.name
        assert "2026" not in block, card.name


def test_corrected_categories_use_existing_taxonomy() -> None:
    assert frontmatter(SPECIALISTS / "incident-commander.md")["category"] == "governance"
    assert frontmatter(SPECIALISTS / "workflow-optimizer.md")["category"] == "engineering-core"
    assert frontmatter(SPECIALISTS / "spatial-terminal.md")["category"] == "engineering-specialized"


def test_known_false_or_retired_instructions_are_absent() -> None:
    combined = "\n".join(card.read_text(encoding="utf-8") for card in cards())

    banned = [
        "--iref",
        "Replies worth 150x likes",
        "Third-party cookie deprecation is complete",
        "Google's Privacy Sandbox (Topics API)",
        "## A9/A10 Algorithm Factors",
        "commonly called A10",
        "| SLSA 4 |",
        "Airflow SLA callbacks",
        "FIA: Fit/Impact/Authority",
        "  - async-std",
        "`async-std`:",
        "packed_simd",
    ]
    for phrase in banned:
        assert phrase not in combined, phrase


def test_freshness_policy_has_required_controls() -> None:
    policy = yaml.safe_load(POLICY.read_text(encoding="utf-8"))
    assert policy["principles"]["durable_doctrine"]
    assert policy["principles"]["volatile_facts"]
    assert policy["source_authority"][0]["tier"] == 1
    assert policy["failure_behavior"]["unavailable_current_evidence"] == "do_not_assert_volatile_fact"
''',
          )
