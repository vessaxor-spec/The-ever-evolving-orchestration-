name: R5 Staging Test Path Correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'agent/worker-implementation-topology' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: agent/worker-implementation-topology
      - name: Correct historical staging test consumers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/test_platform_reliability_core_staging.py': (
                  'worker_path = REPO_ROOT / worker_record["path"]',
                  'worker_path = REPO_ROOT / "community" / "workers" / "extensions" / "platform-reliability-core-workers.yaml"',
              ),
              'tests/test_platform_reliability_operations_staging.py': (
                  'worker_path = REPO_ROOT / worker_record["path"]',
                  'worker_path = REPO_ROOT / "community" / "workers" / "extensions" / "platform-reliability-operations-workers.yaml"',
              ),
              'tests/test_systems_engineering_specialist_staging.py': (
                  'worker_path = REPO_ROOT / worker["definition"]',
                  'worker_path = REPO_ROOT / "community" / "workers" / "extensions" / "systems-engineering-worker.yaml"',
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one historical path consumer')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/r5-staging-test-path-correction.yml
          git add -A
          git diff --cached --check
          git commit -m "Correct R5 historical test paths"
          git push origin agent/worker-implementation-topology
