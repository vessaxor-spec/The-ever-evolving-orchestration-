name: Reconcile Integrated Assimilation Current Scale

on:
  push:
    branches:
      - agent/host-integration-integrated-assimilation
    paths:
      - .github/workflows/_reconcile-integrated-assimilation-scale.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-integrated-assimilation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-integrated-assimilation
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Apply exact current-scale reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/stewardship/progress-tracker.md',
              '| Current validated scale | 915 tests passed, 535 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #710 |',
              '| Current validated scale | 941 tests passed, 539 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #730 |',
              'tracker current scale',
          )
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_TESTS = 915', 'EXPECTED_CURRENT_VALIDATED_TESTS = 941', 'test count')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 535', 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 539', 'file count')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 710', 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 730', 'CI run')
          PY
      - name: Prove exact two-file scope and truth
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'docs/stewardship/progress-tracker.md',
              'tests/test_documentation_control_plane_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected scale reconciliation scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m pytest -q tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
      - name: Commit exact current-scale reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/stewardship/progress-tracker.md tests/test_documentation_control_plane_truth.py
          git diff --cached --check
          git commit -m 'Advance current validation scale after assimilation reconciliation'
          git push origin HEAD:refs/heads/agent/host-integration-integrated-assimilation
