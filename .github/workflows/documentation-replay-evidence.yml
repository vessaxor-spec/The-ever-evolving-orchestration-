name: Controlled Documentation Replay Evidence

on:
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - opened

permissions:
  contents: read
  issues: write

concurrency:
  group: controlled-documentation-replay-evidence
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 121 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vessaxor-spec' &&
       github.event.comment.body == '/run-documentation-replay') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'opened' &&
       github.event.pull_request.user.login == 'vessaxor-spec' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'evidence/documentation-replay-trigger-v1' &&
       github.event.pull_request.base.ref == 'main')
    name: Run provider-backed documentation replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out trusted base revision
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Announce auditable replay run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.issue.number }}
          TRIGGER_KIND: ${{ github.event_name }}
        run: |
          revision="$(git rev-parse HEAD)"
          printf '%s\n' \
            '<!-- teo-documentation-replay-start -->' \
            '### Controlled documentation replay started' \
            '' \
            "- Actions run ID: \`${GITHUB_RUN_ID}\`" \
            "- Trusted base revision: \`${revision}\`" \
            "- Trigger event: \`${TRIGGER_KIND}\`" \
            '- Evidence status: pending provider-backed execution' \
            > /tmp/documentation-replay-start.md
          gh issue comment "$TARGET_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/documentation-replay-start.md

      - name: Install pinned replay environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Build exact staged replay plan
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          revision = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          payload = {
              "replay_version": "1",
              "record_type": "live_scope_replay_plan",
              "replay_id": f"documentation-provider-backed-replay-v1-{os.environ['GITHUB_RUN_ID']}",
              "task_type": "documentation",
              "suite_id": "documentation-bounded-v1",
              "suite_version": "1",
              "trials_per_fixture": 2,
              "fixtures": [
                  {
                      "fixture_id": "bounded-note",
                      "risk_level": "low",
                      "task": "Rewrite in two concise sentences: Alpha follows Beta. The color is blue.",
                      "required_capabilities": ["transformation"],
                  },
                  {
                      "fixture_id": "bounded-summary",
                      "risk_level": "medium",
                      "task": "Summarize these supplied facts in three bullets without adding claims: the route is staged; live activation is false; the current active task class is high_volume_simple.",
                      "required_capabilities": ["transformation"],
                  },
              ],
              "harness": {
                  "harness_id": "teo-staged-live-scope-replay",
                  "harness_version": "1",
                  "tool_access_profile": "none",
                  "max_attempts": 2,
                  "selection_mode": "canonical_candidate_route",
                  "circuit_state_profile": "isolated_per_trial",
                  "verification_mode": "assigned_candidate_verifier",
                  "authority_mode": "staged_evidence_only",
                  "fallback_mode": "disabled_until_recovery_gate",
              },
              "versions": {
                  "runtime_version": "1.0.1.dev0",
                  "repository_revision": revision,
                  "routing_policy_revision": "policy/runtime/live-execution-expansion.yaml@1.1",
                  "registry_revision": revision,
                  "tool_versions": {"live-scope-replay-harness": "1"},
              },
          }
          Path("/tmp/documentation-replay-plan.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("/tmp/documentation-replay-revision.txt").write_text(
              revision + "\n", encoding="utf-8"
          )
          PY

      - name: Validate staged plan without provider calls
        run: |
          python -m teo_reference.live_scope_replay_cli --repo-root . validate \
            --plan /tmp/documentation-replay-plan.json

      - name: Execute and validate provider-backed replay
        id: replay
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: ${name}" >&2
              exit 2
            fi
          done

          output_dir=".teo/runtime/live-scope-replay/documentation"
          python -m teo_reference.live_scope_replay_cli --repo-root . run \
            --plan /tmp/documentation-replay-plan.json \
            --output-dir "$output_dir" \
            --execute-live

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".teo/runtime/live-scope-replay/documentation")
          record_path = root / "replay-record.json"
          outcomes_path = root / "route-outcomes.jsonl"
          record = json.loads(record_path.read_text(encoding="utf-8"))
          outcomes = [
              json.loads(line)
              for line in outcomes_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          summary = record["summary"]
          failure_keys = (
              "verification_failed",
              "awaiting_human",
              "verification_missing",
              "execution_failed",
              "abandoned",
          )

          if summary["total_trials"] != 4 or summary["completed"] != 4:
              raise SystemExit(json.dumps(summary, indent=2, sort_keys=True))
          if any(summary[key] != 0 for key in failure_keys):
              raise SystemExit(json.dumps(summary, indent=2, sort_keys=True))
          if len(outcomes) != 4:
              raise SystemExit(f"Expected 4 route outcomes, found {len(outcomes)}")
          if any(binding["final_disposition"] != "completed" for binding in record["bindings"]):
              raise SystemExit("Replay contains a non-completed binding")
          if record["candidate_state"] != "staged":
              raise SystemExit("Replay changed candidate state")
          if record["activation_authorized"] is not False:
              raise SystemExit("Replay unexpectedly authorized activation")
          if record["evidence_only"] is not True:
              raise SystemExit("Replay lost evidence-only state")
          if record["live_scope_widened"] is not False:
              raise SystemExit("Replay unexpectedly widened live scope")
          if record["telemetry_persisted"] is not False:
              raise SystemExit("Replay unexpectedly persisted active telemetry")

          primary = record["candidate_route"]["primary"]
          verifier = record["candidate_route"]["primary_verifier"]
          if primary["provider_family"] != "anthropic" or primary["model"] != "claude-sonnet-5":
              raise SystemExit("Replay primary route drifted")
          if verifier["provider_family"] != "openai" or verifier["model"] != "gpt-5.6-terra":
              raise SystemExit("Replay verifier route drifted")

          file_sha = hashlib.sha256(record_path.read_bytes()).hexdigest()
          audit_summary = {
              "status": "provider_backed_replay_completed",
              "replay_id": record["replay_id"],
              "plan_sha256": record["plan_sha256"],
              "record_integrity_sha256": record["integrity_sha256"],
              "record_file_sha256": file_sha,
              "summary": summary,
              "route_outcome_records": len(outcomes),
              "candidate_state": record["candidate_state"],
              "activation_authorized": record["activation_authorized"],
              "live_scope_widened": record["live_scope_widened"],
              "telemetry_persisted": record["telemetry_persisted"],
              "primary": primary,
              "primary_verifier": verifier,
          }
          Path("/tmp/documentation-replay-summary.json").write_text(
              json.dumps(audit_summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload provider-backed replay evidence
        if: ${{ steps.replay.outcome == 'success' }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teo-documentation-replay-${{ github.run_id }}
          path: .teo/runtime/live-scope-replay/documentation/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Report sanitized replay result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          TARGET_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          revision_path = Path("/tmp/documentation-replay-revision.txt")
          revision = revision_path.read_text(encoding="utf-8").strip() if revision_path.exists() else "unknown"
          summary_path = Path("/tmp/documentation-replay-summary.json")
          lines = [
              "<!-- teo-documentation-replay-result -->",
              "### Controlled documentation replay result",
              "",
              f"- Actions run ID: `{os.environ['GITHUB_RUN_ID']}`",
              f"- Trusted base revision: `{revision}`",
              f"- Replay step outcome: **{os.environ['REPLAY_OUTCOME']}**",
          ]
          if summary_path.exists():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              counts = summary["summary"]
              lines.extend(
                  [
                      f"- Trials: `{counts['completed']}/{counts['total_trials']}` completed",
                      f"- Primary: `{summary['primary']['provider_family']}/{summary['primary']['model']}`",
                      f"- Verifier: `{summary['primary_verifier']['provider_family']}/{summary['primary_verifier']['model']}`",
                      f"- Replay record integrity: `{summary['record_integrity_sha256']}`",
                      f"- Artifact: `teo-documentation-replay-{os.environ['GITHUB_RUN_ID']}`",
                      f"- Activation authorized: `{str(summary['activation_authorized']).lower()}`",
                      f"- Live scope widened: `{str(summary['live_scope_widened']).lower()}`",
                  ]
              )
          else:
              lines.extend(
                  [
                      "- Provider-backed evidence accepted: `false`",
                      "- No empirical success is claimed from this run.",
                  ]
              )
          Path("/tmp/documentation-replay-result.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          gh issue comment "$TARGET_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/documentation-replay-result.md

      - name: Enforce provider-backed replay success
        if: ${{ steps.replay.outcome != 'success' }}
        run: exit 1
