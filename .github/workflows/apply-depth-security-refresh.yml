name: Apply research analytics and security refresh

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/deepen-research-analytics-security'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/deepen-research-analytics-security
          fetch-depth: 0

      - name: Apply guarded depth and security refresh
        run: python tools/apply_depth_security_refresh.py

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/specialists docs/methodology tests
          git diff --cached --quiet && exit 0
          git commit -m "Deepen research analytics and security assurance"
          git push origin HEAD:agent/deepen-research-analytics-security
