name: Apply Mission Control Routing Update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/refine-implementation-directions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
      - name: Apply guarded routing migration
        run: python tools/apply_mission_control_routing_update.py
      - name: Remove one-shot migration mechanism
        run: |
          rm tools/apply_mission_control_routing_update.py
          rm .github/workflows/apply-mission-control-routing-update.yml
      - name: Commit routing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Recalibrate model routing under Mission Control"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
