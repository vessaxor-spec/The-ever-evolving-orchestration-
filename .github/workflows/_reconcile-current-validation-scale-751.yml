name: Guarded current validation-scale reconciliation

on:
  push:
    branches:
      - agent/reconcile-current-validation-scale-751

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/reconcile-current-validation-scale-751
          fetch-depth: 0

      - name: Set up canonical Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Reconcile exact current-scale truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/stewardship/progress-tracker.md',
              '| Current validated scale | 964 tests passed, 543 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #739 |',
              '| Current validated scale | 964 tests passed, 544 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #751 |',
          )
          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 543',
              'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 544',
          )
          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              'EXPECTED_CURRENT_VALIDATED_CI_RUN = 739',
              'EXPECTED_CURRENT_VALIDATED_CI_RUN = 751',
          )
          PY

      - name: Install pinned validation environment
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Validate focused documentation truth
        shell: bash
        run: |
          python -m compileall -q tests/test_documentation_control_plane_truth.py
          pytest -q tests/test_documentation_control_plane_truth.py
          git diff --check

      - name: Commit only intended reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_reconcile-current-validation-scale-751.yml
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/_reconcile-current-validation-scale-751.yml \
            docs/stewardship/progress-tracker.md \
            tests/test_documentation_control_plane_truth.py | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git config user.name "TEO reconciliation bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Reconcile current validation scale to CI 751"
          git push origin HEAD:agent/reconcile-current-validation-scale-751
