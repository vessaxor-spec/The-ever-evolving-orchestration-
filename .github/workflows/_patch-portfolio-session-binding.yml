name: Patch Portfolio Session Binding

on:
  push:
    branches:
      - agent/host-integration-portfolio-authority-separation
    paths:
      - .github/workflows/_patch-portfolio-session-binding.yml
      - research/runtime/_patch_portfolio_session_binding.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-portfolio-authority-separation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-portfolio-authority-separation

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock

      - name: Apply exact session-binding correction
        run: python research/runtime/_patch_portfolio_session_binding.py

      - name: Prove write scope and targeted behavior
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'research/runtime/host_integration_portfolio_authority_separation.py',
              'research/runtime/host-integration-portfolio-authority-separation-2026-08-15.md',
              'tests/test_host_integration_portfolio_authority_separation.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected patch scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m compileall -q research/runtime/host_integration_portfolio_authority_separation.py tests/test_host_integration_portfolio_authority_separation.py
          python -m pytest -q tests/test_host_integration_portfolio_authority_separation.py

      - name: Commit exact session-binding correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/runtime/host_integration_portfolio_authority_separation.py research/runtime/host-integration-portfolio-authority-separation-2026-08-15.md tests/test_host_integration_portfolio_authority_separation.py
          git diff --cached --check
          git commit -m 'Bind portfolio admission to exact TEO session identity'
          git push origin HEAD:refs/heads/agent/host-integration-portfolio-authority-separation
