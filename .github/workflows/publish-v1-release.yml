name: Verify TEO v1.0.0 publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1-release.yml"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify published v1.0.0 release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_SHA: 0b306bae40ed54b82f1f22c90c7c2cbc630abb55
      RELEASE_TAG: v1.0.0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Verify tag and release object
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "${TAG_SHA}" = "${RELEASE_SHA}"

          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,isDraft,isPrerelease,body,url \
            > /tmp/teo-v1-release.json

          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('/tmp/teo-v1-release.json').read_text(encoding='utf-8'))
          assert release['tagName'] == 'v1.0.0'
          assert release['name'] == 'The Ever-Evolving Orchestration v1.0.0'
          assert release['isDraft'] is False
          assert release['isPrerelease'] is False
          assert 'reference_operational' in release['body']
          assert 'teo-reference-router==1.0.0' in release['body']
          print(release['url'])
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record transient verification signal
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/87/reactions" \
            -f content='rocket' >/dev/null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
