name: Ensure TEO v1.0.0 publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1-release.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ensure:
    name: Ensure and verify published v1.0.0 release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_SHA: 0b306bae40ed54b82f1f22c90c7c2cbc630abb55
      RELEASE_TAG: v1.0.0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Verify immutable tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "${TAG_SHA}" = "${RELEASE_SHA}"

      - name: Ensure GitHub Release exists
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            git show "${RELEASE_SHA}:docs/releases/v1.0.0.md" > /tmp/teo-v1.0.0-release-notes.md
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "The Ever-Evolving Orchestration v1.0.0" \
              --notes-file /tmp/teo-v1.0.0-release-notes.md \
              --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release object
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,isDraft,isPrerelease,body,url \
            > /tmp/teo-v1-release.json

          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('/tmp/teo-v1-release.json').read_text(encoding='utf-8'))
          assert release['tagName'] == 'v1.0.0'
          assert release['name'] == 'The Ever-Evolving Orchestration v1.0.0'
          assert release['isDraft'] is False
          assert release['isPrerelease'] is False
          assert 'reference_operational' in release['body']
          assert 'teo-reference-router==1.0.0' in release['body']
          print(release['url'])
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record release verification on publication PR
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 87 \
            --repo "${GITHUB_REPOSITORY}" \
            --body "Automated v1.0.0 release verification passed. The annotated tag v1.0.0 resolves to 0b306bae40ed54b82f1f22c90c7c2cbc630abb55, and the GitHub Release is published as a non-draft, non-prerelease release with the reference_operational contract."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
