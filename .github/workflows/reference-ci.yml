name: Reference Implementation CI

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "models.yaml"
      - "reference/**"
      - "tests/**"
      - "policy/**"
      - "community/workers/**"
      - "community/specialists/**"
      - ".github/workflows/reference-ci.yml"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "models.yaml"
      - "reference/**"
      - "tests/**"
      - "policy/**"
      - "community/workers/**"
      - "community/specialists/**"
      - ".github/workflows/reference-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reference router
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded specialist freshness migration
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/specialist-freshness-foundation-v3'
        run: |
          if [ -f policy/specialists/freshness.yaml ]; then
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-specialist-freshness-foundation.yml').read_text(encoding='utf-8')
          start = "      - name: Apply freshness architecture and critical corrections\n        run: |\n"
          end = "\n      - name: Commit migration\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('Unable to locate guarded migration block')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())

          old_selection = '''cards = sorted(
              path for path in SPECIALISTS.glob("*.md") if path.name != "README.md"
          )
          if len(cards) != 56:
              raise SystemExit(f"Expected 56 specialist cards, found {len(cards)}")'''
          new_selection = '''registry_text = read("community/specialists/specialists.yaml")
          cards = sorted(
              ROOT / line.strip().split(": ", 1)[1]
              for line in registry_text.splitlines()
              if line.strip().startswith("role_card: ")
          )
          if len(cards) != 56:
              raise SystemExit(f"Expected 56 registry role cards, found {len(cards)}")'''
          if script.count(old_selection) != 1:
              raise SystemExit('Unable to patch registry-based migration selection')
          script = script.replace(old_selection, new_selection, 1)

          old_test = '''def cards() -> list[Path]:
    return sorted(path for path in SPECIALISTS.glob("*.md") if path.name != "README.md")'''
          new_test = '''def cards() -> list[Path]:
    registry = yaml.safe_load((SPECIALISTS / "specialists.yaml").read_text(encoding="utf-8"))
    return sorted(ROOT / entry["role_card"] for entry in registry["specialists"].values())'''
          if script.count(old_test) != 1:
              raise SystemExit('Unable to patch registry-based freshness test')
          script = script.replace(old_test, new_test, 1)

          Path('/tmp/apply-specialist-freshness.sh').write_text(script + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-specialist-freshness.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/specialists policy/specialists docs/methodology tests
          git commit -m "Add specialist freshness foundation"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install reference implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q reference/implementations/python/src reference/examples tests

      - name: Run automated tests
        run: pytest -q

      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("reference/schemas").glob("*.schema.json"))
          if not schemas:
              raise SystemExit("No reference schemas found")

          for schema in schemas:
              payload = json.loads(schema.read_text(encoding="utf-8"))
              if payload.get("$schema") != "https://json-schema.org/draft/2020-12/schema":
                  raise SystemExit(f"Unexpected or missing JSON Schema dialect: {schema}")
              if payload.get("type") != "object":
                  raise SystemExit(f"Top-level schema type must be object: {schema}")

          print(f"Parsed {len(schemas)} JSON schemas")
          PY

      - name: Validate linked TEO configuration
        run: |
          teo --repo-root . validate > /tmp/teo-config-validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/teo-config-validation.json").read_text(encoding="utf-8"))
          if result.get("status") != "valid":
              raise SystemExit(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY

      - name: Run end-to-end example
        run: |
          python reference/examples/run_example.py > /tmp/teo-example.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/teo-example.json").read_text(encoding="utf-8"))
          outcome = result.get("outcome", {})
          dispatch = result.get("dispatch", {})

          if outcome.get("status") != "completed":
              raise SystemExit(json.dumps(result, indent=2))
          if outcome.get("dispatch_id") != dispatch.get("dispatch_id"):
              raise SystemExit("End-to-end example produced mismatched dispatch identifiers")
          if outcome.get("verifier_model") == outcome.get("selected_model"):
              raise SystemExit("End-to-end example did not use an independent verifier")

          print(json.dumps(result, indent=2))
          PY
