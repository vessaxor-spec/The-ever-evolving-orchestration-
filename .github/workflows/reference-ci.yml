name: Reference Implementation CI

on:
  # Run for every pull request so the required status check is always reported,
  # including documentation-only and capsule-only changes.
  pull_request:

  # Keep push validation scoped to control-plane-relevant paths on main.
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "ci/**"
      - "models.yaml"
      - "reference/**"
      - "tests/**"
      - "policy/**"
      - "community/workers/**"
      - "community/specialists/**"
      - ".github/workflows/reference-ci.yml"
      - ".github/workflows/specialist-evidence-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reference router
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Compile Python sources
        run: python -m compileall -q reference/implementations/python/src reference/examples tests

      - name: Run automated tests
        run: pytest -q

      - name: Validate regulated specialist evidence
        run: python -m teo_reference.evidence --repo-root .

      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("reference/schemas").glob("*.schema.json"))
          if not schemas:
              raise SystemExit("No reference schemas found")

          for schema in schemas:
              payload = json.loads(schema.read_text(encoding="utf-8"))
              if payload.get("$schema") != "https://json-schema.org/draft/2020-12/schema":
                  raise SystemExit(f"Unexpected or missing JSON Schema dialect: {schema}")
              if payload.get("type") != "object":
                  raise SystemExit(f"Top-level schema type must be object: {schema}")

          print(f"Parsed {len(schemas)} JSON schemas")
          PY

      - name: Validate linked TEO configuration
        run: |
          teo --repo-root . validate > /tmp/teo-config-validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/teo-config-validation.json").read_text(encoding="utf-8"))
          if result.get("status") != "valid":
              raise SystemExit(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY

      - name: Run end-to-end example
        run: |
          python reference/examples/run_example.py > /tmp/teo-example.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/teo-example.json").read_text(encoding="utf-8"))
          outcome = result.get("outcome", {})
          dispatch = result.get("dispatch", {})

          if outcome.get("status") != "completed":
              raise SystemExit(json.dumps(result, indent=2))
          if outcome.get("dispatch_id") != dispatch.get("dispatch_id"):
              raise SystemExit("End-to-end example produced mismatched dispatch identifiers")
          if outcome.get("verifier_model") == outcome.get("selected_model"):
              raise SystemExit("End-to-end example did not use an independent verifier")
          selected_provider = dispatch.get("selected_implementation", {}).get("provider_family")
          verifier_provider = dispatch.get("verification", {}).get("implementation", {}).get("provider_family")
          if selected_provider == verifier_provider:
              raise SystemExit("End-to-end example did not use provider-diverse verification")

          print(json.dumps(result, indent=2))
          PY
