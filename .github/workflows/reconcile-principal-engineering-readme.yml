name: Reconcile principal engineering README

# Temporary migration support. Removed after one guarded use.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/document-principal-engineering-activation

permissions:
  contents: write

concurrency:
  group: reference-ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate reference router
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install reference implementation
        run: python -m pip install -e 'reference/implementations/python[test]'

      - name: Compile Python sources
        run: python -m compileall reference/implementations/python/src tests reference/examples

      - name: Run automated tests
        run: pytest

      - name: Validate regulated specialist evidence
        run: teo --repo-root . validate-evidence

      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('reference/schemas').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'parsed {path}')
          PY

      - name: Validate linked configuration
        run: teo --repo-root . validate

      - name: Execute end-to-end example
        run: python reference/examples/run_example.py

  reconcile:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/document-principal-engineering-activation
          fetch-depth: 0

      - name: Apply guarded README replacements
        run: python .github/scripts/reconcile_principal_engineering_readme.py

      - name: Verify README changed
        run: git diff --exit-code --quiet README.md && { echo "README was not changed"; exit 1; } || true

      - name: Commit reconciled README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Reconcile principal engineering documentation"
          git push origin HEAD:agent/document-principal-engineering-activation
