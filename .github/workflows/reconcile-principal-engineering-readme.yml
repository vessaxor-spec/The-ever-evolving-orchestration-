name: Reconcile principal engineering README

on:
  push:
    branches:
      - agent/document-principal-engineering-activation

permissions:
  contents: write

concurrency:
  group: reconcile-principal-engineering-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/document-principal-engineering-activation
          fetch-depth: 0

      - name: Apply guarded README replacements
        run: python .github/scripts/reconcile_principal_engineering_readme.py

      - name: Verify README changed
        run: git diff --exit-code --quiet README.md && { echo "README was not changed"; exit 1; } || true

      - name: Commit reconciled README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Reconcile principal engineering documentation"
          git push origin HEAD:agent/document-principal-engineering-activation
