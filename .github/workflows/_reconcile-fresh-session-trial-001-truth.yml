name: Guarded Fresh-AI Trial 001 Truth Reconciler

on:
  push:
    branches:
      - agent/reconcile-fresh-session-trial-001-truth

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Add guarded Fresh-AI trial truth reconciler'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/reconcile-fresh-session-trial-001-truth
          fetch-depth: 0

      - name: Apply exact reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # AI entry instructions: route continuity cannot be hand-waved into full assimilation.
          replace_once(
              'AI_INSTRUCTIONS.md',
              'Copied files, installed packages, prompts, skills, one successful demo, or a green test suite do not prove assimilation. Process-local research can prove distinct-task continued use inside one running harness, but it cannot by itself prove that a fresh session inherited the integration, that no hidden reminder was supplied, or that the host persisted the hook across restart. Real host assimilation must provide durable cross-session evidence for those claims. Use `research/roadmaps/host-integration-fresh-session-trial.md` for that stronger claim; the existence of the trial framework or validator is not itself a PASS.\n',
              'Copied files, installed packages, prompts, skills, one successful demo, or a green test suite do not prove assimilation. Process-local research can prove distinct-task continued use inside one running harness, but it cannot by itself prove that a fresh session inherited the integration, that no hidden reminder was supplied, or that the host persisted the hook across restart. Real host assimilation must provide durable cross-session evidence for those claims. Use `research/roadmaps/host-integration-fresh-session-trial.md` for that stronger claim; the existence of the trial framework or validator is not itself a PASS.\n\nRouting continuity is not full end-to-end assimilation. A fresh-session full PASS must prove that the executor and verifier actually observed in execution exactly match the identities selected by TEO, that both identities are authenticated, that the observed executor output is bound to the finalized artifact, and that the observed verifier record is bound to the canonical verification record. Research simulation may support `routing_continuity_only`; it must not be represented as an end-to-end Fresh-AI assimilation PASS.\n'
          )

          # README: advance the executable Host Integration baseline and record the empirical FAIL accurately.
          old_readme = '''The latest Host Integration executable research validation is Reference Implementation CI #735: **958 automated tests**, **542 tracked-file layout checks**, regulated specialist evidence validation, **41 JSON Schema** parses, valid linked configuration, and the provider-diverse artifact-bound end-to-end reference lifecycle. That run validated the non-normative Fresh-AI cross-session trial framework and evidence-packet validator layered after the process-local integrated assimilation/conformance work. The trial requires a precommitted setup, a genuinely distinct later session, bootstrap/hook continuity before challenge disclosure, a neutral challenge with no TEO-specific reminder, a real TEO dispatch and downstream authority/verification/finalization evidence chain, and independent PASS/FAIL/INCONCLUSIVE review. CI #735 proves the framework and adversarial validator behavior; it does **not** prove that any real host has yet passed the fresh-session/no-reminder trial. Restart-persistent host hooks, production scheduler enforcement, tenant/account/credential binding, dynamic hook/plugin authority discovery, remote authenticity, durable distributed state, and compromised-host resistance remain explicitly unproved.'''
          new_readme = '''The latest Host Integration executable research validation is Reference Implementation CI #739: **964 automated tests**, **543 tracked-file layout checks**, regulated specialist evidence validation, **41 JSON Schema** parses, valid linked configuration, and the provider-diverse artifact-bound end-to-end reference lifecycle. That run validated the hardened non-normative Fresh-AI cross-session assurance model after empirical localhost trial 001. The real two-session no-reminder trial supports fresh-session standing-hook and **routing continuity**, but full end-to-end assimilation **FAILED** because local Qwen generated the artifact instead of the Gemini 3.5 Flash-Lite implementation selected by TEO and no live Claude Sonnet 5 verifier executed. The hardened validator now returns `routing_continuity_only` for research simulation and requires authenticated selected-versus-observed executor and verifier identity plus exact output/verification-record digest binding for a full PASS. Restart-persistent host hooks, production scheduler enforcement, tenant/account/credential binding, dynamic hook/plugin authority discovery, remote authenticity, durable distributed state, and compromised-host resistance remain explicitly unproved.'''
          replace_once('README.md', old_readme, new_readme)
          replace_once(
              'README.md',
              '- the Fresh-AI cross-session trial framework binds a frozen setup commitment to a later neutral challenge and distinct-session evidence packet, rejects tested same-session reuse, reminder/context contamination, post-challenge bootstrap changes, hook/bootstrap drift, revision drift, missing TEO dispatch, failed verification/finalization, and incomplete control-path evidence, while an actual host PASS remains pending independent verification.',
              '- the Fresh-AI cross-session trial framework binds a frozen setup commitment to a later neutral challenge and distinct-session evidence packet; empirical localhost trial 001 supports fresh-session/no-reminder standing-hook and routing continuity but failed full end-to-end assimilation when Qwen replaced the TEO-selected Gemini executor and a research fixture stood in for the selected Claude verifier; the hardened validator now limits research simulation to `routing_continuity_only` and requires authenticated selected-versus-observed executor/verifier identity plus digest binding for full PASS.'
          )
          replace_once(
              'README.md',
              'The later brokered cross-process authority slice merged through PR #156',
              'Empirical localhost Fresh-AI trial 001 is preserved at [`research/runtime/2026-08-15-local-fresh-ai-cross-session-trial-001.md`](research/runtime/2026-08-15-local-fresh-ai-cross-session-trial-001.md). The trial proved that a distinct no-reminder fresh session inherited the standing TEO hook and entered TEO routing/authority before task execution, but independent falsification rejected end-to-end PASS because the observed Qwen executor and fixture verifier did not match the Gemini and Claude identities selected by TEO. PR #169 hardened that boundary, and Reference Implementation CI #739 passed **964 automated tests**, **543 tracked-file layout checks**, regulated specialist evidence validation, **41 JSON Schema** parses, valid linked configuration, and the provider-diverse artifact-bound reference lifecycle. This is routing-continuity evidence plus a negative end-to-end result, not a live selected-provider assimilation PASS.\n\nThe later brokered cross-process authority slice merged through PR #156'
          )

          # Progress Tracker: advance current scale, record empirical result, and keep the full gate open.
          replace_once('docs/stewardship/progress-tracker.md', '**Last reconciled:** 2026-08-15', '**Last reconciled:** 2026-08-16')
          replace_once(
              'docs/stewardship/progress-tracker.md',
              '| Current validated scale | 958 tests passed, 542 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #735 |',
              '| Current validated scale | 964 tests passed, 543 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #739 |'
          )
          old_host_row = '| Host-integration research validation | CI #735: 958 tests, 542 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass on the Fresh-AI cross-session trial framework/validator head; this validates the framework, not an empirical host PASS |'
          new_host_row = '| Host-integration research validation | CI #739: 964 tests, 543 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass after Fresh-AI trial 001 hardening; empirical trial 001 supports fresh-session/no-reminder routing continuity but failed full selected-executor/verifier end-to-end assimilation |'
          replace_once('docs/stewardship/progress-tracker.md', old_host_row, new_host_row)
          replace_once(
              'docs/stewardship/progress-tracker.md',
              'and a Fresh-AI cross-session trial framework/validator implemented; contract remains non-normative and empirical true cross-session continued-use proof,',
              'and a Fresh-AI cross-session trial framework/validator implemented, with empirical trial 001 supporting fresh-session/no-reminder routing continuity; contract remains non-normative and authenticated end-to-end selected-executor/verifier proof,'
          )
          replace_once(
              'docs/stewardship/progress-tracker.md',
              'The cross-session trial framework now makes the stronger claim testable, but no empirical host PASS is recorded; true fresh-session/no-reminder inheritance, restart-persistent hooks, Dynamic executable-hook discovery, production/distributed authenticity, host identity, effect evidence, production compatibility-catalog provenance, remote freshness authenticity, downgrade/expiry, distributed freshness coordination, restart-durable/distributed recursion state, production scheduler containment, tenant/account/credential binding, and remote-transport gates remain open.',
              'Empirical Fresh-AI trial 001 now supports true fresh-session/no-reminder standing-hook and routing continuity, but full end-to-end assimilation is not a PASS: the observed Qwen executor and research verifier fixture did not match the Gemini and Claude identities selected by TEO. PR #169 hardened the validator so research simulation can report only `routing_continuity_only`; authenticated selected-versus-observed executor/verifier identity and digest binding remain required for full PASS. Restart-persistent hooks, Dynamic executable-hook discovery, production/distributed authenticity, host identity, effect evidence, production compatibility-catalog provenance, remote freshness authenticity, downgrade/expiry, distributed freshness coordination, restart-durable/distributed recursion state, production scheduler containment, tenant/account/credential binding, and remote-transport gates remain open.'
          )
          old_now = '''The Fresh-AI cross-session trial framework is recorded in [`../../research/roadmaps/host-integration-fresh-session-trial.md`](../../research/roadmaps/host-integration-fresh-session-trial.md). CI #735 validates the framework and validator only; no empirical host PASS is recorded, so true fresh-session/no-reminder inheritance remains open.'''
          new_now = '''The Fresh-AI cross-session trial framework is recorded in [`../../research/roadmaps/host-integration-fresh-session-trial.md`](../../research/roadmaps/host-integration-fresh-session-trial.md), with empirical trial 001 preserved in [`../../research/runtime/2026-08-15-local-fresh-ai-cross-session-trial-001.md`](../../research/runtime/2026-08-15-local-fresh-ai-cross-session-trial-001.md). The distinct no-reminder fresh session inherited the committed hook and entered TEO admission/routing/authority before execution, supporting routing continuity. Full end-to-end assimilation failed because the observed Qwen executor and research verifier fixture did not match the Gemini and Claude identities selected by TEO. CI #739 validates the hardened assurance split: `research_simulation` can support only `routing_continuity_only`, while full PASS requires authenticated selected-versus-observed executor/verifier identity and digest binding.'''
          replace_once('docs/stewardship/progress-tracker.md', old_now, new_now)

          # Host Integration roadmap: add empirical evidence and replace the pre-run disposition.
          replace_once('research/roadmaps/host-integration-contract.md', '**Last reconciled:** 2026-08-15', '**Last reconciled:** 2026-08-16')
          replace_once(
              'research/roadmaps/host-integration-contract.md',
              '- [`host-integration-fresh-session-trial.md`](host-integration-fresh-session-trial.md), the two-session no-reminder trial protocol and evidence-packet validator for testing whether a durable host integration is actually inherited after the assimilation conversation ends.',
              '- [`host-integration-fresh-session-trial.md`](host-integration-fresh-session-trial.md), the two-session no-reminder trial protocol and evidence-packet validator for testing whether a durable host integration is actually inherited after the assimilation conversation ends;\n- [`../runtime/2026-08-15-local-fresh-ai-cross-session-trial-001.md`](../runtime/2026-08-15-local-fresh-ai-cross-session-trial-001.md), the first empirical localhost two-session run, which supports fresh-session/no-reminder standing-hook and routing continuity but records a full end-to-end FAIL after executor and verifier substitution were independently falsified.'
          )
          old_contract = '''The current process-local harness requires two governed receipts with distinct task IDs. That protects against replaying one setup demo twice, but it does not prove that a genuinely fresh session inherited the integration without a reminder or that a production host persisted the hook across restart. The dedicated [`host-integration-fresh-session-trial.md`](host-integration-fresh-session-trial.md) framework now makes that stronger claim falsifiable through a precommitted setup, distinct session, neutral challenge, exact TEO-path evidence, and independent PASS/FAIL/INCONCLUSIVE review. CI #735 validated the framework and validator, not an empirical host trial; true fresh-session/no-reminder inheritance remains open until a real host run passes.'''
          new_contract = '''The current process-local harness requires two governed receipts with distinct task IDs. That protects against replaying one setup demo twice, but it does not prove that a genuinely fresh session inherited the integration without a reminder or that a production host persisted the hook across restart. The dedicated [`host-integration-fresh-session-trial.md`](host-integration-fresh-session-trial.md) framework makes the stronger claim falsifiable through a precommitted setup, distinct session, neutral challenge, exact TEO-path evidence, and independent PASS/FAIL/INCONCLUSIVE review. Empirical localhost trial 001 supports fresh-session/no-reminder standing-hook and routing continuity, but full end-to-end assimilation failed because the observed Qwen executor and research verifier fixture did not match the Gemini and Claude identities selected by TEO. PR #169 and CI #739 hardened the validator so research simulation can produce only `routing_continuity_only`; a full PASS now requires authenticated selected-versus-observed executor/verifier identity and exact digest binding. Restart-persistent hook proof and production enforcement remain open.'''
          replace_once('research/roadmaps/host-integration-contract.md', old_contract, new_contract)

          # Documentation truth canaries.
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_TESTS = 958', 'EXPECTED_CURRENT_VALIDATED_TESTS = 964')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 542', 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 543')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 735', 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 739')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_HOST_INTEGRATION_CI_RUN = 735', 'EXPECTED_HOST_INTEGRATION_CI_RUN = 739')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_HOST_INTEGRATION_TESTS = 958', 'EXPECTED_HOST_INTEGRATION_TESTS = 964')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_HOST_INTEGRATION_TRACKED_FILES = 542', 'EXPECTED_HOST_INTEGRATION_TRACKED_FILES = 543')
          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              '        "host-integration-integrated-conformance-assimilation-2026-08-15.md",\n        "integrated Fresh-AI assimilation/conformance",',
              '        "host-integration-integrated-conformance-assimilation-2026-08-15.md",\n        "2026-08-15-local-fresh-ai-cross-session-trial-001.md",\n        "routing_continuity_only",\n        "integrated Fresh-AI assimilation/conformance",'
          )
          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              '        "the existence of the trial framework or validator is not itself a PASS",',
              '        "the existence of the trial framework or validator is not itself a PASS",\n        "Routing continuity is not full end-to-end assimilation",\n        "research simulation may support `routing_continuity_only`",'
          )
          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              '        "host-integration-integrated-conformance-assimilation-2026-08-15.md",\n        "process-local integrated Fresh-AI assimilation/conformance",',
              '        "host-integration-integrated-conformance-assimilation-2026-08-15.md",\n        "2026-08-15-local-fresh-ai-cross-session-trial-001.md",\n        "routing_continuity_only",\n        "process-local integrated Fresh-AI assimilation/conformance",'
          )

          replace_once('tests/test_host_integration_summary_truth.py', '        "Reference Implementation CI #735",', '        "Reference Implementation CI #739",')
          replace_once('tests/test_host_integration_summary_truth.py', '        "958 automated tests",', '        "964 automated tests",')
          replace_once('tests/test_host_integration_summary_truth.py', '        "542 tracked-file layout checks",', '        "543 tracked-file layout checks",')
          replace_once(
              'tests/test_host_integration_summary_truth.py',
              '        "host-integration-integrated-conformance-assimilation-2026-08-15.md",\n        "integrated Fresh-AI assimilation/conformance",',
              '        "host-integration-integrated-conformance-assimilation-2026-08-15.md",\n        "2026-08-15-local-fresh-ai-cross-session-trial-001.md",\n        "routing_continuity_only",\n        "routing continuity",\n        "integrated Fresh-AI assimilation/conformance",'
          )
          replace_once(
              'tests/test_host_integration_summary_truth.py',
              '        "CI #735 validated the framework and validator, not an empirical host trial",',
              '        "empirical localhost trial 001 supports fresh-session/no-reminder standing-hook and routing continuity",\n        "CI #739",\n        "2026-08-15-local-fresh-ai-cross-session-trial-001.md",\n        "routing_continuity_only",'
          )
          PY

      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Run focused truth and assimilation gates
        run: |
          python -m compileall -q research/runtime tests
          pytest -q \
            tests/test_documentation_control_plane_truth.py \
            tests/test_host_integration_summary_truth.py \
            tests/test_host_integration_fresh_session_trial.py
          git diff --check

      - name: Verify intended scope and commit without helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_reconcile-fresh-session-trial-001-truth.yml
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            AI_INSTRUCTIONS.md \
            README.md \
            docs/stewardship/progress-tracker.md \
            research/roadmaps/host-integration-contract.md \
            tests/test_documentation_control_plane_truth.py \
            tests/test_host_integration_summary_truth.py | sort)"
          actual="$(printf '%s\n' "$changed" | sort)"
          test "$actual" = "$expected"
          git config user.name "TEO reconciliation bot"
          git config user.email "actions@users.noreply.github.com"
          git add AI_INSTRUCTIONS.md README.md docs/stewardship/progress-tracker.md research/roadmaps/host-integration-contract.md tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
          git commit -m "Reconcile Fresh-AI trial 001 truth"
          git push origin HEAD:agent/reconcile-fresh-session-trial-001-truth
