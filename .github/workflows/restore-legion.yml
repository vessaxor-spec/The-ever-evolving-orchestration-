name: Restore Roxas-Legion specialists

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-legion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-roxas-legion-specialists
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out TEO
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone canonical Roxas-Legion
        run: git clone --depth 1 https://github.com/vessaxor-spec/Roxas-Legion.git /tmp/roxas-legion

      - name: Restore and validate every specialist
        run: python3 .github/scripts/restore_legion.py /tmp/roxas-legion

      - name: Publish validated restoration branch
        run: |
          if git diff --quiet -- community/specialists; then
            echo "All specialist specifications already match the canonical Legion."
            exit 0
          fi

          git config user.name "TEO Steward"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B legion/preserve-canonical-specs
          git add community/specialists
          git commit -m "Restore full Roxas-Legion specialist specifications"
          git push --force origin HEAD:refs/heads/legion/preserve-canonical-specs
