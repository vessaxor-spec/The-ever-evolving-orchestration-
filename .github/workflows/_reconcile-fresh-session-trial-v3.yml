name: Reconcile Fresh-Session Trial Truth V3

on:
  push:
    branches:
      - agent/reconcile-fresh-session-trial
    paths:
      - .github/workflows/_reconcile-fresh-session-trial-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/reconcile-fresh-session-trial'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact reconciliation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/reconcile-fresh-session-trial
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Apply corrected canonical reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/_reconcile-fresh-session-trial-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(block), '<v2-reconciliation>', 'exec'))

          tracker = Path('docs/stewardship/progress-tracker.md')
          text = tracker.read_text(encoding='utf-8')
          old = 'The next bounded provider-independent Host Integration gate should be selected from the remaining roadmap evidence, now narrowed to genuinely open production, distributed, economic, production-freshness, cross-session persistence, dynamic-authority-surface, effect-evidence, scheduler, tenant/credential, and recursion/recovery requirements. The integrated assimilation result changes how future integrations must be performed, but it does not promote Host Integration ahead of the deferred provider-backed `documentation` replay milestone.'
          new = 'The Fresh-AI cross-session trial framework is recorded in [`../../research/roadmaps/host-integration-fresh-session-trial.md`](../../research/roadmaps/host-integration-fresh-session-trial.md). CI #735 validates the framework and validator only; no empirical host PASS is recorded, so true fresh-session/no-reminder inheritance remains open.\n\nThe next bounded provider-independent Host Integration gate should be selected from the remaining roadmap evidence, now narrowed to genuinely open production, distributed, economic, production-freshness, cross-session persistence, dynamic-authority-surface, effect-evidence, scheduler, tenant/credential, and recursion/recovery requirements. The integrated assimilation result changes how future integrations must be performed, but it does not promote Host Integration ahead of the deferred provider-backed `documentation` replay milestone.'
          if text.count(old) != 1:
              raise SystemExit(f'tracker trial link: expected one match, found {text.count(old)}')
          tracker.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Prove exact reconciliation scope and focused truth
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'AI_INSTRUCTIONS.md',
              'README.md',
              'docs/stewardship/progress-tracker.md',
              'research/roadmaps/host-integration-assimilation-protocol.md',
              'research/roadmaps/host-integration-contract.md',
              'tests/test_documentation_control_plane_truth.py',
              'tests/test_host_integration_summary_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected reconciliation scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m pytest -q tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py tests/test_host_integration_fresh_session_trial.py tests/test_host_integration_integrated_conformance.py
      - name: Commit canonical reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AI_INSTRUCTIONS.md README.md docs/stewardship/progress-tracker.md research/roadmaps/host-integration-assimilation-protocol.md research/roadmaps/host-integration-contract.md tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
          git diff --cached --check
          git commit -m 'Reconcile Fresh-AI cross-session trial truth'
          git push origin HEAD:refs/heads/agent/reconcile-fresh-session-trial
