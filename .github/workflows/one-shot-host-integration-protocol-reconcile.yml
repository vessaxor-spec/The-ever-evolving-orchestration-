name: One-shot Host Integration Protocol reconciliation

on:
  push:
    branches:
      - agent/host-integration-protocol-0-1-reconciled

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-protocol-0-1-reconciled
          fetch-depth: 0
      - name: Reconstruct source candidate
        run: |
          set -euo pipefail
          git fetch origin agent/host-integration-protocol-0-1:refs/remotes/origin/agent/host-integration-protocol-0-1
          for path in \
            docs/specification/host-integration-protocol-candidate.md \
            reference/implementations/python/src/teo_reference/host_integration_protocol.py \
            reference/schemas/host-integration-protocol.schema.json \
            tests/test_host_integration_protocol.py \
            tests/test_host_integration_protocol_schema.py
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/agent/host-integration-protocol-0-1:$path" > "$path"
          done
      - name: Harden and reconcile candidate
        run: python .github/scripts/reconcile_host_integration_protocol.py
      - name: Validate generated tree
        run: |
          set -euo pipefail
          python -m compileall -q reference/implementations/python/src tests .github/scripts
          git diff --check
      - name: Commit reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            CHANGELOG.md \
            docs/specification/README.md \
            docs/specification/host-integration-protocol-candidate.md \
            docs/stewardship/progress-tracker.md \
            docs/stewardship/roadmap.md \
            research/roadmaps/host-integration-contract.md \
            research/runtime/host-integration-protocol-0-1-2026-08-17.md \
            reference/implementations/README.md \
            reference/implementations/python/README.md \
            reference/implementations/python/src/teo_reference/host_integration_protocol.py \
            reference/schemas/host-integration-protocol.schema.json \
            tests/test_documentation_control_plane_truth.py \
            tests/test_host_integration_protocol.py \
            tests/test_host_integration_protocol_schema.py
          git diff --cached --check
          git commit -m 'Reconcile Host Integration Protocol 0.1 candidate'
          git push origin HEAD:agent/host-integration-protocol-0-1-reconciled
