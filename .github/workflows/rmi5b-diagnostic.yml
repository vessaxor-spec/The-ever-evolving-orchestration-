name: RMI-5B diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmi5b-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolate:
    name: Diagnose ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: runtime-dispatch
            command: pytest -q tests/test_runtime_dispatch_binding.py
          - group: specialist-model
            command: pytest -q tests/test_specialist_model_routing.py
          - group: provider-fallback
            command: pytest -q tests/test_provider_fallback_policy.py
          - group: reference-router
            command: pytest -q tests/test_reference_router.py
          - group: remainder
            command: pytest -q --ignore=tests/test_runtime_dispatch_binding.py --ignore=tests/test_specialist_model_routing.py --ignore=tests/test_provider_fallback_policy.py --ignore=tests/test_reference_router.py
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Run isolated tests
        run: ${{ matrix.command }}
