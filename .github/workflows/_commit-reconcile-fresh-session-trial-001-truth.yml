name: Commit Proven Fresh-AI Trial 001 Truth Reconciliation

on:
  push:
    branches:
      - agent/reconcile-fresh-session-trial-001-truth

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Commit proven Fresh-AI trial truth reconciliation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/reconcile-fresh-session-trial-001-truth
          fetch-depth: 0

      - name: Set up canonical Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Reapply proven exact reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/_reconcile-fresh-session-trial-001-truth.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          Path('/tmp/reconcile.py').write_text(textwrap.dedent('\n'.join(source[start:end])) + '\n', encoding='utf-8')
          PY
          python /tmp/reconcile.py
          python - <<'PY'
          from pathlib import Path
          fixes = {
              'tests/test_documentation_control_plane_truth.py': (
                  '        "research simulation may support `routing_continuity_only`",',
                  '        "Research simulation may support `routing_continuity_only`",',
              ),
              'tests/test_host_integration_summary_truth.py': (
                  '        "empirical localhost trial 001 supports fresh-session/no-reminder standing-hook and routing continuity",',
                  '        "Empirical localhost trial 001 supports fresh-session/no-reminder standing-hook and routing continuity",',
              ),
          }
          for path, (old, new) in fixes.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one canary phrase')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install and rerun focused gates
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          python -m compileall -q research/runtime tests
          pytest -q tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py tests/test_host_integration_fresh_session_trial.py
          git diff --check

      - name: Stage, verify exact scope, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/_reconcile-fresh-session-trial-001-truth.yml \
            .github/workflows/_resume-reconcile-fresh-session-trial-001-truth.yml \
            .github/workflows/_finalize-reconcile-fresh-session-trial-001-truth.yml \
            .github/workflows/_commit-reconcile-fresh-session-trial-001-truth.yml
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/_commit-reconcile-fresh-session-trial-001-truth.yml \
            .github/workflows/_finalize-reconcile-fresh-session-trial-001-truth.yml \
            .github/workflows/_reconcile-fresh-session-trial-001-truth.yml \
            .github/workflows/_resume-reconcile-fresh-session-trial-001-truth.yml \
            AI_INSTRUCTIONS.md \
            README.md \
            docs/stewardship/progress-tracker.md \
            research/roadmaps/host-integration-contract.md \
            tests/test_documentation_control_plane_truth.py \
            tests/test_host_integration_summary_truth.py | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git config user.name "TEO reconciliation bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Reconcile Fresh-AI trial 001 truth"
          git push origin HEAD:agent/reconcile-fresh-session-trial-001-truth
