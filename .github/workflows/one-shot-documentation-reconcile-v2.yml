name: One-shot documentation reconciliation v2

on:
  push:
    branches:
      - agent/reconcile-documentation-after-evidence-qualification

permissions:
  contents: write

concurrency:
  group: one-shot-documentation-reconcile-v2
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/reconcile-documentation-after-evidence-qualification

      - name: Reconcile current-facing documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          replace_once(
              'README.md',
              '| Staged live-scope candidate | `documentation`, evaluation only, not authorized for live execution |\n| High and critical live execution | not authorized |',
              '| Staged live-scope candidate | `documentation`, evaluation only, not authorized for live execution |\n| Regulated specialist evidence | six-card pilot stability-qualified; seven-day authority monitoring remains active; expansion requires explicit next risk-tier batch approval |\n| High and critical live execution | not authorized |',
          )
          replace_once(
              'README.md',
              'The current reference system includes deterministic routing, risk controls, specialist bindings, capability checks, provider-diverse recovery, fresh-verifier rotation, guarded provider execution, content-free runtime telemetry, evidence-aware finalization, and qualified-human authority where policy requires it.\n',
              'The current reference system includes deterministic routing, risk controls, specialist bindings, capability checks, provider-diverse recovery, fresh-verifier rotation, guarded provider execution, content-free runtime telemetry, evidence-aware finalization, and qualified-human authority where policy requires it.\n\nThe bounded regulated-specialist evidence pilot has completed **2 of 2 formal refresh cycles** and the executable **stability qualification**. The qualification performed **five complete clean authority-resolution replays**, **three independent repeatability runs**, **15 of 15 governed fail-closed mutations**, a controlled authority-move path, and an external-network observation that resolved all seven declared authorities. The seven-day source-resolution cadence remains continuous drift monitoring, not an elapsed-time waiting gate. Qualification does not auto-authorize expansion; an explicit next risk-tier batch approval and separate reviewed change are still required.\n',
          )
          replace_once(
              'README.md',
              'The accepted substantive runtime-control baseline remains **Reference Implementation CI #514** with **657 automated tests**, **477 tracked-file layout checks**, regulated specialist evidence validation, **40 JSON Schema** parses, valid linked configuration, and the provider-diverse end-to-end reference lifecycle. The documentation reconciliation baseline is **CI #602** with **802 automated tests** and **515 tracked-file layout checks**. The latest Host Integration research baseline remains **Reference Implementation CI #739** with **964 automated tests** and **543 tracked-file layout checks**. These baselines prove their declared checks, not broader provider-backed production claims.\n',
              'The accepted substantive runtime-control baseline remains **Reference Implementation CI #514** with **657 automated tests**, **477 tracked-file layout checks**, regulated specialist evidence validation, **40 JSON Schema** parses, valid linked configuration, and the provider-diverse end-to-end reference lifecycle. The documentation reconciliation baseline is **CI #602** with **802 automated tests** and **515 tracked-file layout checks**. The latest Host Integration research baseline remains **Reference Implementation CI #739** with **964 automated tests** and **543 tracked-file layout checks**. The regulated-evidence stability qualification was accepted with **967 automated tests**, **551 tracked-file layout checks**, **41 JSON Schemas**, valid linked configuration, regulated-specialist evidence validation, and the provider-diverse artifact-bound reference lifecycle. These baselines prove their declared checks, not broader provider-backed production claims.\n\nThe regulated pilot itself is now **stability-qualified**. Its current evidence consists of **five complete clean authority-resolution replays**, **three independent repeatability runs**, **15 of 15 governed fail-closed mutations**, a controlled authority move, and a GitHub-hosted external-network observation that resolved **7 of 7 declared authorities**. Continuous resolution remains on a **seven-day source-resolution cadence**, and any expansion still requires **explicit next risk-tier batch approval**.\n',
          )
          replace_once(
              'README.md',
              '| canonical routing | [`policy/routing/core/routing.yaml`](policy/routing/core/routing.yaml) |',
              '| canonical routing | [`policy/routing/core/routing.yaml`](policy/routing/core/routing.yaml) |\n| regulated specialist evidence | [`policy/specialists/evidence-pilot.yaml`](policy/specialists/evidence-pilot.yaml), [`policy/specialists/evidence-stability-qualification.yaml`](policy/specialists/evidence-stability-qualification.yaml), and [`docs/history/validation/regulated-specialist-evidence-stability-qualification-2026-08-16.md`](docs/history/validation/regulated-specialist-evidence-stability-qualification-2026-08-16.md) |',
          )

          replace_once(
              'AI_INSTRUCTIONS.md',
              'For the regulated pilot, validate source authority, date basis, applicability, expiry, independent verification, and refusal/escalation behavior. Do not expand the six-card pilot until its maintainability gate is explicitly approved.',
              'For the regulated pilot, validate source authority, date basis, applicability, expiry, independent verification, and refusal/escalation behavior against `policy/specialists/evidence-pilot.yaml`. Apply `policy/specialists/evidence-stability-qualification.yaml` for maintainability qualification. The current six-card pilot has completed that executable qualification; the seven-day authority-resolution cadence remains continuous drift monitoring rather than an elapsed waiting period. Qualification never auto-authorizes registry expansion. Any next risk-tier batch requires explicit approval and a separate bounded reviewed change. Test-only model substitutions or one-provider placeholder lanes must never be described as provider-diverse verification.',
          )

          replace_once(
              'CHANGELOG.md',
              '- first regulated-specialist evidence refresh cycle with append-only maintenance history and mutation-resistant registry binding',
              '- first and second regulated-specialist evidence refresh cycles with append-only maintenance history, mutation-resistant registry binding, and the repaired official ISO authority endpoint\n- executable regulated-evidence stability qualification with five clean resolution replays, three independent repeatability runs, 15 of 15 governed fail-closed mutations, controlled authority-move handling, and an external-network 7-of-7 authority observation',
          )
          replace_once(
              'CHANGELOG.md',
              '- current stewardship documentation distinguishes accepted substantive runtime baselines, later research/evidence validations, and non-normative future research without allowing documentation to create authority',
              '- current stewardship documentation distinguishes accepted substantive runtime baselines, later research/evidence validations, and non-normative future research without allowing documentation to create authority\n- the former 30-day elapsed-time regulated-evidence wait is replaced by executable stability qualification while the seven-day authority-resolution cadence remains mandatory continuous drift monitoring and explicit next-batch approval remains separate',
          )
          replace_once(
              'CHANGELOG.md',
              '- the documentation-reconciliation baseline CI #602 passed 802 tests, 515 tracked-file layout checks, 41 parsed JSON Schemas, valid linked configuration, regulated-specialist evidence validation, and the provider-diverse end-to-end reference lifecycle',
              '- the documentation-reconciliation baseline CI #602 passed 802 tests, 515 tracked-file layout checks, 41 parsed JSON Schemas, valid linked configuration, regulated-specialist evidence validation, and the provider-diverse end-to-end reference lifecycle\n- the regulated-evidence stability qualification passed with 967 tests, 551 tracked-file layout checks, 41 parsed JSON Schemas, valid linked configuration, regulated-specialist evidence validation, and the provider-diverse artifact-bound reference lifecycle',
          )
          replace_once(
              'CHANGELOG.md',
              'The bounded low or medium risk `high_volume_simple` canary remains the only accepted live execution scope. High and critical live execution remain unauthorized.\n',
              'The bounded low or medium risk `high_volume_simple` canary remains the only accepted live execution scope. High and critical live execution remain unauthorized.\n\nThe six-card regulated specialist evidence pilot has completed its current maintainability milestone at 100%. Continuous seven-day authority resolution remains active, and registry expansion remains unauthorized unless an explicit next risk-tier batch is approved through a separate reviewed change.\n',
          )

          replace_once(
              'docs/methodology/regulated-specialist-evidence-pilot-2026-08-06.md',
              '''Expansion beyond the six-card pilot requires a separate reviewed decision. At minimum, the pilot must demonstrate:\n\n- two completed evidence-refresh cycles without weakening specialist cards;\n- no surviving expiry, independence, refusal, or refresh-history mutations;\n- stable scheduled authority resolution for at least 30 days;\n- documented maintenance effort and ownership for each claim;\n- successful handling of at least one authority move, claim amendment, or intentional canonical-card change;\n- explicit approval of the next risk-tier batch.\n\nPassing the initial CI run or a single completed refresh cycle proves only bounded implementation and maintenance evidence. It does not prove repeated-cycle maintainability and does not authorize registry expansion.''',
              '''Expansion beyond the six-card pilot requires a separate reviewed decision. The pilot's maintainability milestone is established through the executable qualification defined in `policy/specialists/evidence-stability-qualification.yaml`, not through elapsed calendar time. At minimum, qualification requires:\n\n- two completed evidence-refresh cycles without weakening specialist cards;\n- five complete clean authority-resolution replays across every declared pilot claim;\n- three independently executed repeatability runs with an identical normalized result;\n- all governed expiry, authority, independence, refusal, schema, scope, and specialist-card mutation classes killed;\n- a controlled authority-move path that preserves the bound claim statement and verification ownership;\n- an external-network observation showing every declared authority resolves through the production evidence resolver;\n- documented maintenance effort and ownership for each claim.\n\nThe active seven-day source-resolution cadence remains mandatory continuous drift monitoring after qualification. It is not a countdown or a pre-expansion waiting period.\n\nThe six-card pilot has completed this current maintainability milestone. Qualification is evidence, not expansion authority. Any registry expansion still requires explicit approval of the next risk-tier batch and a separate bounded reviewed change. Passing qualification, a CI run, or any model-placeholder exercise must never be interpreted as automatic registry expansion.''',
          )

          replace_once(
              'docs/methodology/README.md',
              '- [`regulated-specialist-evidence-pilot-2026-08-06.md`](regulated-specialist-evidence-pilot-2026-08-06.md) remains an active bounded pilot method despite its dated filename; its evidence and expansion gates are still operationally relevant.\n\nHistorical executions of these or related methods are indexed under [`docs/history/`](../history/).',
              '- [`regulated-specialist-evidence-pilot-2026-08-06.md`](regulated-specialist-evidence-pilot-2026-08-06.md) remains the active bounded six-card pilot method despite its dated filename; its current maintainability milestone is stability-qualified.\n- [`../../policy/specialists/evidence-stability-qualification.yaml`](../../policy/specialists/evidence-stability-qualification.yaml) defines the executable maintainability qualification while preserving seven-day continuous authority monitoring and separate expansion approval.\n\nThe completed qualification is preserved as dated evidence in [`../history/validation/regulated-specialist-evidence-stability-qualification-2026-08-16.md`](../history/validation/regulated-specialist-evidence-stability-qualification-2026-08-16.md). Historical executions of these or related methods are indexed under [`docs/history/`](../history/).',
          )

          freshness = read('docs/methodology/specialist-freshness.md')
          if '## Regulated Pilot Qualification' not in freshness:
              freshness = freshness.rstrip() + '''\n\n## Regulated Pilot Qualification\n\nThe bounded regulated-specialist pilot binds current claims in `policy/specialists/evidence-pilot.yaml` and applies the executable maintainability requirements in `policy/specialists/evidence-stability-qualification.yaml`. The current six-card pilot has completed that qualification.\n\nQualification requires repeated clean authority resolution, independently executed repeatability, governed fail-closed mutation resistance, controlled authority-move handling, and an external-network observation. It does not replace claim expiry, tier-1 authority requirements, independent preparation/verification ownership, refusal on stale or unavailable evidence, or escalation on authoritative conflict.\n\nThe seven-day source-resolution cadence remains continuous drift detection after qualification. It is not an elapsed-time gate. Qualification does not auto-authorize expansion; a next risk-tier batch requires explicit approval and a separate reviewed registry change.\n'''
              write('docs/methodology/specialist-freshness.md', freshness)

          write('docs/history/validation/README.md', '''# Validation History\n\nCompleted validation, evidence-result, and conformance records belong here when they are historical observations rather than reusable methodology or active policy.\n\nA validation-history record preserves what was tested and observed at a particular point in time. It does not become current authority merely because the result once passed. Current authority remains in machine-readable policy, executable configuration, schemas, and the canonical Progress Tracker.\n\n## Regulated specialist evidence\n\nThe current bounded six-card pilot has the following preserved validation sequence:\n\n- [`regulated-specialist-evidence-refresh-cycle-2026-08-11.md`](regulated-specialist-evidence-refresh-cycle-2026-08-11.md) and its [machine-readable record](regulated-specialist-evidence-refresh-cycle-2026-08-11.json): formal refresh cycle 1.\n- [`regulated-specialist-evidence-refresh-cycle-2026-08-16.md`](regulated-specialist-evidence-refresh-cycle-2026-08-16.md) and its [machine-readable record](regulated-specialist-evidence-refresh-cycle-2026-08-16.json): formal refresh cycle 2 and the controlled ISO authority move.\n- [`regulated-specialist-evidence-stability-qualification-2026-08-16.md`](regulated-specialist-evidence-stability-qualification-2026-08-16.md) and its [machine-readable record](regulated-specialist-evidence-stability-qualification-2026-08-16.json): executable stability qualification with five clean authority-resolution replays, three independent repeatability runs, 15 of 15 governed fail-closed mutations, controlled authority-move handling, and external-network resolution evidence.\n\nEarlier refresh records may describe the former 30-day elapsed-time prerequisite because that was the policy in force when those observations were recorded. They are intentionally preserved as historical evidence. The current maintainability rule is `policy/specialists/evidence-stability-qualification.yaml`: no calendar wait, continuous seven-day source resolution, and separate explicit next-batch approval before any expansion.\n''')

          replace_once(
              'docs/stewardship/roadmap.md',
              '- six-card regulated evidence/freshness pilot',
              '- six-card regulated evidence/freshness pilot with completed executable stability qualification',
          )
          replace_once(
              'docs/stewardship/roadmap.md',
              'Do not broaden live verification based on model confidence alone. Broader scope remains governed by applicable authority, capability, verification, telemetry, recovery, evidence, risk, and maintainer-review controls. Optional human calibration may strengthen the evidence base but does not create a separate approval authority.\n\n### Completed operational evidence chain',
              'Do not broaden live verification based on model confidence alone. Broader scope remains governed by applicable authority, capability, verification, telemetry, recovery, evidence, risk, and maintainer-review controls. Optional human calibration may strengthen the evidence base but does not create a separate approval authority.\n\n### Regulated specialist evidence\n\nThe bounded six-card regulated specialist evidence pilot has completed its current maintainability milestone. Two formal refresh cycles are preserved in validation history, followed by an executable stability qualification with five complete clean authority-resolution replays, three independent repeatability runs, 15 of 15 governed fail-closed mutations, controlled authority-move handling, and an external-network 7-of-7 authority observation.\n\nThe seven-day authority-resolution cadence remains mandatory continuous drift detection. There is no elapsed-time countdown gate. Qualification does not auto-authorize a larger registry: any next risk-tier batch requires explicit approval and a separate reviewed bounded change.\n\n### Completed operational evidence chain',
          )

          replace_once(
              'docs/stewardship/README.md',
              '- [`roadmap.md`](roadmap.md) records directional project priorities and accepted future research without creating runtime or routing authority.\n',
              '- [`roadmap.md`](roadmap.md) records directional project priorities and accepted future research without creating runtime or routing authority.\n- The regulated specialist evidence milestone is summarized in the Progress Tracker and governed by [`../../policy/specialists/evidence-stability-qualification.yaml`](../../policy/specialists/evidence-stability-qualification.yaml); dated qualification evidence remains under [`../history/validation/`](../history/validation/).\n',
          )

          replace_once(
              'community/specialists/README.md',
              'These counts reflect current allocation overrides and active extensions. Do not infer current team ownership from the original 56-role import alone.\n\n## Canonical preservation rule',
              '''These counts reflect current allocation overrides and active extensions. Do not infer current team ownership from the original 56-role import alone.\n\n## Regulated evidence pilot\n\nSix active specialists currently participate in the bounded regulated evidence pilot: Legal Operations, Tax Strategist, Loan Officer Assistant, Compliance Auditor, Civil Engineer, and Embedded Engineer. The pilot has completed two formal refresh cycles and its executable stability qualification without rewriting or narrowing any canonical specialist role card.\n\nThe active claim registry is [`policy/specialists/evidence-pilot.yaml`](../../policy/specialists/evidence-pilot.yaml), the qualification contract is [`policy/specialists/evidence-stability-qualification.yaml`](../../policy/specialists/evidence-stability-qualification.yaml), and the completed qualification evidence is preserved under [`docs/history/validation/`](../../docs/history/validation/). Seven-day authority resolution remains continuous monitoring. Qualification does not add specialists to the pilot automatically; expansion requires explicit next risk-tier batch approval and a separate reviewed change.\n\n## Canonical preservation rule''',
          )

          write('reference/implementations/README.md', '''# Reference Implementations\n\nReadable, non-normative implementations used to demonstrate TEO behavior. Machine-readable policy and canonical schemas remain authoritative when prose or example code disagrees.\n\n## Python reference control plane\n\n[`python/README.md`](python/README.md) documents the runnable Python router, provider-adapter boundary, retry/fallback behavior, live verification, finalization, controlled documentation replay, and executable regulated-evidence stability qualification.\n\nThe regulated-evidence harness is implemented in `teo_reference.evidence_stability` and is governed by `policy/specialists/evidence-stability-qualification.yaml`. Deterministic replay and mutation evidence demonstrate conformance; external-network authority resolution remains separately evidenced and continuous seven-day monitoring remains active.\n''')
          replace_once(
              'reference/implementations/python/README.md',
              '''## End-to-end demonstration\n\n```bash\npython reference/examples/run_example.py\n```''',
              '''## Regulated evidence stability qualification\n\nThe reference package includes `teo_reference.evidence_stability`, an executable qualification harness for the bounded six-card regulated-specialist evidence pilot. The governing requirements live in `policy/specialists/evidence-stability-qualification.yaml`.\n\nThe current qualification requires five complete clean authority-resolution replays, three independently executed repeatability runs, all 15 governed fail-closed mutation classes to be killed, a controlled authority-move path, and a successful external-network authority-resolution observation. The harness does not convert deterministic fixtures into a claim of live network success; the external observation is validated separately.\n\nThe active seven-day authority-resolution cadence remains continuous monitoring after qualification. The qualification result is evidence only and never auto-authorizes registry expansion. Any next risk-tier batch requires explicit approval and a separate reviewed change.\n\nHistorical qualification evidence is recorded in `docs/history/validation/regulated-specialist-evidence-stability-qualification-2026-08-16.md`.\n\n## End-to-end demonstration\n\n```bash\npython reference/examples/run_example.py\n```''',
          )

          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              '        "Qualified-human approval lifecycle",\n',
              '        "Qualified-human approval lifecycle",\n        "Regulated specialist evidence",\n        "stability-qualified",\n        "five complete clean authority-resolution replays",\n        "three independent repeatability runs",\n        "15 of 15 governed fail-closed mutations",\n        "seven-day source-resolution cadence",\n        "explicit next risk-tier batch approval",\n',
          )

          retired = {
              'AI_INSTRUCTIONS.md': ['maintainability gate is explicitly approved'],
              'docs/methodology/regulated-specialist-evidence-pilot-2026-08-06.md': ['stable scheduled authority resolution for at least 30 days'],
              'docs/history/validation/README.md': ['No validation records are migrated into this area'],
          }
          for path, phrases in retired.items():
              text = read(path)
              for phrase in phrases:
                  if phrase in text:
                      raise SystemExit(f'{path}: retired current-facing phrase remains: {phrase}')
          PY

      - name: Commit documentation reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AI_INSTRUCTIONS.md CHANGELOG.md docs/methodology docs/history/validation/README.md docs/stewardship community/specialists/README.md reference/implementations tests/test_documentation_control_plane_truth.py
          git diff --cached --check
          git commit -m 'Reconcile documentation after evidence qualification'
          git push origin HEAD:agent/reconcile-documentation-after-evidence-qualification
