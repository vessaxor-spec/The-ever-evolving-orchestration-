name: One-shot Host Integration Protocol finalization

on:
  push:
    branches:
      - agent/host-integration-protocol-0-1-reconciled

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-protocol-0-1-reconciled
      - name: Reconcile verification evidence
        run: python .github/scripts/finalize_host_integration_protocol.py
      - name: Validate updates
        run: |
          python -m compileall -q tests .github/scripts
          git diff --check
      - name: Commit evidence reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/stewardship/progress-tracker.md research/runtime/host-integration-protocol-0-1-2026-08-17.md tests/test_documentation_control_plane_truth.py
          git diff --cached --check
          git commit -m 'Record Host Integration Protocol verification evidence'
          git push origin HEAD:agent/host-integration-protocol-0-1-reconciled
