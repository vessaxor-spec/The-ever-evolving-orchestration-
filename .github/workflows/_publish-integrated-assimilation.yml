name: Publish Integrated Assimilation Research

on:
  push:
    branches:
      - agent/host-integration-integrated-assimilation
    paths:
      - .github/workflows/_publish-integrated-assimilation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-integrated-assimilation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-integrated-assimilation
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Reconstruct exact sandbox-tested payload
        run: |
          cat .teo-transfer/integrated-assimilation.part* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          echo "77a679db4bdeac47aede4ea62ea061682793ddda85c4b74bd7b1585e5b602fdc  /tmp/payload.tar.xz" | sha256sum -c -
          tar -xJf /tmp/payload.tar.xz
          sed -i 's/[[:space:]]\+$//' research/roadmaps/host-integration-assimilation-protocol.md research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md
      - name: Prove exact write scope and targeted conformance
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'research/runtime/host_integration_integrated_conformance.py',
              'tests/test_host_integration_integrated_conformance.py',
              'research/roadmaps/host-integration-assimilation-protocol.md',
              'research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          actual = {line[3:] for line in lines}
          if actual != expected:
              raise SystemExit(f'unexpected payload scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          python -m pytest -q tests/test_host_integration_integrated_conformance.py
      - name: Commit only sandbox-tested research files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/runtime/host_integration_integrated_conformance.py tests/test_host_integration_integrated_conformance.py research/roadmaps/host-integration-assimilation-protocol.md research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md
          git diff --cached --check
          git commit -m 'Add integrated Host Integration assimilation conformance research'
          git push origin HEAD:refs/heads/agent/host-integration-integrated-assimilation
