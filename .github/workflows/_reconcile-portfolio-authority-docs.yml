name: Reconcile Portfolio Authority Documentation

on:
  push:
    branches:
      - agent/host-integration-portfolio-authority-separation
    paths:
      - .github/workflows/_reconcile-portfolio-authority-docs.yml
      - research/runtime/_reconcile_portfolio_authority_docs.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-portfolio-authority-separation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-portfolio-authority-separation

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Apply fail-closed documentation reconciliation
        run: python research/runtime/_reconcile_portfolio_authority_docs.py

      - name: Prove write scope and documentation truth
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'README.md',
              'docs/stewardship/progress-tracker.md',
              'research/roadmaps/host-integration-contract.md',
              'tests/test_documentation_control_plane_truth.py',
              'tests/test_host_integration_summary_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected reconciliation write scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m pytest -q tests/test_host_integration_summary_truth.py tests/test_documentation_control_plane_truth.py

      - name: Commit only reconciled canonical files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md docs/stewardship/progress-tracker.md research/roadmaps/host-integration-contract.md tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
          git diff --cached --check
          git commit -m 'Reconcile Host Integration portfolio authority research documentation'
          git push origin HEAD:refs/heads/agent/host-integration-portfolio-authority-separation
