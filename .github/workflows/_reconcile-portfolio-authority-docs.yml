name: Reconcile Portfolio Authority Documentation

on:
  push:
    branches:
      - agent/host-integration-portfolio-authority-separation
    paths:
      - .github/workflows/_reconcile-portfolio-authority-docs.yml
      - research/runtime/_reconcile_portfolio_authority_docs.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-portfolio-authority-separation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-portfolio-authority-separation

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock

      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Align temporary reconciliation helper to current truth-test text
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/runtime/_reconcile_portfolio_authority_docs.py')
          text = path.read_text(encoding='utf-8')
          old = '''text = replace_once(text, '\"host-integration-freshness-binding-2026-08-14.md\",\\n        \"exact local freshness binding\",', '\"host-integration-freshness-binding-2026-08-14.md\",\\n        \"host-integration-portfolio-authority-separation-2026-08-15.md\",\\n        \"exact local freshness binding\",\\n        \"portfolio/task-admission separation\",', \"summary truth portfolio phrases\")'''
          new = '''text = replace_once(text, '\"host-integration-freshness-binding-2026-08-14.md\",\\n        \"process-lifetime recursion resistance\",\\n        \"exact local freshness binding\",', '\"host-integration-freshness-binding-2026-08-14.md\",\\n        \"host-integration-portfolio-authority-separation-2026-08-15.md\",\\n        \"process-lifetime recursion resistance\",\\n        \"exact local freshness binding\",\\n        \"portfolio/task-admission separation\",', \"summary truth portfolio phrases\")'''
          if text.count(old) != 1:
              raise SystemExit(f'temporary helper alignment expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply fail-closed documentation reconciliation
        run: python research/runtime/_reconcile_portfolio_authority_docs.py

      - name: Link roadmap gate to exact portfolio authority evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/roadmaps/host-integration-contract.md')
          text = path.read_text(encoding='utf-8')
          old = 'Conformant process-local task-admission separation slice satisfied by the 2026-08-15 research harness and corrected CI #703;'
          new = 'Conformant process-local task-admission separation slice satisfied by the [2026-08-15 research harness](../runtime/host-integration-portfolio-authority-separation-2026-08-15.md) and corrected CI #703;'
          if text.count(old) != 1:
              raise SystemExit(f'roadmap evidence link expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Restore temporary helper and prove write scope and documentation truth
        run: |
          git checkout -- research/runtime/_reconcile_portfolio_authority_docs.py
          python - <<'PY'
          import subprocess
          expected = {
              'README.md',
              'docs/stewardship/progress-tracker.md',
              'research/roadmaps/host-integration-contract.md',
              'tests/test_documentation_control_plane_truth.py',
              'tests/test_host_integration_summary_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected reconciliation write scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m pytest -q tests/test_host_integration_summary_truth.py tests/test_documentation_control_plane_truth.py

      - name: Commit only reconciled canonical files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md docs/stewardship/progress-tracker.md research/roadmaps/host-integration-contract.md tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
          git diff --cached --check
          git commit -m 'Reconcile Host Integration portfolio authority research documentation'
          git push origin HEAD:refs/heads/agent/host-integration-portfolio-authority-separation
