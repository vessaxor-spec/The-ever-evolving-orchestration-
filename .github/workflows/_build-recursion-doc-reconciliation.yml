name: Apply Recursion Documentation Reconciliation

on:
  push:
    branches:
      - agent/host-recursion-resistance
    paths:
      - .github/workflows/_build-recursion-doc-reconciliation.yml
      - research/runtime/_build_recursion_doc_reconciliation.py
      - research/runtime/_build_recursion_truth_reconciliation.py

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-recursion-resistance'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-recursion-resistance

      - name: Apply fail-closed canonical reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/runtime/_build_recursion_doc_reconciliation.py')
          text = path.read_text(encoding='utf-8')
          marker = '# Public-summary truth canary.'
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one canonical-doc/test reconciliation boundary')
          path.write_text(text.split(marker, 1)[0], encoding='utf-8')
          PY
          python research/runtime/_build_recursion_doc_reconciliation.py
          python research/runtime/_build_recursion_truth_reconciliation.py

      - name: Prove write scope and patch hygiene
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'README.md',
              'docs/stewardship/progress-tracker.md',
              'research/roadmaps/host-integration-contract.md',
              'tests/test_documentation_control_plane_truth.py',
              'tests/test_host_integration_summary_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected reconciliation write scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check

      - name: Commit only reconciled canonical files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md docs/stewardship/progress-tracker.md research/roadmaps/host-integration-contract.md tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
          git diff --cached --check
          git commit -m 'Reconcile recursion-resistance research documentation'
          git push origin HEAD:refs/heads/agent/host-recursion-resistance
