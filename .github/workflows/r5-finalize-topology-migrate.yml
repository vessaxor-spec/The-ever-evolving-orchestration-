name: R5 Finalize Topology Migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/worker-implementation-topology' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: agent/worker-implementation-topology

      - name: Retarget R5 consumers and governance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          ROOT = Path('.')
          WORKFLOW = '.github/workflows/r5-finalize-topology-migrate.yml'
          LAYOUT = 'policy/governance/repository-layout.yaml'
          LAYOUT_TEST = 'tests/test_repository_layout.py'
          WORKER_FILES = [
              'incident-response-worker.yaml',
              'research-worker.yaml',
              'market-research-worker.yaml',
              'analytics-worker.yaml',
              'user-research-worker.yaml',
              'compliance-worker.yaml',
              'systems-engineering-worker.yaml',
              'platform-reliability-core-workers.yaml',
              'platform-reliability-operations-workers.yaml',
              'physical-systems-workers.yaml',
              'assurance-workers.yaml',
              'principal-engineering-active-workers.yaml',
              'specialist-completion-workers.yaml',
              'runtime-worker-overrides.yaml',
          ]
          PATH_MAP = {
              f'community/workers/{name}': f'community/workers/extensions/{name}'
              for name in WORKER_FILES
          }

          def replace_once(text: str, old: str, new: str, context: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{context}: expected exactly one replacement, found {count}')
              return text.replace(old, new, 1)

          # Retarget current consumers only. Governance, registry, history, capsules,
          # and the migration regression test are handled separately or intentionally
          # preserve retired path text.
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          for name in tracked:
              if (
                  name in {WORKFLOW, LAYOUT, LAYOUT_TEST}
                  or name.startswith('docs/history/')
                  or name.startswith('community/capsules/')
                  or name.startswith('registry/')
              ):
                  continue
              path = ROOT / name
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              updated = text
              for old, new in PATH_MAP.items():
                  updated = updated.replace(old, new)
                  old_parts = old.split('/')
                  new_parts = new.split('/')
                  updated = updated.replace(
                      ' / '.join(f'"{part}"' for part in old_parts),
                      ' / '.join(f'"{part}"' for part in new_parts),
                  )
                  updated = updated.replace(
                      ' / '.join(f"'{part}'" for part in old_parts),
                      ' / '.join(f"'{part}'" for part in new_parts),
                  )
              updated = re.sub(
                  r'(?<![/A-Za-z0-9_.-])models\.yaml',
                  'policy/routing/core/implementation-defaults.yaml',
                  updated,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          layout_path = ROOT / LAYOUT
          layout = layout_path.read_text(encoding='utf-8')
          layout = replace_once(
              layout,
              '''  temporary_exceptions:\n    models.yaml:\n      target: policy/routing/implementation-defaults.yaml\n      migration_phase: R5\n''',
              '''  temporary_exceptions: {}\n''',
              'root model exception',
          )
          layout = replace_once(
              layout,
              '''      core:\n        - routing.yaml\n        - specialist-model-routing.yaml\n        - team-routing.yaml\n''',
              '''      core:\n        - implementation-defaults.yaml\n        - routing.yaml\n        - specialist-model-routing.yaml\n        - team-routing.yaml\n''',
              'routing core contents',
          )
          layout = replace_once(
              layout,
              '''  community_workers:\n    path: community/workers\n    canonical_direct_files:\n      - README.md\n      - workers.yaml\n    temporary_direct_extensions:\n      - analytics-worker.yaml\n      - assurance-workers.yaml\n      - compliance-worker.yaml\n      - final-specialist-workers.yaml\n      - incident-response-worker.yaml\n      - market-research-worker.yaml\n      - physical-systems-workers.yaml\n      - platform-reliability-core-workers.yaml\n      - platform-reliability-operations-workers.yaml\n      - principal-engineering-active-workers.yaml\n      - research-worker.yaml\n      - runtime-worker-overrides.yaml\n      - specialist-completion-workers.yaml\n      - systems-engineering-worker.yaml\n      - user-research-worker.yaml\n    approved_subdirectories:\n      - extensions\n    future_rule: >-\n      New worker extension files should be placed under community/workers/extensions\n      after the loader migration is complete. Until then, any additional direct extension\n      requires an explicit repository-layout policy change.\n''',
              '''  community_workers:\n    path: community/workers\n    canonical_direct_files:\n      - README.md\n      - workers.yaml\n    temporary_direct_extensions: []\n    approved_subdirectories:\n      - extensions\n    canonical_extensions:\n      - analytics-worker.yaml\n      - assurance-workers.yaml\n      - compliance-worker.yaml\n      - incident-response-worker.yaml\n      - market-research-worker.yaml\n      - physical-systems-workers.yaml\n      - platform-reliability-core-workers.yaml\n      - platform-reliability-operations-workers.yaml\n      - principal-engineering-active-workers.yaml\n      - research-worker.yaml\n      - runtime-worker-overrides.yaml\n      - specialist-completion-workers.yaml\n      - systems-engineering-worker.yaml\n      - user-research-worker.yaml\n    future_rule: >-\n      Direct worker-extension YAML is prohibited. Stable base workers remain in\n      workers.yaml and additive active worker definitions belong in extensions.\n      Superseded worker staging state belongs under docs/history.\n''',
              'worker topology contract',
          )
          layout = replace_once(
              layout,
              '''    - R4_policy_topology\n  current_phase: R5\n''',
              '''    - R4_policy_topology\n    - R5_worker_and_implementation_topology\n  current_phase: complete\n''',
              'migration completion',
          )
          layout_path.write_text(layout, encoding='utf-8')

          validator_path = ROOT / 'ci/validate_repository_layout.py'
          validator = validator_path.read_text(encoding='utf-8')
          validator = replace_once(
              validator,
              '''    worker_subdirs = set(\n        _string_list(workers["approved_subdirectories"], "community_workers.approved_subdirectories")\n    )\n    for path in sorted(paths, key=str):\n        if len(path.parts) >= 4 and path.parts[:2] == ("community", "workers"):\n            if path.parts[2] not in worker_subdirs:\n                errors.append(f"Unknown worker subdirectory {path.parts[2]} from {path}")\n''',
              '''    worker_subdirs = set(\n        _string_list(workers["approved_subdirectories"], "community_workers.approved_subdirectories")\n    )\n    worker_extensions = set(\n        _string_list(workers["canonical_extensions"], "community_workers.canonical_extensions")\n    )\n    if worker_subdirs != {"extensions"}:\n        raise LayoutPolicyError("community_workers.approved_subdirectories must be exactly extensions")\n    for path in sorted(paths, key=str):\n        if len(path.parts) >= 4 and path.parts[:2] == ("community", "workers"):\n            if path.parts[2] not in worker_subdirs:\n                errors.append(f"Unknown worker subdirectory {path.parts[2]} from {path}")\n                continue\n            if len(path.parts) != 4:\n                errors.append(f"Nested worker path is not allowed below {path.parts[2]}: {path}")\n                continue\n            if path.name not in worker_extensions:\n                errors.append(\n                    f"Undeclared worker extension community/workers/extensions/{path.name}; "\n                    "update worker topology governance intentionally before adding active worker policy"\n                )\n''',
              'worker validator',
          )
          validator_path.write_text(validator, encoding='utf-8')

          worker_readme = ROOT / 'community/workers/README.md'
          text = worker_readme.read_text(encoding='utf-8')
          anchor = 'The stable worker profiles are defined in [`workers.yaml`](workers.yaml).\n'
          addition = '''\nActive additive worker definitions are under [`extensions/`](extensions/). The reference router loads an explicit governed list of those files; it does not discover arbitrary worker YAML by directory traversal.\n\nSuperseded worker staging records belong under [`docs/history/activation/`](../../docs/history/activation/), not in the active worker namespace.\n'''
          if addition.strip() not in text:
              text = text.replace(anchor, anchor + addition, 1)
          worker_readme.write_text(text, encoding='utf-8')

          routing_readme = ROOT / 'policy/routing/README.md'
          text = routing_readme.read_text(encoding='utf-8')
          text = text.replace(
              '- [`core/`](core/) contains canonical base team, implementation, and specialist-model routing policy.',
              '- [`core/`](core/) contains canonical base team, implementation, specialist-model routing policy, and implementation defaults.',
              1,
          )
          routing_readme.write_text(text, encoding='utf-8')

          history_index = ROOT / 'docs/history/activation/README.md'
          history = history_index.read_text(encoding='utf-8')
          marker = '- [`final-specialist-tranche-staging.yaml`](final-specialist-tranche-staging.yaml)\n'
          addition = '- [`final-specialist-workers.yaml`](final-specialist-workers.yaml)\n'
          if addition not in history:
              history = history.replace(marker, marker + addition, 1)
          history_index.write_text(history, encoding='utf-8')

          changelog_path = ROOT / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          anchor = '- active routing policy is now separated into canonical core, extension, and activation namespaces\n'
          addition = '- stable base workers, active worker extensions, and implementation defaults now have separate canonical topology\n'
          if addition not in changelog:
              changelog = changelog.replace(anchor, anchor + addition, 1)
          changelog = changelog.replace(
              'retired R3 documentation locations, and retired R4 routing locations',
              'retired R3 documentation locations, retired R4 routing locations, and retired R5 worker and implementation locations',
              1,
          )
          changelog = changelog.replace(
              'Repository information-architecture migration has completed R1, R2, R3, and R4. R5 worker and implementation topology is next.',
              'Repository information-architecture migration has completed R1 through R5. The planned information-architecture migration is complete.',
              1,
          )
          changelog_path.write_text(changelog, encoding='utf-8')

          tests_path = ROOT / LAYOUT_TEST
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace('    assert policy["migration"]["current_phase"] == "R5"\n', '')
          if 'R5_OLD_PATHS = {' not in tests:
              tests += '''\n\nR5_WORKER_FILES = {\n    "analytics-worker.yaml",\n    "assurance-workers.yaml",\n    "compliance-worker.yaml",\n    "incident-response-worker.yaml",\n    "market-research-worker.yaml",\n    "physical-systems-workers.yaml",\n    "platform-reliability-core-workers.yaml",\n    "platform-reliability-operations-workers.yaml",\n    "principal-engineering-active-workers.yaml",\n    "research-worker.yaml",\n    "runtime-worker-overrides.yaml",\n    "specialist-completion-workers.yaml",\n    "systems-engineering-worker.yaml",\n    "user-research-worker.yaml",\n}\n\nR5_OLD_PATHS = {\n    "models.yaml",\n    "community/workers/final-specialist-workers.yaml",\n    *{f"community/workers/{name}" for name in R5_WORKER_FILES},\n}\n\nR5_CANONICAL_PATHS = {\n    "policy/routing/core/implementation-defaults.yaml",\n    "docs/history/activation/final-specialist-workers.yaml",\n    *{f"community/workers/extensions/{name}" for name in R5_WORKER_FILES},\n}\n\n\ndef test_r5_worker_and_implementation_paths_are_canonical() -> None:\n    paths = _current_paths()\n    assert R5_OLD_PATHS.isdisjoint(paths)\n    assert R5_CANONICAL_PATHS <= paths\n\n\ndef test_r5_closes_layout_exceptions_and_completes_migration() -> None:\n    policy = validator.load_policy(POLICY_PATH)\n    workers = policy["contracts"]["community_workers"]\n    routing = policy["contracts"]["policy_routing"]\n    assert policy["root"]["temporary_exceptions"] == {}\n    assert workers["temporary_direct_extensions"] == []\n    assert set(workers["canonical_extensions"]) == R5_WORKER_FILES\n    assert "implementation-defaults.yaml" in routing["canonical_subdirectories"]["core"]\n    assert "R5_worker_and_implementation_topology" in policy["migration"]["completed_phases"]\n    assert policy["migration"]["current_phase"] == "complete"\n\n\ndef test_undeclared_worker_extension_is_rejected() -> None:\n    policy = validator.load_policy(POLICY_PATH)\n    paths = _current_paths() | {"community/workers/extensions/random-worker.yaml"}\n    errors = validator.validate_layout(paths, policy)\n    assert any("Undeclared worker extension" in error for error in errors)\n'''
          tests_path.write_text(tests, encoding='utf-8')

          historical_targets = {
              'tests/test_assurance_staging.py': 'community/workers/extensions/assurance-workers.yaml',
              'tests/test_final_specialist_tranche_staging.py': 'docs/history/activation/final-specialist-workers.yaml',
              'tests/test_physical_systems_staging.py': 'community/workers/extensions/physical-systems-workers.yaml',
              'tests/test_platform_reliability_core_staging.py': 'community/workers/extensions/platform-reliability-core-workers.yaml',
              'tests/test_platform_reliability_operations_staging.py': 'community/workers/extensions/platform-reliability-operations-workers.yaml',
              'tests/test_systems_engineering_specialist_staging.py': 'community/workers/extensions/systems-engineering-worker.yaml',
          }
          for test_name, target in historical_targets.items():
              path = ROOT / test_name
              text = path.read_text(encoding='utf-8')
              target_expr = ' / '.join(f'"{part}"' for part in target.split('/'))
              text = text.replace(
                  'REPO_ROOT / staging["worker_contract"]["path"]',
                  f'REPO_ROOT / {target_expr}',
              )
              text = text.replace(
                  'REPO_ROOT / staging["worker"]["definition"]',
                  f'REPO_ROOT / {target_expr}',
              )
              path.write_text(text, encoding='utf-8')

          stale = []
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bare_model = re.compile(r'(?<![/A-Za-z0-9_.-])models\.yaml')
          for name in tracked:
              if (
                  name in {WORKFLOW, LAYOUT_TEST}
                  or name.startswith('docs/history/')
                  or name.startswith('community/capsules/')
                  or name.startswith('registry/')
              ):
                  continue
              path = ROOT / name
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              if bare_model.search(text):
                  stale.append(f'{name}: root models.yaml reference remains')
              for old in PATH_MAP:
                  if old in text:
                      stale.append(f'{name}: {old}')
          if stale:
              raise SystemExit('Retired active paths remain:\n' + '\n'.join(stale))
          PY

          git rm .github/workflows/r5-finalize-topology-migrate.yml
          git add -A
          git diff --cached --check
          git commit -m "Finalize worker and implementation topology"
          git push origin agent/worker-implementation-topology
