name: Reconcile Fresh-Session Trial Truth

on:
  push:
    branches:
      - agent/reconcile-fresh-session-trial
    paths:
      - .github/workflows/_reconcile-fresh-session-trial.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/reconcile-fresh-session-trial'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact reconciliation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/reconcile-fresh-session-trial
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Reconcile canonical fresh-session truth
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'AI_INSTRUCTIONS.md',
              '15. When asked to assimilate, adopt, embed, or integrate TEO into another AI agent, runtime, or host architecture, read both `research/roadmaps/host-integration-contract.md` and `research/roadmaps/host-integration-assimilation-protocol.md` before designing or implementing the integration.',
              '15. When asked to assimilate, adopt, embed, or integrate TEO into another AI agent, runtime, or host architecture, read `research/roadmaps/host-integration-contract.md` and `research/roadmaps/host-integration-assimilation-protocol.md` before designing or implementing the integration. When claiming fresh-session/no-reminder inheritance or restart-persistent assimilation, also read `research/roadmaps/host-integration-fresh-session-trial.md` and do not claim that gate is closed without its evidence.',
              'AI fresh-session instruction',
          )
          replace_once(
              'AI_INSTRUCTIONS.md',
              'Copied files, installed packages, prompts, skills, one successful demo, or a green test suite do not prove assimilation. Process-local research can prove distinct-task continued use inside one running harness, but it cannot by itself prove that a fresh session inherited the integration, that no hidden reminder was supplied, or that the host persisted the hook across restart. Real host assimilation must provide durable cross-session evidence for those claims.',
              'Copied files, installed packages, prompts, skills, one successful demo, or a green test suite do not prove assimilation. Process-local research can prove distinct-task continued use inside one running harness, but it cannot by itself prove that a fresh session inherited the integration, that no hidden reminder was supplied, or that the host persisted the hook across restart. Real host assimilation must provide durable cross-session evidence for those claims. Use `research/roadmaps/host-integration-fresh-session-trial.md` for that stronger claim; the existence of the trial framework or validator is not itself a PASS.',
              'AI assimilation evidence boundary',
          )

          replace_once(
              'research/roadmaps/host-integration-assimilation-protocol.md',
              'The process-local harness still cannot prove that the second task occurred in a genuinely fresh session, that no hidden reminder was supplied, or that a host persisted its hook across restart. Those remain explicit cross-session/production evidence requirements even after the process-local result passes.',
              'The process-local harness still cannot prove that the second task occurred in a genuinely fresh session, that no hidden reminder was supplied, or that a host persisted its hook across restart. Those remain explicit cross-session/production evidence requirements even after the process-local result passes. Any stronger fresh-session/no-reminder claim must use the two-session protocol and evidence validator in [`host-integration-fresh-session-trial.md`](host-integration-fresh-session-trial.md); having that framework installed does not close the empirical gate.',
              'assimilation Phase 9 handoff',
          )

          replace_once(
              'research/roadmaps/host-integration-contract.md',
              '- [`../runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md`](../runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md), the hands-on integrated sandbox, negative controls, premortem replay, and continued-use evidence boundary.',
              '- [`../runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md`](../runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md), the hands-on integrated sandbox, negative controls, premortem replay, and continued-use evidence boundary;\n- [`host-integration-fresh-session-trial.md`](host-integration-fresh-session-trial.md), the two-session no-reminder trial protocol and evidence-packet validator for testing whether a durable host integration is actually inherited after the assimilation conversation ends.',
              'Host Integration evidence list',
          )
          replace_once(
              'research/roadmaps/host-integration-contract.md',
              'The current process-local harness requires two governed receipts with distinct task IDs. That protects against replaying one setup demo twice, but it does not prove that a genuinely fresh session inherited the integration without a reminder or that a production host persisted the hook across restart. Those claims require separate host evidence.',
              'The current process-local harness requires two governed receipts with distinct task IDs. That protects against replaying one setup demo twice, but it does not prove that a genuinely fresh session inherited the integration without a reminder or that a production host persisted the hook across restart. The dedicated [`host-integration-fresh-session-trial.md`](host-integration-fresh-session-trial.md) framework now makes that stronger claim falsifiable through a precommitted setup, distinct session, neutral challenge, exact TEO-path evidence, and independent PASS/FAIL/INCONCLUSIVE review. CI #735 validated the framework and validator, not an empirical host trial; true fresh-session/no-reminder inheritance remains open until a real host run passes.',
              'Host Integration cross-session boundary',
          )

          replace_once(
              'README.md',
              'The latest Host Integration executable research validation is Reference Implementation CI #720: **941 automated tests**, **539 tracked-file layout checks**, regulated specialist evidence validation, **41 JSON Schema** parses, valid linked configuration, and the provider-diverse artifact-bound end-to-end reference lifecycle. That run validated the hardened process-local integrated assimilation/conformance slice after hands-on sandbox operation of the full 535-file repository. The accepted harness composes host admission, TEO Mission Control dispatch, provenance, restrictive authority intersection, exact execution envelope, bounded host action, artifact-bound verification, finalization, negative controls, and premortem replay. It also rejects plugin/product framing and requires at least two distinct post-assimilation task IDs before process-local conformance can be claimed. Cross-session no-reminder continuity, restart-persistent host hooks, production scheduler enforcement, tenant/account/credential binding, dynamic hook/plugin authority discovery, remote authenticity, durable distributed state, and compromised-host resistance remain explicitly unproved.',
              'The latest Host Integration executable research validation is Reference Implementation CI #735: **958 automated tests**, **542 tracked-file layout checks**, regulated specialist evidence validation, **41 JSON Schema** parses, valid linked configuration, and the provider-diverse artifact-bound end-to-end reference lifecycle. That run validated the non-normative Fresh-AI cross-session trial framework and evidence-packet validator layered after the process-local integrated assimilation/conformance work. The trial requires a precommitted setup, a genuinely distinct later session, bootstrap/hook continuity before challenge disclosure, a neutral challenge with no TEO-specific reminder, a real TEO dispatch and downstream authority/verification/finalization evidence chain, and independent PASS/FAIL/INCONCLUSIVE review. CI #735 proves the framework and adversarial validator behavior; it does **not** prove that any real host has yet passed the fresh-session/no-reminder trial. Restart-persistent host hooks, production scheduler enforcement, tenant/account/credential binding, dynamic hook/plugin authority discovery, remote authenticity, durable distributed state, and compromised-host resistance remain explicitly unproved.',
              'README latest Host Integration validation',
          )
          replace_once(
              'README.md',
              '- integrated Fresh-AI assimilation/conformance composes the previously separate controls into one host path and makes "Assimilation is not installation" executable: plugin/product framing, parallel host routing, collapsed responsibility semantics, one-time hooks, activation without shadow evidence, one-demo-only continuity, same-task replay, staged-scope bypass, revoked admission, artifact mutation, human-gate loss, autonomy loss, recursive re-entry, and the original Host Integration premortem paths are rejected or replayed, while real cross-session persistence and production enforcement remain open.',
              '- integrated Fresh-AI assimilation/conformance composes the previously separate controls into one host path and makes "Assimilation is not installation" executable: plugin/product framing, parallel host routing, collapsed responsibility semantics, one-time hooks, activation without shadow evidence, one-demo-only continuity, same-task replay, staged-scope bypass, revoked admission, artifact mutation, human-gate loss, autonomy loss, recursive re-entry, and the original Host Integration premortem paths are rejected or replayed, while real cross-session persistence and production enforcement remain open;\n- the Fresh-AI cross-session trial framework binds a frozen setup commitment to a later neutral challenge and distinct-session evidence packet, rejects tested same-session reuse, reminder/context contamination, post-challenge bootstrap changes, hook/bootstrap drift, revision drift, missing TEO dispatch, failed verification/finalization, and incomplete control-path evidence, while an actual host PASS remains pending independent verification.',
              'README fresh-session bullet',
          )
          replace_once(
              'README.md',
              'The integrated assimilation/conformance slice was built only after materializing and operating the exact merged repository in a sandbox. Initial clean CI #717 passed **940 tests** and **539 tracked-file layout checks**. Independent review then found that two receipts could still represent the same setup task; the harness was hardened to require two distinct post-assimilation task IDs and to keep cross-session continued-use proof explicitly unsupported. The 26-case targeted hardening suite passed before commit, and clean hardened CI #720 passed **941 automated tests**, **539 tracked-file layout checks**, regulated specialist evidence validation, **41 JSON Schema** parses, valid linked configuration, and the provider-diverse artifact-bound end-to-end lifecycle. The full fresh-AI process is preserved in [`research/roadmaps/host-integration-assimilation-protocol.md`](research/roadmaps/host-integration-assimilation-protocol.md), with dated evidence in [`research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md`](research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md). Process-local success does not prove a fresh session inherited TEO without a reminder or that an arbitrary host cannot bypass its own integration.',
              'The integrated assimilation/conformance slice was built only after materializing and operating the exact merged repository in a sandbox. Initial clean CI #717 passed **940 tests** and **539 tracked-file layout checks**. Independent review then found that two receipts could still represent the same setup task; the harness was hardened to require two distinct post-assimilation task IDs and to keep cross-session continued-use proof explicitly unsupported. The 26-case targeted hardening suite passed before commit, and clean hardened CI #720 passed **941 automated tests**, **539 tracked-file layout checks**, regulated specialist evidence validation, **41 JSON Schema** parses, valid linked configuration, and the provider-diverse artifact-bound end-to-end lifecycle. The full fresh-AI process is preserved in [`research/roadmaps/host-integration-assimilation-protocol.md`](research/roadmaps/host-integration-assimilation-protocol.md), with dated evidence in [`research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md`](research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md). The stronger two-session question is now executable through [`research/roadmaps/host-integration-fresh-session-trial.md`](research/roadmaps/host-integration-fresh-session-trial.md); CI #735 passed **958 automated tests** and **542 tracked-file layout checks** for that framework. No empirical host PASS has yet been recorded, so process-local success and validator availability still do not prove a fresh session inherited TEO without a reminder or that an arbitrary host cannot bypass its own integration.',
              'README integrated assimilation history',
          )
          replace_once(
              'README.md',
              '[`research/roadmaps/host-integration-assimilation-protocol.md`](research/roadmaps/host-integration-assimilation-protocol.md), and [`research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md`](research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md).',
              '[`research/roadmaps/host-integration-assimilation-protocol.md`](research/roadmaps/host-integration-assimilation-protocol.md), [`research/roadmaps/host-integration-fresh-session-trial.md`](research/roadmaps/host-integration-fresh-session-trial.md), and [`research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md`](research/runtime/host-integration-integrated-conformance-assimilation-2026-08-15.md).',
              'README Host Integration links',
          )

          replace_once(
              'docs/stewardship/progress-tracker.md',
              '| Current validated scale | 941 tests passed, 539 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #730 |',
              '| Current validated scale | 958 tests passed, 542 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass; established by CI #735 |',
              'tracker current scale',
          )
          replace_once(
              'docs/stewardship/progress-tracker.md',
              '| Host-integration research validation | CI #720: 941 tests, 539 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass on the hardened process-local integrated Fresh-AI assimilation/conformance research head |',
              '| Host-integration research validation | CI #735: 958 tests, 542 tracked-file layout checks, 41 schemas, valid linked configuration, regulated-specialist evidence pass, provider-diverse artifact-bound end-to-end pass on the Fresh-AI cross-session trial framework/validator head; this validates the framework, not an empirical host PASS |',
              'tracker Host Integration validation',
          )
          replace_once(
              'docs/stewardship/progress-tracker.md',
              'process-local integrated Fresh-AI assimilation/conformance plus premortem replay research slices satisfied; contract remains non-normative and true cross-session continued-use proof, restart-persistent hooks,',
              'process-local integrated Fresh-AI assimilation/conformance plus premortem replay research slices satisfied and a Fresh-AI cross-session trial framework/validator implemented; contract remains non-normative and empirical true cross-session continued-use proof, restart-persistent hooks,',
              'tracker Host Integration contract row',
          )
          replace_once(
              'docs/stewardship/progress-tracker.md',
              'or integrated process-local Fresh-AI assimilation/conformance and premortem-replay research slices does not promote it ahead of the current live-execution milestone or imply an arbitrary completion percentage. The assimilation protocol requires continued TEO use after setup and rejects plugin/product install-and-forget framing, but true fresh-session/no-reminder inheritance, restart-persistent hooks,',
              'or integrated process-local Fresh-AI assimilation/conformance and premortem-replay research slices, or implementing the Fresh-AI cross-session trial framework, does not promote it ahead of the current live-execution milestone or imply an arbitrary completion percentage. The assimilation protocol requires continued TEO use after setup and rejects plugin/product install-and-forget framing. The cross-session trial framework now makes the stronger claim testable, but no empirical host PASS is recorded; true fresh-session/no-reminder inheritance, restart-persistent hooks,',
              'tracker research-track disposition',
          )

          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_TESTS = 941', 'EXPECTED_CURRENT_VALIDATED_TESTS = 958', 'current test count')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 539', 'EXPECTED_CURRENT_VALIDATED_TRACKED_FILES = 542', 'current file count')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 730', 'EXPECTED_CURRENT_VALIDATED_CI_RUN = 735', 'current CI run')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_HOST_INTEGRATION_CI_RUN = 720', 'EXPECTED_HOST_INTEGRATION_CI_RUN = 735', 'Host Integration CI run')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_HOST_INTEGRATION_TESTS = 941', 'EXPECTED_HOST_INTEGRATION_TESTS = 958', 'Host Integration tests')
          replace_once('tests/test_documentation_control_plane_truth.py', 'EXPECTED_HOST_INTEGRATION_TRACKED_FILES = 539', 'EXPECTED_HOST_INTEGRATION_TRACKED_FILES = 542', 'Host Integration files')
          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              '        "host-integration-assimilation-protocol.md",\n        "host-integration-integrated-conformance-assimilation-2026-08-15.md",',
              '        "host-integration-assimilation-protocol.md",\n        "host-integration-fresh-session-trial.md",\n        "host-integration-integrated-conformance-assimilation-2026-08-15.md",',
              'README trial truth phrase',
          )
          replace_once(
              'tests/test_documentation_control_plane_truth.py',
              '        "without relying on a special `use TEO` reminder",\n        "Copied files, installed packages, prompts, skills, one successful demo, or a green test suite do not prove assimilation",',
              '        "without relying on a special `use TEO` reminder",\n        "host-integration-fresh-session-trial.md",\n        "the existence of the trial framework or validator is not itself a PASS",\n        "Copied files, installed packages, prompts, skills, one successful demo, or a green test suite do not prove assimilation",',
              'AI instruction trial truth phrases',
          )

          replace_once(
              'tests/test_host_integration_summary_truth.py',
              '        "Reference Implementation CI #720",\n        "941 automated tests",\n        "539 tracked-file layout checks",',
              '        "Reference Implementation CI #735",\n        "958 automated tests",\n        "542 tracked-file layout checks",',
              'Host summary latest CI',
          )
          replace_once(
              'tests/test_host_integration_summary_truth.py',
              '        "host-integration-assimilation-protocol.md",\n        "host-integration-integrated-conformance-assimilation-2026-08-15.md",',
              '        "host-integration-assimilation-protocol.md",\n        "host-integration-fresh-session-trial.md",\n        "host-integration-integrated-conformance-assimilation-2026-08-15.md",',
              'Host summary trial link',
          )
          replace_once(
              'tests/test_host_integration_summary_truth.py',
              '        "Process-local integrated slice satisfied",\n        "CI #720",',
              '        "Process-local integrated slice satisfied",\n        "CI #720",\n        "host-integration-fresh-session-trial.md",\n        "CI #735 validated the framework and validator, not an empirical host trial",',
              'Host roadmap trial truth',
          )
          PY
      - name: Prove exact reconciliation scope and focused truth
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'AI_INSTRUCTIONS.md',
              'README.md',
              'docs/stewardship/progress-tracker.md',
              'research/roadmaps/host-integration-assimilation-protocol.md',
              'research/roadmaps/host-integration-contract.md',
              'tests/test_documentation_control_plane_truth.py',
              'tests/test_host_integration_summary_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected reconciliation scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m pytest -q tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py tests/test_host_integration_fresh_session_trial.py tests/test_host_integration_integrated_conformance.py
      - name: Commit canonical reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AI_INSTRUCTIONS.md README.md docs/stewardship/progress-tracker.md research/roadmaps/host-integration-assimilation-protocol.md research/roadmaps/host-integration-contract.md tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
          git diff --cached --check
          git commit -m 'Reconcile Fresh-AI cross-session trial truth'
          git push origin HEAD:refs/heads/agent/reconcile-fresh-session-trial
