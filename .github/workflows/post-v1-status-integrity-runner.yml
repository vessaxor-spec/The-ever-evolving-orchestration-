name: Run Post-v1 Integrity Remediation Once

on:
  push:
    branches:
      - agent/post-v1-status-integrity-audit

permissions:
  contents: write

jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: agent/post-v1-status-integrity-audit

      - name: Execute staged remediation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path('.')
          research = root / 'community/workers/extensions/research-worker.yaml'
          research_text = research.read_text(encoding='utf-8')
          if research_text.count('status: active') != 1:
              raise SystemExit('Expected the one already-corrected research worker status')
          research.write_text(research_text.replace('status: active', 'status: public-draft', 1), encoding='utf-8')

          staged = (root / '.github/workflows/post-v1-status-integrity-remediate.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git rm .github/workflows/post-v1-status-integrity-remediate.yml"
          if staged.count(marker) != 1 or staged.count(end_marker) != 1:
              raise SystemExit('Could not isolate the staged remediation script exactly once')
          body = staged.split(marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(body)
          exec(compile(script, 'post-v1-status-integrity-remediation', 'exec'), {})
          PY

          git rm .github/workflows/post-v1-status-integrity-remediate.yml
          git rm .github/workflows/post-v1-status-integrity-runner.yml
          git add -A
          git diff --cached --check
          git commit -m "Align post-v1 status and release integrity"
          git push origin agent/post-v1-status-integrity-audit
