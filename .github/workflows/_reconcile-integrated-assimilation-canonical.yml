name: Reconcile Integrated Assimilation Canonical Truth

on:
  push:
    branches:
      - agent/host-integration-integrated-assimilation
    paths:
      - .github/workflows/_reconcile-integrated-assimilation-canonical.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'vessaxor-spec/The-ever-evolving-orchestration-' && github.ref == 'refs/heads/agent/host-integration-integrated-assimilation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact research branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/host-integration-integrated-assimilation
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: ci/requirements-ci.lock
      - name: Install pinned validation environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r ci/requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Reconstruct exact sandbox-tested canonical patch
        run: |
          cat .teo-transfer/canonical-assimilation.part* > /tmp/canonical.patch.xz.b64
          base64 -d /tmp/canonical.patch.xz.b64 > /tmp/canonical.patch.xz
          echo "0c6376844ce456d7be01c84edc8e44e513a809a74a2067b1fe828786fcc70acd  /tmp/canonical.patch.xz" | sha256sum -c -
          xz -dc /tmp/canonical.patch.xz > /tmp/canonical.patch
          git apply --check /tmp/canonical.patch
          git apply /tmp/canonical.patch
      - name: Prove bounded write scope and canonical assimilation truth
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'AI_INSTRUCTIONS.md',
              'README.md',
              'docs/stewardship/progress-tracker.md',
              'research/roadmaps/host-integration-contract.md',
              'tests/test_documentation_control_plane_truth.py',
              'tests/test_host_integration_summary_truth.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected canonical reconciliation scope: expected={sorted(expected)} actual={sorted(actual)}')
          PY
          git diff --check
          python -m pytest -q \
            tests/test_host_integration_integrated_conformance.py \
            tests/test_host_integration_summary_truth.py \
            tests/test_documentation_control_plane_truth.py
      - name: Commit only canonical assimilation reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AI_INSTRUCTIONS.md README.md docs/stewardship/progress-tracker.md research/roadmaps/host-integration-contract.md tests/test_documentation_control_plane_truth.py tests/test_host_integration_summary_truth.py
          git diff --cached --check
          git commit -m 'Reconcile Fresh-AI assimilation protocol into canonical guidance'
          git push origin HEAD:refs/heads/agent/host-integration-integrated-assimilation
