version: 1.0
status: active
reviewed_at: 2026-08-07
policy: >-
  These worker definitions complete the stable worker layer required by preserved
  specialist role cards. They are additive routing responsibilities only. The
  authoritative specialist role card remains the source of domain methodology,
  boundaries, responsibilities, and output requirements and must not be reduced
  by these worker definitions.

workers:
  automation:
    mission: govern workflow automation and optimization implementation under explicit scope and verification
    owning_team: engineering
    responsibilities: [workflow_automation, integration_design, failure_handling, testing]
    required_capabilities: [coding, high_reasoning, tool_execution, testing]
    preferred_implementations: [gpt-5.6-terra, gpt-5.6-sol, claude-sonnet-5]
    fallbacks: [gemini-3.7-flash, claude-sonnet-5]
    verification: [targeted_tests, integration_validation, independent_review]
    escalation: [production_side_effect, irreversible_automation, authority_boundary_change]

  blockchain:
    mission: coordinate blockchain engineering implementation and review without replacing the authoritative specialist role
    owning_team: engineering
    responsibilities: [protocol_implementation, smart_contract_engineering, integration, testing]
    required_capabilities: [coding, high_reasoning, tool_execution, testing]
    preferred_implementations: [gpt-5.6-terra, gpt-5.6-sol, claude-sonnet-5]
    fallbacks: [gemini-3.7-flash, claude-sonnet-5]
    verification: [targeted_tests, adversarial_review, independent_review]
    escalation: [asset_loss_risk, irreversible_state_change, security_critical]

  game_engineering:
    mission: coordinate game engineering implementation, runtime behavior, and test evidence
    owning_team: engineering
    responsibilities: [gameplay_systems, runtime_integration, performance, testing]
    required_capabilities: [coding, high_reasoning, tool_execution, testing]
    preferred_implementations: [gpt-5.6-terra, gpt-5.6-sol, claude-sonnet-5]
    fallbacks: [gemini-3.7-flash, claude-sonnet-5]
    verification: [build_validation, runtime_tests, regression_review]
    escalation: [platform_contract_change, destructive_migration]

  terminal_ui:
