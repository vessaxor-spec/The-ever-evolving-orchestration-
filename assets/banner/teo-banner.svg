<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">The Ever-Evolving Orchestration banner</title>
  <desc id="desc">A dark technical banner with an astrolabe mark and the project mission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="1110" y1="80" x2="1480" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="50%" r="45%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M0 100h1600M0 200h1600M0 300h1600M0 400h1600"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500M800 0v500M900 0v500M1000 0v500M1100 0v500M1200 0v500M1300 0v500M1400 0v500M1500 0v500"/>
  </g>

  <g transform="translate(1100 48) scale(0.78)">
    <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accent)" stroke-width="18"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="#cbd5e1" stroke-width="6" opacity="0.72"/>
    <circle cx="256" cy="256" r="116" fill="#0f172a" stroke="#e2e8f0" stroke-width="8"/>

    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <path d="M256 36v62"/><path d="M256 414v62"/><path d="M36 256h62"/><path d="M414 256h62"/>
      <path d="M100.4 100.4l43.8 43.8"/><path d="M367.8 367.8l43.8 43.8"/><path d="M411.6 100.4l-43.8 43.8"/><path d="M144.2 367.8l-43.8 43.8"/>
    </g>

    <g fill="#e2e8f0">
      <circle cx="256" cy="86" r="11"/><circle cx="376" cy="136" r="11"/><circle cx="426" cy="256" r="11"/><circle cx="376" cy="376" r="11"/>
      <circle cx="256" cy="426" r="11"/><circle cx="136" cy="376" r="11"/><circle cx="86" cy="256" r="11"/><circle cx="136" cy="136" r="11"/>
    </g>

    <path d="M256 142l31 83 83 31-83 31-31 83-31-83-83-31 83-31z" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linejoin="round"/>
    <path d="M256 164l29 92-29 92-29-92z" fill="#60a5fa" opacity="0.95"/>
    <path d="M164 256l92-29 92 29-92 29z" fill="#2dd4bf" opacity="0.82"/>
    <circle cx="256" cy="256" r="24" fill="#f8fafc"/>
    <circle cx="256" cy="256" r="9" fill="#0f172a"/>

    <g fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="7 10" opacity="0.72">
      <ellipse cx="256" cy="256" rx="205" ry="78" transform="rotate(-24 256 256)"/>
      <ellipse cx="256" cy="256" rx="205" ry="78" transform="rotate(24 256 256)"/>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#f8fafc">
    <text x="110" y="175" font-size="58" font-weight="700" letter-spacing="0.4">The Ever-Evolving Orchestration</text>
    <text x="112" y="235" font-size="30" font-weight="500" fill="#cbd5e1">Models change. Good orchestration endures.</text>
    <text x="112" y="315" font-size="22" fill="#94a3b8">Team-first. Capability-first. Evidence-first.</text>
    <text x="112" y="367" font-size="20" font-weight="600" fill="#5eead4">Navigate by principles. Adapt by evidence.</text>
  </g>

  <g transform="translate(112 407)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748b">
    <text x="0" y="0">Task  →  Mission Control  →  Team  →  Worker  →  Capability  →  Implementation  →  Verification</text>
  </g>
</svg>
