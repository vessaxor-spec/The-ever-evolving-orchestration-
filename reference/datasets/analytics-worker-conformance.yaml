version: 0.1
status: public-draft
reviewed_at: 2026-08-05

policy: >-
  This fixture binds the data-analyst specialist to a dedicated Research Team
  analytics worker. The worker layer is additive and must not replace, compress,
  weaken, or override the authoritative data-analyst role card.

binding:
  specialist: data-analyst
  worker: analytics
  primary_team: research
  risk_profile: high
  role_card: community/specialists/data-analyst.md
  contains:
    responsibilities:
      - analytical_question_scoping
      - data_quality_validation
      - sql_and_dashboard_analysis
      - kpi_funnel_and_pipeline_analysis
      - statistical_inference
      - experiment_design_and_analysis
      - cohort_and_retention_analysis
      - ml_model_qa_and_bias_review
      - forecast_accuracy_analysis
    required_capabilities:
      - quantitative_reasoning
      - statistical_analysis
      - sql_analysis
      - experiment_design
      - data_quality_assessment
      - causal_reasoning
      - visualization_design
      - model_validation
      - reproducible_analysis
    verification:
      - data_quality_and_lineage_check
      - methodology_trace
      - sample_size_and_power_review
      - statistical_significance_recalculation
      - causal_claim_review
      - anomaly_protocol_check
      - reproducibility_check
      - independent_result_review
    escalation:
      - insufficient_or_corrupted_data
      - underpowered_experiment
      - material_method_disagreement
      - protected_attribute_or_bias_risk
      - regulated_or_high_consequence_decision
      - model_leakage_or_integrity_failure
    authority_boundaries:
      - no_data_pipeline_ownership
      - no_business_strategy_decision_substitution
      - no_paid_media_reporting_ownership
      - no_production_data_mutation
      - no_correlation_presented_as_causation
      - no_statistical_claim_without_method_sample_and_uncertainty
