version: 0.5
status: public-draft
reviewed_at: 2026-08-05

scenarios:
  - id: architecture-high-risk
    purpose: Preserve the planning ownership, provider-diverse fallback, and independent verification route for consequential architecture work.
    task:
      task_id: conformance-architecture
      task: Design the service architecture and resolve the irreversible platform tradeoffs.
      task_type: architecture_design
      risk_level: high
    expect:
      equals:
        task_type: architecture_design
        risk_level: high
        selected_team: planning
        selected_worker: architecture
        selected_implementation.model: claude-sonnet-5
        selected_implementation.provider_family: anthropic
        fallback_implementation.model: gemini-3.1-pro-preview
        fallback_implementation.provider_family: google
        verification.team: verification
        verification.implementation.model: gpt-5.6-sol
        verification.independent: true
        verification.human_approval_required: false
      contains:
        required_capabilities:
          - high_reasoning
          - planning
          - technical_context
        verification.method:
          - independent_verifier
          - evidence_or_test_results

  - id: frontend-specialist-dispatch
    purpose: Preserve context-based worker override and matching specialist activation for frontend implementation.
    task:
      task_id: conformance-frontend
      task: Implement the responsive frontend using the frontend engineer specialist.
      task_type: daily_coding
      risk_level: medium
      domain: frontend
      specialist: frontend-engineer
    expect:
      equals:
        task_type: daily_coding
        risk_level: medium
        selected_team: engineering
        selected_worker: frontend
        selected_specialist: frontend-engineer
        specialist_risk_profile: medium
        selected_implementation.model: gpt-5.6-terra
        selected_implementation.provider_family: openai
        fallback_implementation.model: gemini-3.1-pro-preview
        fallback_implementation.provider_family: google
        verification.implementation.model: claude-sonnet-5
        verification.independent: true
      contains:
        required_capabilities:
          - coding
          - visual_reasoning
          - accessibility_awareness
        verification.method:
          - output_validation
          - targeted_review

  - id: blocked-primary-fallback
    purpose: Preserve non-local fallback behavior when the preferred coding implementations are unavailable.
    task:
      task_id: conformance-fallback
      task: Implement a backend endpoint with tests.
      task_type: daily_coding
      risk_level: low
      domain: backend
      constraints:
        blocked_implementations:
          - gpt-5.6-terra
          - gpt-5.6-sol
    expect:
      equals:
        selected_team: engineering
        selected_worker: backend
        selected_implementation.model: gemini-3.1-pro-preview
        selected_implementation.provider_family: google
        fallback_implementation.model: claude-sonnet-5
        fallback_implementation.provider_family: anthropic
        verification.implementation.model: claude-sonnet-5
        verification.independent: true
      contains:
        required_capabilities:
          - coding
          - debugging
          - tool_execution

  - id: code-review-owned-worker
    purpose: Preserve Review Team ownership, the dedicated code-review worker, specialist activation, and provider-diverse fallback.
    task:
      task_id: conformance-code-review
      task: Review this pull request for correctness, scope discipline, and regression risk.
      task_type: code_review
      risk_level: medium
      specialist: code-reviewer
    expect:
      equals:
        risk_level: high
        selected_team: review
        selected_worker: code_review
        selected_specialist: code-reviewer
        specialist_risk_profile: high
        selected_implementation.model: gpt-5.6-terra
        selected_implementation.provider_family: openai
        fallback_implementation.model: gemini-3.1-pro-preview
        fallback_implementation.provider_family: google
        verification.implementation.model: gpt-5.6-sol
        verification.independent: true
        warnings: []
      contains:
        required_capabilities:
          - high_reasoning
          - adversarial_review
          - executable_verification
          - requirements_analysis
        verification.method:
          - independent_verifier
          - evidence_or_test_results

  - id: critical-specialist-risk-elevation
    purpose: Ensure a critical specialist can only elevate task risk and uses a non-Anthropic fallback from the Opus primary.
    task:
      task_id: conformance-security
      task: Review authentication and authorization controls with the security engineer.
      task_type: security_review
      risk_level: low
      specialist: security-engineer
    expect:
      equals:
        risk_level: critical
        selected_team: review
        selected_worker: security
        selected_specialist: security-engineer
        specialist_risk_profile: critical
        selected_implementation.model: claude-opus-5
        selected_implementation.provider_family: anthropic
        fallback_implementation.model: gpt-5.6-sol
        fallback_implementation.provider_family: openai
        verification.implementation.model: gpt-5.6-terra
        verification.human_approval_required: true
      contains:
        verification.method:
          - independent_multi_agent_review
          - executable_verification
          - human_approval
          - audit_trace
          - rollback_plan

  - id: deterministic-research-classification
    purpose: Preserve deterministic deep-research classification, dedicated worker ownership, researcher activation, and provider-diverse fallback.
    task:
      task_id: conformance-research
      task: Investigate the primary technical sources and compare sources for contradictions using the researcher.
      risk_level: low
      specialist: researcher
    expect:
      equals:
        task_type: deep_research
        risk_level: medium
        selected_team: research
        selected_worker: research
        selected_specialist: researcher
        specialist_risk_profile: medium
        selected_implementation.model: gemini-3.1-pro-preview
        selected_implementation.provider_family: google
        fallback_implementation.model: claude-sonnet-5
        fallback_implementation.provider_family: anthropic
        verification.team: verification
        verification.implementation.model: claude-sonnet-5
        verification.independent: true
        verification.human_approval_required: false
        warnings: []
      contains:
        required_capabilities:
          - source_grounding
          - research_reasoning
          - synthesis
          - evidence_validation
          - contradiction_analysis
          - uncertainty_calibration
          - domain_adaptation
        verification.method:
          - output_validation
          - targeted_review
        routing_explanation:
          - Task classified as deep_research by deterministic keyword rules.

  - id: deterministic-market-research-classification
    purpose: Preserve market-specific classification, dedicated worker ownership, market-analyst activation, bounded analysis, and independent verification.
    task:
      task_id: conformance-market-research
      task: Map the competitive landscape and size the TAM SAM SOM with current weak signals using the market analyst.
      risk_level: low
      specialist: market-analyst
    expect:
      equals:
        task_type: market_research
        risk_level: medium
        selected_team: research
        selected_worker: market_research
        selected_specialist: market-analyst
        specialist_risk_profile: medium
        selected_implementation.model: gemini-3.1-pro-preview
        selected_implementation.provider_family: google
        selected_implementation.source: routing.market_research.primary
        fallback_implementation.model: gpt-5.6-sol
        fallback_implementation.provider_family: openai
        verification.team: verification
        verification.implementation.model: claude-sonnet-5
        verification.independent: true
        verification.human_approval_required: false
        warnings: []
      contains:
        required_capabilities:
          - market_intelligence
          - competitive_analysis
          - quantitative_reasoning
          - source_validation
          - current_information_retrieval
          - trend_analysis
          - strategic_synthesis
          - confidence_calibration
        verification.method:
          - output_validation
          - targeted_review
        routing_explanation:
          - Task classified as market_research by deterministic keyword rules.
