scenarios:
  - id: orchestration-route
    purpose: Select governed multi-agent orchestration through Mission Control with independent semantic review.
    task:
      task_id: conformance-orchestration-route
      task: Design a multi-agent pipeline with typed handoff contracts using the agents orchestrator.
      risk_level: low
      specialist: agents-orchestrator
    expect:
      equals:
        task_type: orchestration
        risk_level: high
        selected_team: mission_control
        selected_worker: orchestration
        selected_specialist: agents-orchestrator
        specialist_risk_profile: high
        selected_implementation.model: gpt-5.6-sol
        selected_implementation.source: routing.orchestration.primary
        fallback_implementation.model: gemini-3.1-pro-preview
        verification.team: verification
        verification.implementation.model: claude-sonnet-5
        verification.independent: true
        verification.human_approval_required: false
        warnings: []
      contains:
        required_capabilities:
          - orchestration_reasoning
          - distributed_systems_reasoning
          - schema_design
          - tool_integration
          - risk_analysis
          - observability
        verification.method:
          - independent_verifier
          - explicit_reasoning_summary
          - evidence_or_test_results
          - rollback_or_recovery_plan
        routing_explanation:
          - Task classified as orchestration by deterministic keyword rules.

