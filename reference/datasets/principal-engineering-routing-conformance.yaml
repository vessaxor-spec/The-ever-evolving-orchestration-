version: 1.0
status: active
reviewed_at: 2026-08-06
policy: >-
  These cases exercise every activated principal-engineering route through an
  explicit task type and specialist. Each case begins at low stated risk so the
  specialist risk profile must determine the effective risk. Provider families
  record the expected primary, routine fallback, and independent verifier.

