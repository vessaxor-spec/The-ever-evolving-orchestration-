version: 0.3
status: public-draft
reviewed_at: 2026-08-05
registry_source: registry/models/models.yaml
review_policy: >-
  These aliases are role-based defaults. Replace the concrete implementation
  behind an alias when evidence shows a newer option performs the role better.
  Provider descriptions establish availability and claimed features, not TEO
  benchmark superiority.

profiles:
  terra:
    purpose: engineering execution
    strengths:
      - coding
      - debugging
      - repository editing
      - test execution
      - verification

  sol:
    purpose: difficult synthesis and reasoning
    strengths:
      - architecture
      - tradeoff analysis
      - planning
      - complex review
      - cross-system reasoning

  luna:
    purpose: economical throughput
    strengths:
      - extraction
      - classification
      - transformation
      - routing

models:
  codex-terra:
    provider_family: openai
    concrete_model: gpt-5.6-terra
    availability: current
    role: primary coding and debugging agent
    profile: terra
    preferred_for:
      - implementation
      - debugging
      - refactoring
      - testing
      - executable code review
      - repository verification
    limitations:
      - may require a separate reasoning reviewer for ambiguous architecture
      - availability and usage limits may vary

  codex-sol:
    provider_family: openai
    concrete_model: gpt-5.6-sol
    availability: current
    role: high-reasoning engineering and orchestration agent
    profile: sol
    preferred_for:
      - complex architecture with implementation constraints
      - difficult debugging strategy
      - cross-repository planning
      - high-risk code reasoning
      - orchestration decisions requiring executable context
      - technical verification of architectural assumptions
    limitations:
      - use codex-terra for routine implementation and test execution
      - use an independent verifier for consequential decisions

  codex-luna:
    provider_family: openai
    concrete_model: gpt-5.6-luna
    availability: current
    role: cost-sensitive high-volume implementation
    profile: luna
    preferred_for:
      - extraction
      - classification
      - transformation
      - routing
      - simple high-volume work
    limitations:
      - escalate consequential reasoning and low-confidence results
      - use sampled or targeted verification appropriate to the workload

  gemini-pro:
    provider_family: google
    concrete_model: gemini-3.1-pro-preview
    availability: preview
    role: deep research and large-context fallback
    profile: sol
    preferred_for:
      - deep research
      - long-context analysis
      - grounded comparison
      - coding fallback
      - documentation synthesis
    limitations:
      - preview status must be visible in the dispatch record
      - should not replace executable verification for code changes
      - endpoint availability and deprecation timing may change

  gemini-flash:
    provider_family: google
    concrete_model: gemini-3.6-flash
    availability: stable
    role: fast mapping and multimodal processing
    profile: luna
    preferred_for:
      - extraction
      - classification
      - repository mapping
      - multimodal triage
      - high-volume processing
    limitations:
      - escalate consequential synthesis to a stronger reasoning model

  claude-sonnet:
    provider_family: anthropic
    concrete_model: claude-sonnet-5
    availability: generally_available
    role: architecture, planning, and review
    profile: sol
    preferred_for:
      - architecture
      - requirements analysis
      - implementation planning
      - semantic review
      - adversarial challenge
    limitations:
      - coding work should be executed and tested by a coding agent where available

  claude-opus:
    provider_family: anthropic
    concrete_model: claude-opus-5
    availability: generally_available
    role: high-consequence reasoning escalation
    profile: sol
    preferred_for:
      - unresolved ambiguity
      - security-sensitive reasoning
      - difficult cross-system decisions
      - disagreement resolution
    limitations:
      - reserve for cases where added reasoning depth justifies cost and latency

  claude-fable:
    provider_family: anthropic
    concrete_model: claude-fable-5
    availability: generally_available
    role: candidate maximum-capability escalation
    profile: sol
    preferred_for:
      - long-running agentic work
      - critical cross-system reasoning
      - cases where current routing defaults remain inconclusive
    limitations:
      - not an automatic default
      - requires evidence that the added capability is relevant to the task

  claude-haiku:
    provider_family: anthropic
    concrete_model: claude-haiku-4-5
    provider_model_id: claude-haiku-4-5-20251001
    availability: generally_available
    role: fast low-cost language work
    profile: luna
    preferred_for:
      - classification
      - summaries
      - formatting
      - simple transformations
    limitations:
      - not the default for consequential reasoning

  local-coder:
    provider_family: local_ollama
    role: private or offline coding fallback
    profile: terra
    candidate_implementations:
      - qwen-coder
      - deepseek-coder
      - codellama
    required_execution_metadata:
      - exact_model_tag_or_digest
      - quantization
      - context_configuration
      - runtime_version
      - hardware
    limitations:
      - capability depends on hardware, quantization, context, and tool integration

  local-model:
    provider_family: local_ollama
    role: private or economical throughput fallback
    profile: luna
    candidate_implementations:
      - qwen
      - llama
      - mistral
    required_execution_metadata:
      - exact_model_tag_or_digest
      - quantization
      - context_configuration
      - runtime_version
      - hardware
    limitations:
      - validate quality against the intended workload
