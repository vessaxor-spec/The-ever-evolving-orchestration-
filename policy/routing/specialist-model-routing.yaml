version: 1.0
status: active
reviewed_at: '2026-08-07'
policy: Specialist-aware implementation refinement is additive. Team and worker routing resolve first. Specialist routing
  may refine model and reasoning effort only; it cannot change team authority, specialist capability, qualified-human requirements,
  or independent verification.
rules:
- team_and_worker_route_resolves_before_specialist_model_refinement
- specialist_model_refinement_must_preserve_provider_diverse_routine_fallback
- verifier_must_be_independent_from_primary
- critical_risk_keeps_qualified_human_approval
- preview_models_must_remain_visible_in_dispatch
- max_effort_and_pro_mode_are_conditional_not_routine_defaults
- connection_method_does_not_affect_model_selection
templates:
  opus_critical_reasoning:
    primary:
      agent: claude
      model: claude-opus-5
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: xhigh
    fallback:
      agent: codex
      model: gpt-5.6-sol
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: xhigh
    verifier:
      agent: agy
      model: gemini-3.1-pro-preview
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: high
    conditional_effort_escalation:
      model: claude-fable-5
      reasoning: max
      use_when:
      - unresolved_material_disagreement_after_opus_review
      - critical_cross_system_ambiguity_after_standard_escalation
      - long_horizon_agentic_reasoning_where_quality_gain_is_decision_relevant
  sol_deep_engineering:
    primary:
      agent: codex
      model: gpt-5.6-sol
      reasoning_by_risk:
        low: medium
        medium: high
        high: xhigh
        critical: xhigh
    fallback:
      agent: claude
      model: claude-sonnet-5
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: xhigh
    verifier:
      agent: agy
      model: gemini-3.1-pro-preview
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: high
    conditional_effort_escalation:
      model: gpt-5.6-sol
      reasoning: max
      mode: pro
      use_when:
      - repeated_execution_or_reasoning_failure
      - high_value_code_or_review_with_clear_evals
      - unresolved_cross_repository_invariant
  terra_engineering_execution:
    primary:
      agent: codex
      model: gpt-5.6-terra
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: xhigh
    fallback:
      agent: agy
      model: gemini-3.6-flash
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: high
    verifier:
      agent: claude
      model: claude-sonnet-5
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: high
    conditional_escalation:
      agent: codex
      model: gpt-5.6-sol
      reasoning: high
      use_when:
      - task_expands_across_components
      - architecture_or_migration_constraints_dominate
      - repeated_implementation_failure
  gemini_research:
    primary:
      agent: agy
      model: gemini-3.1-pro-preview
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: high
    fallback:
      agent: claude
      model: claude-sonnet-5
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: xhigh
    verifier:
      agent: codex
      model: gpt-5.6-sol
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: xhigh
    conditional_escalation:
      agent: claude
      model: claude-opus-5
      reasoning: high
      use_when:
      - sources_materially_disagree
      - decision_is_high_consequence
      - evidence_synthesis_remains_ambiguous
  sonnet_semantic:
    primary:
      agent: claude
      model: claude-sonnet-5
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: xhigh
    fallback:
      agent: codex
      model: gpt-5.6-sol
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: xhigh
    verifier:
      agent: agy
      model: gemini-3.1-pro-preview
      reasoning_by_risk:
        low: medium
        medium: high
        high: high
        critical: high
    conditional_escalation:
      agent: claude
      model: claude-opus-5
      reasoning: high
      use_when:
      - high_consequence_strategy
      - material_ambiguity_or_disagreement
      - long_horizon_agentic_planning
  gemini_flash_multimodal:
    primary:
      agent: agy
      model: gemini-3.6-flash
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: high
    fallback:
      agent: codex
      model: gpt-5.6-terra
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: xhigh
    verifier:
      agent: claude
      model: claude-sonnet-5
      reasoning_by_risk:
        low: medium
        medium: medium
        high: high
        critical: high
    conditional_escalation:
      agent: agy
      model: gemini-3.1-pro-preview
      reasoning: high
      use_when:
      - multimodal_interpretation_is_ambiguous
      - long_context_cross_modal_synthesis_required
  luna_throughput:
    primary:
      agent: agy
      model: gemini-3.5-flash-lite
      reasoning_by_risk:
        low: low
        medium: medium
        high: high
        critical: high
    fallback:
      agent: claude
      model: claude-haiku-4-5
      reasoning: default
    verifier:
      agent: codex
      model: gpt-5.6-luna
      reasoning_by_risk:
        low: low
        medium: medium
        high: high
        critical: high
    conditional_escalation:
      agent: claude
      model: claude-sonnet-5
      reasoning: medium
      use_when:
      - task_contains_material_ambiguity
      - sampled_outputs_fail_validation
      - synthesis_exceeds_throughput_scope
