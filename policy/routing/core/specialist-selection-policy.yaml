version: 2.0
status: active
reviewed_at: '2026-08-23'
policy: Specialists remain model- and provider-independent responsibility definitions. This policy assigns only provider-neutral
  runtime selection profiles; concrete implementation defaults live exclusively in policy/routing/core/runtime-compatibility-defaults.yaml.
rules:
- team_and_worker_route_resolves_before_specialist_selection_profile
- selection_profile_cannot_change_team_worker_specialist_or_authority
- selection_profile_cannot_widen_risk_or_live_scope
- concrete_implementation_selection_remains_runtime_bound
- connection_method_does_not_affect_runtime_fitness
profiles:
  critical_reasoning:
    purpose: high-consequence reasoning with provider-diverse fallback and verification
  deep_engineering:
    purpose: deep technical reasoning and implementation-aware verification
  engineering_execution:
    purpose: implementation, debugging, and executable verification
  research_synthesis:
    purpose: current evidence synthesis with independent technical challenge
  semantic_synthesis:
    purpose: requirements, strategy, writing, and semantic review
  multimodal_analysis:
    purpose: visual and cross-modal interpretation with technical follow-up
  throughput:
    purpose: bounded economical throughput with sampled or targeted verification
