version: 0.8
status: public-draft

routing_order:
  - mission_control
  - team
  - worker
  - specialist
  - capability
  - implementation
  - verification

mission_control:
  responsibilities:
    - classify_task
    - assess_risk
    - identify_capabilities
    - select_teams
    - select_workers
    - select_specialists
    - sequence_work
    - assign_fallbacks
    - assign_verification
    - assemble_result

team_routes:
  orchestration:
    primary_team: mission_control
    primary_worker: orchestration
    supporting_teams:
      - planning
      - engineering
      - verification
    verification_team: verification

  operations:
    primary_team: mission_control
    primary_worker: operations
    supporting_teams:
      - planning
      - review
      - verification
    verification_team: verification

  project_delivery:
    primary_team: mission_control
    primary_worker: project_delivery
    supporting_teams:
      - planning
      - engineering
      - verification
    verification_team: verification

  incident_response:
    primary_team: mission_control
    primary_worker: incident_response
    supporting_teams:
      - engineering
      - review
      - verification
    verification_team: verification
    human_approval_for:
      - critical

  architecture_design:
    primary_team: planning
    primary_worker: architecture
    supporting_teams:
      - research
      - review
    verification_team: verification

  daily_coding:
    primary_team: engineering
    primary_worker: backend
    worker_override_by_context:
      frontend: frontend
      mobile: mobile
      database: database
      data_pipeline: data_engineering
      ai_system: ai_engineering
      deployment: devops
    review_team: review
    verification_team: verification

  deep_debugging:
    primary_team: engineering
    primary_worker: backend
    worker_override_by_context:
      frontend: frontend
      mobile: mobile
      database: database
      data_pipeline: data_engineering
      ai_system: ai_engineering
      deployment: devops
      infrastructure: infrastructure
    supporting_workers:
      - performance
      - database
      - devops
    review_team: review
    verification_team: verification

  repo_wide_refactor:
    primary_team: planning
    primary_worker: architecture
    execution_team: engineering
    execution_worker: backend
    execution_worker_override_by_context:
      frontend: frontend
      mobile: mobile
      database: database
      data_pipeline: data_engineering
      ai_system: ai_engineering
      deployment: devops
      infrastructure: infrastructure
    review_team: review
    verification_team: verification

  deep_research:
    primary_team: research
    primary_worker: research
    supporting_team: review
    verification_team: verification

  market_research:
    primary_team: research
    primary_worker: market_research
    supporting_teams:
      - planning
      - review
    verification_team: verification

  code_review:
    primary_team: review
    primary_worker: code_review
    supporting_workers:
      - security
      - performance
      - accessibility
    verification_team: verification

  security_review:
    primary_team: review
    primary_worker: security
    execution_team: engineering
    verification_team: verification
    human_approval_for:
      - critical

  multimodal_analysis:
    primary_team: research
    primary_worker: documentation
    route_visual_implementation_to:
      team: engineering
      worker: frontend
    verification_team: verification

  high_volume_simple:
    primary_team: research
    primary_worker: documentation
    verification_team: verification
    verification_method: sampled_review

  documentation:
    primary_team: research
    primary_worker: documentation
    supporting_teams:
      - engineering
      - review
    verification_team: verification

  release:
    primary_team: verification
    primary_worker: release
    supporting_teams:
      - engineering
      - documentation
      - review

specialist_resolution:
  registry: community/specialists/specialists.yaml
  methodology: docs/methodology/specialist-allocation.md
  selection_order:
    - confirm_primary_team
    - confirm_worker_binding
    - match_specialist_domain
    - check_authority_and_boundaries
    - check_risk_and_human_approval
    - assign_supporting_teams
    - assign_verification
  rules:
    - specialists_do_not_replace_core_teams
    - team_selection_precedes_specialist_selection
    - specialist_worker_binding_must_match_task_capability
    - specialist_risk_must_be_satisfied_by_verification
    - regulated_decisions_require_qualified_human_approval
    - specialist_creator_credit_must_be_preserved
    - a_specialist_cannot_be_the_sole_planner_executor_reviewer_and_verifier
  optional: true

implementation_resolution:
  sources:
    - policy/routing/routing.yaml
    - policy/routing/mission-control-routing.yaml
    - policy/routing/research-routing.yaml
  model_registry: models.yaml
  rule: >-
    Resolve the selected worker and optional specialist to the best currently
    available implementation using capability fit, task risk, context, cost,
    latency, tool access, availability, and verification requirements.

required_dispatch_record:
  - task_type
  - risk_level
  - selected_team
  - selected_worker
  - selected_specialist
  - specialist_source
  - specialist_risk_profile
  - required_capabilities
  - selected_implementation
  - fallback_implementation
  - verification_team
  - verification_method
  - routing_explanation
