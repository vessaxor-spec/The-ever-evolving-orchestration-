activation_gates:
  - team_charter_exists
  - worker_definition_exists
  - specialist_card_exists
  - routing_policy_exists
  - capability_mapping_exists
  - provider_diverse_fallback_exists
  - independent_verification_defined
  - conformance_dataset_exists
  - critical_risk_has_qualified_human_approval
  - freshness_policy_present
  - canonical_preservation_test_present

routing_rules:
  - team_selection_precedes_worker_and_specialist_selection
  - new_teams_are_not_active_until_all_activation_gates_pass
  - specialist_allocation_is_additive_and_must_not_reduce_existing_capability
  - system_lifecycle_work_must_not_route_to_rust_systems_programming_by_name_collision
  - physical_systems_work_requires_systems_engineering_handoff_when_interfaces_or_lifecycle_baselines_change
  - assurance_produces_claims_and_evidence_requirements_but_does_not_self_verify
  - critical_privacy_safety_security_database_reliability_and_physical_decisions_require_qualified_human_approval
  - evidence_pilot_scope_remains_exactly_six_until_its_maintainability_gate_passes

implementation_sequence:
  - team_architecture
  - platform_and_systems
  - physical_systems
  - assurance
  - planning_engineering_research
  - conformance_and_routing
  - completion_capsule
