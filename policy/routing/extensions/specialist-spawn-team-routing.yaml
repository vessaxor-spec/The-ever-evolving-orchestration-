version: 1.0
status: active
reviewed_at: 2026-08-07
policy: >-
  These explicit routes make every preserved specialist spawnable without broad
  keyword activation. Team selection remains explicit. Worker selection is then
  resolved from the declared domain/context before the requested specialist is
  matched, preserving the Team -> Worker -> Specialist authority order.

team_routes:
  specialist_mission_control:
    primary_team: mission_control
    primary_worker: orchestration
    worker_override_by_context:
      orchestration: orchestration
      incident_response: incident_response
      operations: operations
      project_delivery: project_delivery
    verification_team: verification

