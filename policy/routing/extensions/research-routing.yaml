version: 0.3
status: active
reviewed_at: 2026-08-06

policy: >-
  These implementation routes are first-class Research Team routes. They are
  loaded alongside the shared routing policy without changing or weakening the
  authoritative specialist specifications or broad-domain research route.

routing:
  user_research:
    primary:
      agent: claude
      model: claude-sonnet-5
      profile: sol
      reasoning: high
      purpose: synthesize interviews, surveys, usability findings, support evidence, reviews, and other user feedback into traceable qualitative insights with explicit uncertainty
    fast_collection:
      agent: agy
      model: gemini-3.7-flash
      profile: luna
      reasoning: medium
      purpose: inventory, extract, normalize, and map high-volume feedback sources without deciding themes or product priorities
    fallback:
      agent: agy
      model: gemini-3.1-pro
      profile: sol
      reasoning: high
      purpose: preserve qualitative synthesis and mixed-method reasoning when the Anthropic route is unavailable
    verifier:
      agent: codex
      model: gpt-5.6-sol
      profile: sol
      reasoning: high
      purpose: independently challenge source traceability, sampling limits, theme construction, contradictory evidence, confidence, privacy, and decision framing
    quantitative_verifier:
      agent: codex
      model: gpt-5.6-terra
      profile: terra
      reasoning: high
      use_when:
        - structured_survey_or_feedback_dataset_is_available
        - quantitative_corroboration_requires_recalculation
        - segment_or_trend_claims_require_execution
    escalation:
      agent: claude
      model: claude-opus-5
      profile: sol
      reasoning: high
      use_when:
        - vulnerable_or_protected_population
        - regulated_or_high_consequence_use
        - sensitive_personal_data_or_reidentification_risk
        - missing_consent_or_unclear_research_authority
        - materially_biased_or_nonrepresentative_sample
        - unresolved_conflict_between_qualitative_and_quantitative_evidence
        - irreversible_product_or_policy_commitment
        - evidence_does_not_support_the_requested_recommendation
    required_controls:
      - research_question_and_method_statement
      - collection_method_and_sample_trace
      - atomic_observation_to_theme_trace
      - quote_context_and_provenance
      - contradiction_and_negative_case_review
      - confidence_and_limitation_reporting
      - privacy_consent_and_reidentification_review
      - independent_verification

  analytics:
    primary:
      agent: codex
      model: gpt-5.6-sol
      profile: sol
      reasoning: high
      purpose: perform reproducible quantitative analysis, statistical reasoning, experiment evaluation, model QA, and decision-focused synthesis
    data_execution:
      agent: codex
      model: gpt-5.6-terra
      profile: terra
      reasoning: high
      purpose: execute SQL, Python, statistical calculations, data validation, and reproducibility checks when tools or datasets are available
    benchmark_research:
      agent: agy
      model: gemini-3.1-pro
      profile: sol
      reasoning: high
      purpose: retrieve current benchmarks, model-evaluation guidance, tool documentation, and external analytical context
    fallback:
      agent: agy
      model: gemini-3.1-pro
      profile: sol
      reasoning: high
      purpose: preserve analytical continuity when the OpenAI route is unavailable
    verifier:
      agent: claude
      model: claude-sonnet-5
      profile: sol
      reasoning: high
      purpose: independently challenge methodology, causal claims, statistical power, uncertainty, bias, and decision framing
    reproducibility_verifier:
      agent: codex
      model: gpt-5.6-terra
      profile: terra
      reasoning: high
      use_when:
        - dataset_or_query_is_available
        - statistical_results_can_be_recalculated
        - dashboard_or_model_outputs_require_execution
    escalation:
      agent: claude
      model: claude-opus-5
      profile: sol
      reasoning: high
      use_when:
        - regulated_or_high_consequence_decision
        - protected_attribute_or_material_bias_risk
        - unresolved_methodological_disagreement
        - financial_or_forecast_commitment
        - model_leakage_or_integrity_failure
        - evidence_does_not_support_a_go_no_go_recommendation
    required_controls:
      - data_quality_validation
      - methodology_trace
      - sample_size_and_power_check
      - uncertainty_and_confidence_reporting
      - causal_claim_review
      - reproducibility_evidence
      - independent_verification

  market_research:
    primary:
      agent: agy
      model: gemini-3.1-pro
      profile: sol
      reasoning: high
      purpose: gather current market evidence, map competitors, size bounded opportunities, and synthesize strategic signals
    fast_collection:
      agent: agy
      model: gemini-3.7-flash
      profile: luna
      reasoning: medium
      purpose: collect current competitor, pricing, funding, hiring, patent, search, and category signals
    fallback:
      agent: codex
      model: gpt-5.6-sol
      profile: sol
      reasoning: high
      purpose: reconstruct market logic and quantitative methodology when the primary route is unavailable
    verifier:
      agent: claude
      model: claude-sonnet-5
      profile: sol
      reasoning: high
      purpose: independently challenge market boundaries, source quality, estimates, lifecycle alignment, and strategic conclusions
    technical_verifier:
      agent: codex
      model: gpt-5.6-sol
      profile: sol
      reasoning: high
      use_when:
        - market_sizing_math_requires_validation
        - quantitative_model_or_dataset_is_provided
        - ai_search_or_discovery_claims_require_technical_review
    escalation:
      agent: claude
      model: claude-opus-5
      profile: sol
      reasoning: high
      use_when:
        - materially_conflicting_market_sources
        - single_source_market_size
        - regulated_or_high_consequence_market
        - investment_or_financial_decision_requested
        - irreversible_market_entry_commitment
        - insufficient_evidence_for_strategic_recommendation
