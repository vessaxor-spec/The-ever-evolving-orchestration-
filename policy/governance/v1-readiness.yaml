version: "1.1"
status: active
reviewed_at: 2026-08-10

v1_definition:
  target: credible_vendor_neutral_orchestration_specification_with_runnable_reference_control_plane
  production_distributed_platform_required: false
  functional_reference_release_may_precede_human_calibration: true
  provider_access_provisioning_owned_by_teo: false
  caller_or_integrator_owns_valid_model_access: true

required_for_v1:
  architecture_and_governance_complete: true
  deterministic_routing_and_risk_controls: true
  provider_diverse_fallback_and_verification: true
  guarded_live_provider_execution_available: true
  retry_fallback_circuit_telemetry_controls_available: true
  calibration_instrumentation_available: true
  provisional_machine_panel_path_available: true
  reproducible_ci_green: true
  model_freshness_governance_active: true
  provider_access_separation_governance_active: true

not_required_to_tag_v1:
  independent_human_calibration_complete: false
  human_ground_truth_quality_claim: false
  teo_managed_api_key_provisioning: false
  teo_managed_oauth_login: false
  teo_managed_subscription_entitlement: false
  teo_managed_credential_broker: false
  distributed_circuit_state_coordination: false
  distributed_telemetry_export: false
  streaming_runtime: false
  source_backed_cost_attribution: false
  route_outcome_learning: false
  qualified_human_approval_integration: false

provider_access_boundary:
  policy: policy/governance/provider-access-separation.yaml
  routing_must_be_authentication_method_neutral: true
  api_key_access_supported_by_reference_helpers: true
  oauth_or_subscription_access_may_be_supplied_by_integrating_runtime: true
  alternative_provider_supported_access_may_be_supplied_by_integrating_runtime: true
  reference_api_key_evidence_workflow_is_convenience_harness: true
  reference_api_key_evidence_workflow_defines_teo_access_requirement: false

provisional_operational_evidence:
  policy: policy/verification/verifier-calibration-machine-panel.yaml
  allowed_for_v1_readiness_evidence: true
  human_ground_truth_equivalent: false
  may_authorize_quality_claims: false
  may_expand_live_scope: false
  may_change_routes_automatically: false
  may_remove_human_review_tier: false

human_stewardship:
  blocking_for_functional_v1_release: false
  blocking_for_human_ground_truth_claims: true
  blocking_for_evidence_based_scope_expansion: false
  blocking_for_future_route_changes_when_policy_requires_human_acceptance: false
  preferred_execution_model: optional_public_research
  issue_tracker: 75

authority_boundary:
  critical_effective_risk_still_requires_qualified_human_approval: true
  machine_panel_must_never_be_labeled_human_review: true
  absence_of_human_calibration_must_be_disclosed: true
  provisional_evidence_must_remain_provisional: true
  access_mechanism_must_not_become_routing_authority: true

release_states:
  - id: reference_operational
    description: Architecture, runnable control plane, guarded live paths, verification, CI, and provisional evidence machinery are operational; access to selected models is supplied by the caller or integrating runtime.
  - id: human_calibrated
    description: An optional independent blinded human calibration study has been completed and can support specifically scoped human-validation claims.

policy: >-
  TEO v1 is a functional reference-system milestone, not a provider-account provisioning
  product and not a claim that every future production hardening feature or optional human
  calibration study is complete. TEO owns model-routing correctness; callers and integrating
  runtimes own valid access to the selected implementation through API keys, OAuth or
  subscription-backed sessions, delegated identity, connectors, or other provider-supported
  mechanisms. Access method must not alter model-routing semantics. Independent human
  calibration is an optional evidence-enhancement mechanism. It is required only before
  making a specifically scoped claim that verifier evidence has been independently
  human-validated; it does not authorize or veto releases, routing changes, live-scope
  decisions, model selection, or architectural evolution. Qualified human approval remains
  mandatory wherever the underlying task or effective-risk policy independently requires it.
