version: 1.0
status: active
effective_at: 2026-08-10

purpose: >-
  Define the canonical repository placement contract for TEO so current authority,
  historical state, research, evidence, runtime implementation, and community artifacts
  remain distinguishable as the project evolves.

principles:
  - authority_before_convenience
  - lifecycle_before_subject_detail
  - stable_doctrine_separate_from_volatile_evidence
  - active_policy_separate_from_historical_activation_state
  - research_separate_from_normative_assertions
  - implementation_separate_from_policy
  - specialist_identity_separate_from_current_team_allocation
  - accepted_capsules_remain_immutable_history
  - temporary_exceptions_do_not_create_new_precedent

root:
  allowed_files:
    - README.md
    - AI_INSTRUCTIONS.md
    - CONSTITUTION.md
    - CHANGELOG.md
    - CODE_OF_CONDUCT.md
    - LICENSE
    - pyproject.toml
    - .gitignore
  temporary_exceptions: {}
  allowed_directories:
    - .github
    - assets
    - ci
    - community
    - docs
    - policy
    - reference
    - registry
    - research
    - tests

zones:
  community:
    authority: role_and_participation_definitions
    lifecycle: mixed_with_explicit_immutable_history
  docs:
    authority: informative_unless_a_document_explicitly_states_normative_status
    lifecycle: stable_methods_and_versioned_history_must_be_separated
  policy:
    authority: normative_machine_readable_control
    lifecycle: active_policy_only_except_declared_temporary_exceptions
  registry:
    authority: versioned_current_ecosystem_evidence
    lifecycle: current_and_effective_dated
  reference:
    authority: executable_reference_and_conformance_artifacts
    lifecycle: current_reference_behavior
  research:
    authority: non_normative_evidence_and_exploration
    lifecycle: dated_or_topic_scoped
  tests:
    authority: executable_conformance_and_regression_controls
    lifecycle: current

contracts:
  policy_routing:
    path: policy/routing
    active_direct_files: []
    temporary_direct_exceptions: []
    approved_subdirectories:
      - core
      - extensions
      - activation
    canonical_subdirectories:
      core:
        - implementation-defaults.yaml
        - routing.yaml
        - runtime-compatibility-defaults.yaml
        - specialist-selection-policy.yaml
        - team-routing.yaml
      extensions:
        - mission-control-routing.yaml
        - principal-engineering-routing.yaml
        - principal-engineering-team-routing.yaml
        - research-routing.yaml
        - review-routing.yaml
        - specialist-spawn-routing.yaml
        - specialist-spawn-team-routing.yaml
      activation:
        - principal-engineering.yaml
        - workforce-expansion.yaml
    future_rule: >-
      Direct routing YAML is prohibited. Canonical base policy belongs in core, additive
      active routes belong in extensions, and current activation manifests belong in
      activation. Superseded staging and activation state belongs under docs/history.

  community_workers:
    path: community/workers
    canonical_direct_files:
      - README.md
      - workers.yaml
    temporary_direct_extensions: []
    approved_subdirectories:
      - extensions
    canonical_extensions:
      - analytics-worker.yaml
      - assurance-workers.yaml
      - compliance-worker.yaml
      - incident-response-worker.yaml
      - market-research-worker.yaml
      - physical-systems-workers.yaml
      - platform-reliability-core-workers.yaml
      - platform-reliability-operations-workers.yaml
      - principal-engineering-active-workers.yaml
      - research-worker.yaml
      - runtime-worker-overrides.yaml
      - specialist-completion-workers.yaml
      - systems-engineering-worker.yaml
      - user-research-worker.yaml
    future_rule: >-
      Direct worker-extension YAML is prohibited. Stable base workers remain in
      workers.yaml and additive active worker definitions belong in extensions.
      Superseded worker staging state belongs under docs/history.

  docs_methodology:
    path: docs/methodology
    evergreen_direct_files:
      - README.md
      - community-conversations.md
      - main-branch-protection.md
      - provider-aware-fallbacks.md
      - regulated-specialist-evidence-pilot-2026-08-06.md
      - routing-validation.md
      - specialist-allocation.md
      - specialist-freshness.md
    temporary_history_exceptions: []
    future_history_location: docs/history
    future_rule: >-
      Methodology contains reusable methods. Dated records of staging, activation,
      remediation, validation, or audit execution belong in history unless they remain
      an explicitly active methodology artifact.

  docs_history:
    path: docs/history
    canonical_direct_files:
      - README.md
    temporary_direct_exceptions: []
    approved_subdirectories:
      - activation
      - audits
      - validation
    future_rule: >-
      New historical records should be placed in the applicable lifecycle subdirectory
      rather than directly under docs/history.

  research:
    path: research
    temporary_direct_exceptions: []
    approved_subdirectories:
      - roadmaps
      - models
      - runtime
    future_rule: >-
      New research must be topic-scoped. Direct research files require an explicit
      exception and do not become normative by location or age.

  specialists:
    path: community/specialists
    flat_identity_namespace: true
    allowed_metadata_files:
      - README.md
      - PRESERVATION.md
      - specialists.yaml
      - principal-engineering-active.yaml
      - workforce-expansion-active.yaml
    future_rule: >-
      Specialist role cards remain in one flat identity namespace. Do not create
      team-based specialist subdirectories because allocation may change without
      changing specialist identity.

  capsules:
    path: community/capsules
    flat_namespace: true
    index_file: README.md
    filename_pattern: '^[0-9]{4}-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.md$'
    immutable_after_acceptance: true

  reference_datasets:
    path: reference/datasets
    disposition: retain
    rationale: >-
      The directory already coherently contains public fixtures and datasets used for
      examples, evaluation, and conformance. Renaming it would add churn without
      improving authority clarity.

migration:
  completed_phases:
    - R1_layout_constitution
    - R2_root_and_research_normalization
    - R3_documentation_lifecycle_separation
    - R4_policy_topology
    - R5_worker_and_implementation_topology
  current_phase: complete
  sequence:
    - R1_layout_constitution
    - R2_root_and_research_normalization
    - R3_documentation_lifecycle_separation
    - R4_policy_topology
    - R5_worker_and_implementation_topology
  rule: >-
    Each migration phase must update path consumers, tests, documentation, and CI
    atomically. Existing v1 paths remain valid only where this file declares a temporary
    exception.
