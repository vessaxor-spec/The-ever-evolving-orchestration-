        consequential_use: true
        applicability:
          jurisdiction: United States
          scope: federal civil litigation and electronically stored information
        authority:
          tier: 1
          organization: Administrative Office of the United States Courts
          source_type: primary_law
          url: https://www.uscourts.gov/forms-rules/current-rules-practice-procedure/federal-rules-civil-procedure
          expected_hosts: [www.uscourts.gov]
          locator: Current Federal Rules of Civil Procedure, December 1 2025, Rule 37(e); the preservation rewrite became effective December 1 2015
          source_date_basis: observed
          source_date: 2026-08-11
        verified_at: 2026-08-11
        expires_at: 2026-11-09
