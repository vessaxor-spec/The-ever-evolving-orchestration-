version: 0.2
status: pilot
reviewed_at: 2026-08-11
purpose: Prove maintainable evidence-backed freshness for consequential specialist use before any registry-wide rollout.

controls:
  consequential_use_requires_unexpired_evidence: true
  high_and_critical_require_independent_verification: true
  stale_or_unavailable_behavior: refuse_consequential_claim
  conflicting_authorities_behavior: escalate_and_present_conflict
