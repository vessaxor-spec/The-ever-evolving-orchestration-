    claims:
      - id: legal-us-frcp-37e-preservation
        statement: Rule 37(e) applies when electronically stored information that should have been preserved in anticipation or conduct of United States federal civil litigation is lost because reasonable preservation steps were not taken and the information cannot be restored or replaced through additional discovery.
