[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teo-reference-router"
version = "0.1.0"
description = "Minimal runnable reference router for The Ever-Evolving Orchestration"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
teo = "teo_reference.cli:main"

[tool.setuptools]
package-dir = {"" = "reference/implementations/python/src"}

[tool.setuptools.packages.find]
where = ["reference/implementations/python/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
